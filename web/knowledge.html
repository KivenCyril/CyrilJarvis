<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - 知识库</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-hover:     #1c2d42;
  --bg-input:     #0c1322;
  --border:       #1e2d40;
  --border-light: #2d4054;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #5a6d82;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --purple:       #a855f7;
  --yellow:       #eab308;
  --red:          #ef4444;
  --radius:       8px;
  --radius-lg:    12px;
  --transition:   200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; overflow: hidden; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }

/* ── Top Bar ─────────────────────────────────────────────── */
.topbar {
  height: 50px; background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 50; position: relative;
}
.topbar::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2) 50%, transparent); }
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(99,102,241,0.35); }
.topbar-logo svg { width: 16px; height: 16px; color: #fff; }
.topbar-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #93c5fd, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.topbar-page { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-left: 8px; }
.topbar-spacer { flex: 1; }
.topbar-btn { width: 34px; height: 34px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: var(--transition); }
.topbar-btn:hover { background: var(--bg-hover); color: var(--text-dim); }
.topbar-btn svg { width: 17px; height: 17px; }

/* ── Layout ──────────────────────────────────────────────── */
.page-layout { flex: 1; display: grid; grid-template-columns: 248px 1fr; overflow: hidden; transition: grid-template-columns 300ms cubic-bezier(0.16,1,0.3,1); }
.page-layout.sidebar-collapsed { grid-template-columns: 0px 1fr; }

/* ── Sidebar ─────────────────────────────────────────────── */
.page-sidebar {
  background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  width: 248px; min-width: 248px; max-width: 248px;
  transition: all 300ms cubic-bezier(0.16,1,0.3,1);
}
.sidebar-collapsed .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.page-sidebar-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 16px; }
.nav-group { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(30,45,64,0.6); }
.nav-group:last-child { border-bottom: none; }
.nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-muted); font-weight: 600; padding: 10px 10px 5px; user-select: none; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim); text-decoration: none; transition: var(--transition); position: relative; border: 1px solid transparent; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; border-color: var(--border); }
.nav-item.active { background: rgba(59,130,246,0.08); color: var(--accent-hover); font-weight: 500; border-color: rgba(59,130,246,0.15); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.55; }
.nav-item:hover svg { opacity: 0.8; }
.nav-item.active svg { opacity: 1; }

.page-content { overflow: hidden; display: flex; }

@media (max-width: 1024px) {
  .page-layout { grid-template-columns: 0px 1fr; }
  .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
}

/* ── Knowledge Graph Specific ─────────────────────────────── */
.kg-panel {
  width: 280px; min-width: 280px; background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
}
.kg-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.kg-section:last-child { border-bottom: none; }
.kg-section-title {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.kg-section-title svg { width: 12px; height: 12px; opacity: 0.6; }

.kg-search { display: flex; gap: 8px; }
.kg-search input {
  flex: 1; padding: 8px 12px; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 13px; font-family: var(--font);
  transition: var(--transition);
}
.kg-search input:focus { outline: none; border-color: var(--accent); }
.kg-search button {
  padding: 8px 14px; background: var(--accent); color: #fff; border-radius: var(--radius);
  font-size: 13px; font-weight: 500; border: none; cursor: pointer; font-family: var(--font);
  transition: var(--transition);
}
.kg-search button:hover { background: var(--accent-hover); }

.kg-stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.kg-stat-item {
  padding: 10px; background: var(--bg-surface); border-radius: var(--radius);
  border: 1px solid var(--border); text-align: center;
}
.kg-stat-value { font-size: 20px; font-weight: 700; color: var(--accent); }
.kg-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.kg-legend { display: flex; flex-direction: column; gap: 4px; }
.kg-legend-item {
  display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim);
  cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: var(--transition);
}
.kg-legend-item:hover { background: var(--bg-hover); }
.kg-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

.kg-form-group { margin-bottom: 10px; }
.kg-form-group label {
  display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px;
}
.kg-form-group input, .kg-form-group select {
  width: 100%; padding: 7px 10px; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 13px; font-family: var(--font);
  transition: var(--transition);
}
.kg-form-group input:focus, .kg-form-group select:focus { outline: none; border-color: var(--accent); }
.kg-btn-add {
  width: 100%; padding: 8px; background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer;
  font-family: var(--font); transition: var(--transition); margin-top: 4px;
}
.kg-btn-add:hover { background: var(--accent-hover); }
.kg-btn-outline {
  width: 100%; padding: 8px; background: transparent; color: var(--accent); border: 1px solid var(--accent);
  border-radius: var(--radius); font-size: 13px; cursor: pointer; margin-top: 6px;
  font-family: var(--font); transition: var(--transition);
}
.kg-btn-outline:hover { background: rgba(59,130,246,0.1); }

/* ── Graph Canvas ─────────────────────────────────────────── */
.kg-canvas-wrap { flex: 1; position: relative; overflow: hidden; background: var(--bg-deep); }
.kg-canvas-wrap svg { width: 100%; height: 100%; }

/* ── Node Detail Panel ────────────────────────────────────── */
.kg-detail {
  position: absolute; top: 12px; right: 12px; width: 280px;
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4); padding: 16px; display: none;
  max-height: calc(100% - 24px); overflow-y: auto;
}
.kg-detail.visible { display: block; }
.kg-detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.kg-detail-title { font-size: 16px; font-weight: 600; color: var(--text); }
.kg-detail-close {
  background: none; border: none; color: var(--text-muted); cursor: pointer;
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius); transition: var(--transition);
}
.kg-detail-close:hover { background: var(--bg-hover); color: var(--text); }
.kg-detail-close svg { width: 16px; height: 16px; }
.kg-detail-field { margin-bottom: 8px; }
.kg-detail-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.kg-detail-value { font-size: 13px; color: var(--text); margin-top: 2px; }
.kg-detail-neighbor {
  display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12px;
  color: var(--text-dim); cursor: pointer; transition: var(--transition);
}
.kg-detail-neighbor:hover { color: var(--accent); }

/* ── Graph Toolbar ────────────────────────────────────────── */
.kg-toolbar {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 2px; background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.kg-toolbar button {
  padding: 6px 14px; border-radius: 4px; font-size: 12px; font-weight: 500;
  color: var(--text-dim); border: none; background: none; cursor: pointer;
  font-family: var(--font); transition: var(--transition); display: flex; align-items: center; gap: 4px;
}
.kg-toolbar button:hover { background: var(--bg-hover); color: var(--text); }
.kg-toolbar button svg { width: 13px; height: 13px; }

/* ── Toast ────────────────────────────────────────────────── */
.kg-toast-wrap { position: fixed; top: 60px; right: 16px; z-index: 1000; }
.kg-toast {
  padding: 10px 16px; background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; margin-bottom: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3); animation: kgToastIn 300ms ease;
  color: var(--text);
}
@keyframes kgToastIn {
  from { transform: translateX(120%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@media (max-width: 900px) {
  .kg-panel { display: none; }
}
</style>
</head>

        </div>
        <div class="kg-form-group">
          <label>关系</label>
          <input type="text" id="edgeRelation" placeholder="例如: uses, extends">
        </div>
        <button class="kg-btn-add" onclick="addEdge()">添加边</button>
      </div>

      <!-- Actions -->
      <div class="kg-section">
        <button class="kg-btn-outline" onclick="loadFromAPI()">从接口重载</button>
        <button class="kg-btn-outline" onclick="exportGraph()">导出 JSON</button>
      </div>
    </aside>

    <!-- Graph Canvas -->
    <div class="kg-canvas-wrap" id="graphContainer">
      <svg id="graphSvg">
        <defs>
          <marker id="arrowhead" viewBox="0 0 10 7" refX="10" refY="3.5"
                  markerWidth="8" markerHeight="6" orient="auto-start-reverse">
            <polygon points="0 0, 10 3.5, 0 7" fill="var(--text-muted)" />
          </marker>
        </defs>
        <g id="graphGroup">
          <g id="edgesGroup"></g>
          <g id="nodesGroup"></g>
          <g id="labelsGroup"></g>
        </g>
      </svg>

      <!-- Node Detail Panel -->
      <div class="kg-detail" id="detailPanel">
        <div class="kg-detail-header">
          <span class="kg-detail-title" id="detailTitle"></span>
          <button class="kg-detail-close" onclick="closeDetail()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div class="kg-detail-field">
          <div class="kg-detail-label">类型</div>
          <div class="kg-detail-value" id="detailType"></div>
        </div>
        <div class="kg-detail-field">
          <div class="kg-detail-label">属性</div>
          <div class="kg-detail-value" id="detailProps"></div>
        </div>
        <div style="margin-top: 12px;">
          <div class="kg-detail-label">邻居</div>
          <div id="detailNeighbors"></div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="kg-toolbar">
        <button onclick="zoomIn()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg> 放大</button>
        <button onclick="zoomOut()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg> 缩小</button>
        <button onclick="resetView()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> 重置</button>
        <button onclick="togglePhysics()" id="physicsBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> 暂停</button>
        <button onclick="layoutCircular()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg> 环形</button>
      </div>
    </div>
  </div>
</div>

<div class="kg-toast-wrap" id="toasts"></div>

<script>
(() => {
'use strict';

/* ── Sidebar Toggle ─────────────────────────────────────────── */
document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('pageLayout').classList.toggle('sidebar-collapsed');
});

/* ── Constants ──────────────────────────────────────────────── */
const API_BASE = window.location.origin;

const nodeTypeColors = {
  concept:  '#3b82f6',
  entity:   '#22c55e',
  tool:     '#eab308',
  agent:    '#a855f7',
  skill:    '#06b6d4',
  module:   '#ec4899',
  task:     '#ef4444',
  fact:     '#64748b',
};

const nodeTypeLabels = {
  concept: '概念', entity: '实体', tool: '工具', agent: '智能体',
  skill: '技能', module: '模块', task: '任务', fact: '事实',
};

let nodes = [];
let edges = [];
let selectedNode = null;
let physicsRunning = true;
let transform = { x: 0, y: 0, scale: 1 };
let nodeCounter = 100;
let simInterval = null;
let dragNode = null;

/* ── Initialization ─────────────────────────────────────────── */
function init() {
  loadDemoData();
  renderLegend();
  updateStats();
  updateNodeSelectors();
  setupSVGInteractions();
  startSimulation();
  loadFromAPI();
}

function loadDemoData() {
  nodes = [
    { id: 'n1', label: 'JARVIS', type: 'entity', x: 400, y: 300, vx: 0, vy: 0, properties: { version: '0.2.0' } },
    { id: 'n2', label: 'StreamingSpec', type: 'concept', x: 300, y: 200, vx: 0, vy: 0, properties: {} },
    { id: 'n3', label: 'Orchestrator', type: 'module', x: 500, y: 200, vx: 0, vy: 0, properties: {} },
    { id: 'n4', label: 'CodeAgent', type: 'agent', x: 600, y: 350, vx: 0, vy: 0, properties: {} },
    { id: 'n5', label: 'SearchAgent', type: 'agent', x: 350, y: 420, vx: 0, vy: 0, properties: {} },
    { id: 'n6', label: 'WebSearch', type: 'tool', x: 250, y: 400, vx: 0, vy: 0, properties: {} },
    { id: 'n7', label: 'FileOps', type: 'tool', x: 550, y: 450, vx: 0, vy: 0, properties: {} },
    { id: 'n8', label: 'Knowledge', type: 'module', x: 200, y: 300, vx: 0, vy: 0, properties: {} },
    { id: 'n9', label: 'LLMRouter', type: 'module', x: 450, y: 150, vx: 0, vy: 0, properties: {} },
    { id: 'n10', label: 'Curator', type: 'module', x: 500, y: 400, vx: 0, vy: 0, properties: {} },
  ];
  edges = [
    { source: 'n1', target: 'n2', relation: 'uses' },
    { source: 'n1', target: 'n3', relation: 'contains' },
    { source: 'n3', target: 'n4', relation: 'manages' },
    { source: 'n3', target: 'n5', relation: 'manages' },
    { source: 'n5', target: 'n6', relation: 'uses' },
    { source: 'n4', target: 'n7', relation: 'uses' },
    { source: 'n1', target: 'n8', relation: 'contains' },
    { source: 'n3', target: 'n9', relation: 'uses' },
    { source: 'n1', target: 'n10', relation: 'contains' },
  ];
}

/* ── Legend ──────────────────────────────────────────────────── */
function renderLegend() {
  const container = document.getElementById('legend');
  container.innerHTML = '';
  for (const [type, color] of Object.entries(nodeTypeColors)) {
    const el = document.createElement('div');
    el.className = 'kg-legend-item';
    el.innerHTML = '<span class="kg-legend-dot" style="background:' + color + '"></span>' + (nodeTypeLabels[type] || type);
    el.onclick = () => highlightType(type);
    container.appendChild(el);
  }
}

function highlightType(type) {
  nodes.forEach(n => n._highlighted = n.type === type);
  renderGraph();
  setTimeout(() => { nodes.forEach(n => n._highlighted = false); renderGraph(); }, 2000);
}

/* ── Stats ───────────────────────────────────────────────────── */
function updateStats() {
  document.getElementById('statNodes').textContent = nodes.length;
  document.getElementById('statEdges').textContent = edges.length;
  document.getElementById('statClusters').textContent = countClusters();
}

function countClusters() {
  const parent = {};
  nodes.forEach(n => parent[n.id] = n.id);
  function find(a) { return parent[a] === a ? a : (parent[a] = find(parent[a])); }
  function union(a, b) { parent[find(a)] = find(b); }
  edges.forEach(e => union(e.source, e.target));
  return new Set(nodes.map(n => find(n.id))).size;
}

/* ── Node Selectors ─────────────────────────────────────────── */
function updateNodeSelectors() {
  const fromSel = document.getElementById('edgeFrom');
  const toSel = document.getElementById('edgeTo');
  const opts = nodes.map(n => '<option value="' + n.id + '">' + n.label + '</option>').join('');
  fromSel.innerHTML = opts;
  toSel.innerHTML = opts;
}

/* ── SVG Pan / Zoom ─────────────────────────────────────────── */
function setupSVGInteractions() {
  const svg = document.getElementById('graphSvg');
  let isPanning = false, startX = 0, startY = 0;

  svg.addEventListener('mousedown', e => {
    if (e.target === svg || e.target.id === 'graphGroup') {
      isPanning = true;
      startX = e.clientX - transform.x;
      startY = e.clientY - transform.y;
    }
  });
  svg.addEventListener('mousemove', e => {
    if (isPanning) {
      transform.x = e.clientX - startX;
      transform.y = e.clientY - startY;
      applyTransform();
    }
  });
  svg.addEventListener('mouseup', () => isPanning = false);
  svg.addEventListener('mouseleave', () => isPanning = false);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    transform.scale = Math.max(0.1, Math.min(5, transform.scale * delta));
    applyTransform();
  });
}

function applyTransform() {
  document.getElementById('graphGroup').setAttribute('transform',
    'translate(' + transform.x + ',' + transform.y + ') scale(' + transform.scale + ')');
}

function zoomIn() { transform.scale = Math.min(5, transform.scale * 1.2); applyTransform(); }
function zoomOut() { transform.scale = Math.max(0.1, transform.scale * 0.8); applyTransform(); }
function resetView() { transform = { x: 0, y: 0, scale: 1 }; applyTransform(); }

/* ── Physics Simulation ─────────────────────────────────────── */
function startSimulation() {
  if (simInterval) clearInterval(simInterval);
  simInterval = setInterval(simulate, 16);
}

function togglePhysics() {
  physicsRunning = !physicsRunning;
  document.getElementById('physicsBtn').innerHTML = physicsRunning
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> 暂停'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg> 继续';
  showToast(physicsRunning ? '物理模拟已恢复' : '物理模拟已暂停');
}

function simulate() {
  if (!physicsRunning) { renderGraph(); return; }

  const repulsion = 2000;
  const attraction = 0.005;
  const damping = 0.85;
  const centerForce = 0.002;
  const svg = document.getElementById('graphSvg');
  const cx = (svg.clientWidth || 800) / 2;
  const cy = (svg.clientHeight || 600) / 2;

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[j].x - nodes[i].x;
      const dy = nodes[j].y - nodes[i].y;
      const dist = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
      const force = repulsion / (dist * dist);
      const fx = (dx / dist) * force;
      const fy = (dy / dist) * force;
      nodes[i].vx -= fx; nodes[i].vy -= fy;
      nodes[j].vx += fx; nodes[j].vy += fy;
    }
  }

  for (const edge of edges) {
    const src = nodes.find(n => n.id === edge.source);
    const tgt = nodes.find(n => n.id === edge.target);
    if (!src || !tgt) continue;
    const dx = tgt.x - src.x;
    const dy = tgt.y - src.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const force = dist * attraction;
    const fx = (dx / Math.max(dist, 1)) * force;
    const fy = (dy / Math.max(dist, 1)) * force;
    src.vx += fx; src.vy += fy;
    tgt.vx -= fx; tgt.vy -= fy;
  }

  for (const node of nodes) {
    node.vx += (cx - node.x) * centerForce;
    node.vy += (cy - node.y) * centerForce;
  }

  for (const node of nodes) {
    if (node._dragging) continue;
    node.vx *= damping; node.vy *= damping;
    node.x += node.vx; node.y += node.vy;
  }

  renderGraph();
}

/* ── Rendering ──────────────────────────────────────────────── */
function renderGraph() {
  const edgesGroup = document.getElementById('edgesGroup');
  const nodesGroup = document.getElementById('nodesGroup');
  const labelsGroup = document.getElementById('labelsGroup');

  let edgeHtml = '';
  for (const edge of edges) {
    const src = nodes.find(n => n.id === edge.source);
    const tgt = nodes.find(n => n.id === edge.target);
    if (!src || !tgt) continue;
    const mx = (src.x + tgt.x) / 2;
    const my = (src.y + tgt.y) / 2;
    edgeHtml += '<line x1="' + src.x + '" y1="' + src.y + '" x2="' + tgt.x + '" y2="' + tgt.y + '" stroke="var(--border-light)" stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.6"/>';
    if (edge.relation) {
      edgeHtml += '<text x="' + mx + '" y="' + (my - 6) + '" text-anchor="middle" fill="var(--text-muted)" font-size="9" font-family="var(--font)">' + edge.relation + '</text>';
    }
  }
  edgesGroup.innerHTML = edgeHtml;

  let nodeHtml = '';
  for (const node of nodes) {
    const color = nodeTypeColors[node.type] || '#64748b';
    const r = node._highlighted ? 18 : (selectedNode === node.id ? 16 : 12);
    const opacity = node._highlighted === false ? 0.3 : 1;
    nodeHtml += '<circle cx="' + node.x + '" cy="' + node.y + '" r="' + r + '" fill="' + color + '" stroke="' + (selectedNode === node.id ? '#fff' : 'transparent') + '" stroke-width="2" style="cursor:pointer;opacity:' + opacity + '" onmousedown="startDrag(event,\'' + node.id + '\')" onclick="selectNode(\'' + node.id + '\')"/>';
  }
  nodesGroup.innerHTML = nodeHtml;

  let labelHtml = '';
  for (const node of nodes) {
    const opacity = node._highlighted === false ? 0.3 : 1;
    labelHtml += '<text x="' + node.x + '" y="' + (node.y + 22) + '" text-anchor="middle" fill="var(--text-dim)" font-size="11" font-family="var(--font)" style="pointer-events:none;opacity:' + opacity + '">' + node.label + '</text>';
  }
  labelsGroup.innerHTML = labelHtml;
}

/* ── Node Dragging ──────────────────────────────────────────── */
window.startDrag = function(event, nodeId) {
  event.stopPropagation();
  dragNode = nodes.find(n => n.id === nodeId);
  if (!dragNode) return;
  dragNode._dragging = true;

  const svg = document.getElementById('graphSvg');
  function onMove(e) {
    const rect = svg.getBoundingClientRect();
    dragNode.x = (e.clientX - rect.left - transform.x) / transform.scale;
    dragNode.y = (e.clientY - rect.top - transform.y) / transform.scale;
    dragNode.vx = 0; dragNode.vy = 0;
  }
  function onUp() {
    if (dragNode) dragNode._dragging = false;
    dragNode = null;
    svg.removeEventListener('mousemove', onMove);
    svg.removeEventListener('mouseup', onUp);
  }
  svg.addEventListener('mousemove', onMove);
  svg.addEventListener('mouseup', onUp);
};

/* ── Node Selection ─────────────────────────────────────────── */
window.selectNode = function(nodeId) {
  selectedNode = nodeId;
  const node = nodes.find(n => n.id === nodeId);
  if (!node) return;

  const panel = document.getElementById('detailPanel');
  panel.classList.add('visible');
  document.getElementById('detailTitle').textContent = node.label;
  document.getElementById('detailType').textContent = nodeTypeLabels[node.type] || node.type;
  document.getElementById('detailProps').textContent =
    Object.keys(node.properties || {}).length > 0
      ? JSON.stringify(node.properties, null, 2)
      : '无';

  const neighbors = [];
  for (const edge of edges) {
    if (edge.source === nodeId) {
      const tgt = nodes.find(n => n.id === edge.target);
      if (tgt) neighbors.push({ node: tgt, relation: edge.relation, direction: 'out' });
    }
    if (edge.target === nodeId) {
      const src = nodes.find(n => n.id === edge.source);
      if (src) neighbors.push({ node: src, relation: edge.relation, direction: 'in' });
    }
  }

  document.getElementById('detailNeighbors').innerHTML = neighbors.map(n => {
    const arrow = n.direction === 'out' ? '&rarr;' : '&larr;';
    const color = nodeTypeColors[n.node.type] || '#64748b';
    return '<div class="kg-detail-neighbor" onclick="selectNode(\'' + n.node.id + '\')">' +
      '<span class="kg-legend-dot" style="background:' + color + ';width:8px;height:8px"></span> ' +
      arrow + ' ' + n.node.label + ' <span style="color:var(--text-muted)">(' + n.relation + ')</span></div>';
  }).join('');

  renderGraph();
};

window.closeDetail = function() {
  selectedNode = null;
  document.getElementById('detailPanel').classList.remove('visible');
  renderGraph();
};

/* ── Search ─────────────────────────────────────────────────── */
window.searchEntity = function() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!query) return;
  const found = nodes.find(n => n.label.toLowerCase().includes(query));
  if (found) {
    selectNode(found.id);
    const svg = document.getElementById('graphSvg');
    transform.x = (svg.clientWidth || 800) / 2 - found.x * transform.scale;
    transform.y = (svg.clientHeight || 600) / 2 - found.y * transform.scale;
    applyTransform();
    showToast('已找到: ' + found.label);
  } else {
    showToast('未找到匹配的实体');
  }
};

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchEntity();
});

/* ── Add Node / Edge ────────────────────────────────────────── */
window.addNode = function() {
  const label = document.getElementById('addNodeLabel').value.trim();
  const type = document.getElementById('addNodeType').value;
  if (!label) { showToast('请输入标签名称'); return; }

  const svg = document.getElementById('graphSvg');
  const cx = (svg.clientWidth || 800) / 2;
  const cy = (svg.clientHeight || 600) / 2;

  nodes.push({
    id: 'n' + (++nodeCounter), label: label, type: type,
    x: cx + (Math.random() - 0.5) * 100, y: cy + (Math.random() - 0.5) * 100,
    vx: 0, vy: 0, properties: {},
  });

  document.getElementById('addNodeLabel').value = '';
  updateNodeSelectors();
  updateStats();
  showToast('已添加节点: ' + label);
};

window.addEdge = function() {
  const from = document.getElementById('edgeFrom').value;
  const to = document.getElementById('edgeTo').value;
  const relation = document.getElementById('edgeRelation').value.trim() || 'related';
  if (from === to) { showToast('不能将节点连接到自身'); return; }

  edges.push({ source: from, target: to, relation: relation });
  document.getElementById('edgeRelation').value = '';
  updateStats();
  showToast('已添加边');
};

/* ── Circular Layout ────────────────────────────────────────── */
window.layoutCircular = function() {
  const svg = document.getElementById('graphSvg');
  const cx = (svg.clientWidth || 800) / 2;
  const cy = (svg.clientHeight || 600) / 2;
  const radius = Math.min(cx, cy) * 0.6;

  nodes.forEach((n, i) => {
    const angle = (2 * Math.PI * i) / nodes.length;
    n.x = cx + radius * Math.cos(angle);
    n.y = cy + radius * Math.sin(angle);
    n.vx = 0; n.vy = 0;
  });
};

/* ── API ────────────────────────────────────────────────────── */
window.loadFromAPI = async function() {
  try {
    const res = await fetch(API_BASE + '/knowledge/graph');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.nodes && data.nodes.length > 0) {
      const svg = document.getElementById('graphSvg');
      const cx = (svg.clientWidth || 800) / 2;
      const cy = (svg.clientHeight || 600) / 2;
      nodes = data.nodes.map(n => ({
        id: n.id, label: n.label, type: n.type || 'entity',
        x: n.x || cx + (Math.random() - 0.5) * 300,
        y: n.y || cy + (Math.random() - 0.5) * 300,
        vx: 0, vy: 0, properties: n.properties || {},
      }));
      edges = (data.edges || []).map(e => ({
        source: e.source, target: e.target, relation: e.relation || '',
      }));
      updateNodeSelectors();
      updateStats();
      renderLegend();
      showToast('已从接口加载 ' + nodes.length + ' 个节点');
    }
  } catch (err) {
    console.log('接口不可用，使用演示数据:', err.message);
  }
};

window.exportGraph = function() {
  const data = { nodes: nodes, edges: edges };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jarvis-knowledge-graph.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('图谱已导出');
};

/* ── Toast ──────────────────────────────────────────────────── */
function showToast(message) {
  const container = document.getElementById('toasts');
  const toast = document.createElement('div');
  toast.className = 'kg-toast';
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

/* ── Start ──────────────────────────────────────────────────── */
init();

})();
</script>
</body>
</html>
