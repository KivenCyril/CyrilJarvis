<title>JARVIS - 工具</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-hover:     #1c2d42;
  --bg-input:     #0c1322;
  --border:       #1e2d40;
  --border-light: #2d4054;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #5a6d82;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --purple:       #a855f7;
  --yellow:       #eab308;
  --red:          #ef4444;
  --radius:       8px;
  --radius-lg:    12px;
  --transition:   200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; overflow: hidden; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }

/* ── Top Bar ─────────────────────────────────────────────── */
.topbar {
  height: 50px; background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 50; position: relative;
}
.topbar::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2) 50%, transparent); }
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(99,102,241,0.35); }
.topbar-logo svg { width: 16px; height: 16px; color: #fff; }
.topbar-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #93c5fd, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.topbar-page { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-left: 8px; }
.topbar-spacer { flex: 1; }
.topbar-btn { width: 34px; height: 34px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: var(--transition); }
.topbar-btn:hover { background: var(--bg-hover); color: var(--text-dim); }
.topbar-btn svg { width: 17px; height: 17px; }

/* ── Layout ──────────────────────────────────────────────── */
.page-layout { flex: 1; display: grid; grid-template-columns: 248px 1fr; overflow: hidden; transition: grid-template-columns 300ms cubic-bezier(0.16,1,0.3,1); }
.page-layout.sidebar-collapsed { grid-template-columns: 0px 1fr; }

/* ── Sidebar ─────────────────────────────────────────────── */
.page-sidebar {
  background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  width: 248px; min-width: 248px; max-width: 248px;
  transition: all 300ms cubic-bezier(0.16,1,0.3,1);
}
.sidebar-collapsed .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.page-sidebar-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 16px; }
.nav-group { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(30,45,64,0.6); }
.nav-group:last-child { border-bottom: none; }
.nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-muted); font-weight: 600; padding: 10px 10px 5px; user-select: none; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim); text-decoration: none; transition: var(--transition); position: relative; border: 1px solid transparent; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; border-color: var(--border); }
.nav-item.active { background: rgba(59,130,246,0.08); color: var(--accent-hover); font-weight: 500; border-color: rgba(59,130,246,0.15); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.55; }
.nav-item:hover svg { opacity: 0.8; }
.nav-item.active svg { opacity: 1; }

.page-content { overflow-y: auto; }

@media (max-width: 1024px) {
  .page-layout { grid-template-columns: 0px 1fr; }
  .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
}

/* ── Tools Layout ───────────────────────────────────────── */
.tools-layout { display: grid; grid-template-columns: 1fr 420px; height: 100%; overflow: hidden; }
.tools-content { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.tools-detail {
  background: var(--bg-base); border-left: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
}

/* ── Toolbar ─────────────────────────────────────────────── */
.toolbar {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  background: var(--bg-surface); padding: 14px 20px; border-radius: var(--radius-lg);
  border: 1px solid var(--border);
}
.toolbar input {
  flex: 1; min-width: 180px; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 9px 14px; color: var(--text); font-size: 13px;
  font-family: var(--font); transition: var(--transition); outline: none;
}
.toolbar input:focus { border-color: var(--accent); }

/* ── Buttons ─────────────────────────────────────────────── */
.btn {
  padding: 9px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 600;
  cursor: pointer; border: none; transition: var(--transition); font-family: var(--font);
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }

/* ── Stats Row ───────────────────────────────────────────── */
.stats-row { display: flex; gap: 14px; }
.mini-stat {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; flex: 1; text-align: center;
}
.mini-stat-number { font-size: 22px; font-weight: 700; color: var(--accent); }
.mini-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* ── Category Tabs ───────────────────────────────────────── */
.category-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.cat-tab {
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-dim);
  cursor: pointer; transition: var(--transition);
}
.cat-tab:hover { border-color: var(--accent); color: var(--text); }
.cat-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.cat-count {
  display: inline-block; margin-left: 4px; background: rgba(255,255,255,0.15);
  padding: 0 6px; border-radius: 10px; font-size: 10px;
}

/* ── Tool Grid ───────────────────────────────────────────── */
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.tool-card {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 18px; cursor: pointer; transition: var(--transition);
  animation: fadeInUp 0.3s ease both;
}
.tool-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.tool-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tool-name { font-size: 15px; font-weight: 700; font-family: var(--mono); margin-bottom: 6px; color: var(--accent); }
.tool-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 10px; }
.tool-params-count {
  font-size: 11px; color: var(--text-muted); background: var(--bg-deep);
  display: inline-block; padding: 2px 8px; border-radius: 4px;
}

/* ── Detail Panel ────────────────────────────────────────── */
.detail-empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 14px; padding: 20px; text-align: center;
  flex-direction: column; gap: 12px;
}
.detail-empty svg { width: 40px; height: 40px; opacity: 0.3; }
.detail-content { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.detail-title { font-size: 20px; font-weight: 700; font-family: var(--mono); color: var(--accent); }
.detail-desc { font-size: 14px; color: var(--text-dim); line-height: 1.7; }
.section-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 8px;
}

/* ── Param Form ──────────────────────────────────────────── */
.param-form { display: flex; flex-direction: column; gap: 12px; }
.param-field { display: flex; flex-direction: column; gap: 4px; }
.param-label { font-size: 12px; font-weight: 600; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
.param-required { color: var(--red); font-size: 10px; font-weight: 600; }
.param-optional-tag { color: var(--text-muted); font-size: 10px; }
.param-type { font-size: 10px; color: var(--text-muted); background: var(--bg-surface); padding: 1px 6px; border-radius: 3px; }
.param-input {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 9px 12px; color: var(--text); font-size: 13px; font-family: var(--mono);
  outline: none; transition: var(--transition);
}
.param-input:focus { border-color: var(--accent); }
.param-input-bool { display: flex; gap: 8px; align-items: center; }
.param-hint { font-size: 11px; color: var(--text-muted); }

/* ── Output Display ──────────────────────────────────────── */
.output-section { margin-top: 4px; }
.output-display {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; font-size: 12px; font-family: var(--mono); color: var(--green);
  max-height: 260px; overflow-y: auto; white-space: pre-wrap; line-height: 1.6;
  min-height: 60px;
}
.output-display.error { color: var(--red); }
.output-display.loading { color: var(--text-muted); }

/* ── Toast ───────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
  background: var(--green); color: #fff; border-radius: var(--radius);
  font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(10px);
  transition: all 0.3s ease; z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 960px) {
  .tools-layout { grid-template-columns: 1fr; }
  .tools-detail { display: none; }
}
@media (max-width: 768px) {
  .stats-row { flex-wrap: wrap; }
}
</style>
</head>

(() => {
'use strict';

document.getElementById('sidebarToggle').addEventListener('click', () => {

});

const API_BASE = window.location.origin;
let allTools = [];
let selectedTool = null;
let activeCategory = 'all';

function generateDemoTools() {
  return [
    { name: 'shell.exec', description: '执行 Shell 命令并返回标准输出、标准错误和退出码。',
      parameters: { type: 'object', properties: {
        command: { type: 'string', description: '要执行的 Shell 命令' },
        timeout: { type: 'integer', description: '超时时间（秒），默认 30' },
        cwd: { type: 'string', description: '工作目录路径' },
      }, required: ['command'] }},
    { name: 'shell.read_file', description: '读取指定路径文件的内容。',
      parameters: { type: 'object', properties: {
        path: { type: 'string', description: '文件绝对路径' },
        encoding: { type: 'string', description: '文件编码，默认 utf-8' },
      }, required: ['path'] }},
    { name: 'git.status', description: '获取当前 Git 仓库状态，包括暂存区、未暂存和未跟踪文件。',
      parameters: { type: 'object', properties: {
        repo_path: { type: 'string', description: 'Git 仓库路径' },
      }, required: [] }},
    { name: 'git.diff', description: '显示提交、分支或工作区变更之间的差异。',
      parameters: { type: 'object', properties: {
        ref: { type: 'string', description: '对比的 Git 引用，默认 HEAD' },
        staged: { type: 'boolean', description: '仅显示暂存区变更' },
        path: { type: 'string', description: '限定路径范围' },
      }, required: [] }},
    { name: 'git.log', description: '显示提交历史，支持格式化和过滤。',
      parameters: { type: 'object', properties: {
        count: { type: 'integer', description: '显示的提交数量' },
        author: { type: 'string', description: '按作者过滤' },
        since: { type: 'string', description: '显示指定日期之后的提交' },
      }, required: [] }},
    { name: 'http.get', description: '发送 HTTP GET 请求并返回响应。',
      parameters: { type: 'object', properties: {
        url: { type: 'string', description: '目标 URL' },
        headers: { type: 'string', description: '请求头 JSON 字符串' },
        timeout: { type: 'integer', description: '请求超时时间（秒）' },
      }, required: ['url'] }},
    { name: 'http.post', description: '发送带有 JSON 请求体的 HTTP POST 请求。',
      parameters: { type: 'object', properties: {
        url: { type: 'string', description: '目标 URL' },
        body: { type: 'string', description: 'JSON 请求体' },
        headers: { type: 'string', description: '请求头 JSON 字符串' },
      }, required: ['url'] }},
    { name: 'json.parse', description: '解析 JSON 字符串并返回结构化数据。',
      parameters: { type: 'object', properties: {
        input: { type: 'string', description: '要解析的 JSON 字符串' },
        path: { type: 'string', description: 'JSONPath 表达式（可选）' },
      }, required: ['input'] }},
    { name: 'json.format', description: '美化输出 JSON 字符串，支持配置缩进。',
      parameters: { type: 'object', properties: {
        input: { type: 'string', description: '要格式化的 JSON 字符串' },
        indent: { type: 'integer', description: '缩进空格数，默认 2' },
      }, required: ['input'] }},
    { name: 'text.search', description: '使用正则表达式在文本或文件中搜索。',
      parameters: { type: 'object', properties: {
        pattern: { type: 'string', description: '正则表达式模式' },
        input: { type: 'string', description: '要搜索的文本' },
        path: { type: 'string', description: '搜索的文件路径（替代 input）' },
        case_sensitive: { type: 'boolean', description: '区分大小写，默认 true' },
      }, required: ['pattern'] }},
    { name: 'text.replace', description: '使用正则表达式进行查找替换。',
      parameters: { type: 'object', properties: {
        pattern: { type: 'string', description: '正则表达式模式' },
        replacement: { type: 'string', description: '替换字符串' },
        input: { type: 'string', description: '要处理的文本' },
      }, required: ['pattern', 'replacement', 'input'] }},
    { name: 'text.summarize', description: '使用 LLM 生成文本的简洁摘要。',
      parameters: { type: 'object', properties: {
        input: { type: 'string', description: '要总结的文本' },
        max_length: { type: 'integer', description: '摘要最大字数' },
      }, required: ['input'] }},
  ];
}

async function fetchTools() {
  try {
    const res = await fetch(API_BASE + '/tools');
    if (!res.ok) throw new Error();
    let data = await res.json();
    allTools = Array.isArray(data) ? data : (data.data || data.tools || []);
  } catch {
    allTools = generateDemoTools();
  }
  renderCategoryTabs();
  renderTools(allTools);
  updateStats();
}

function getCategory(name) {
  return name.split('.')[0] || 'other';
}

function renderCategoryTabs() {
  const cats = { all: allTools.length };
  allTools.forEach(t => {
    const c = getCategory(t.name);
    cats[c] = (cats[c] || 0) + 1;
  });
  document.getElementById('categoryTabs').innerHTML = Object.entries(cats).map(([cat, count]) =>
    '<div class="cat-tab ' + (activeCategory === cat ? 'active' : '') + '" onclick="setCategory(\'' + cat + '\')">' + cat + '<span class="cat-count">' + count + '</span></div>'
  ).join('');
}

window.setCategory = function(cat) {
  activeCategory = cat;
  renderCategoryTabs();
  filterTools();
};

function renderTools(tools) {
  const grid = document.getElementById('toolGrid');
  if (!tools.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">未找到工具</div>';
    return;
  }
  grid.innerHTML = tools.map((t, i) => {
    const paramCount = Object.keys(t.parameters?.properties || {}).length;
    return '<div class="tool-card ' + (selectedTool?.name === t.name ? 'selected' : '') + '" onclick="selectTool(\'' + t.name + '\')" style="animation-delay:' + (i * 0.04) + 's">' +
      '<div class="tool-name">' + t.name + '</div>' +
      '<div class="tool-desc">' + t.description + '</div>' +
      '<div class="tool-params-count">' + paramCount + ' 个参数</div>' +
    '</div>';
  }).join('');
}

window.filterTools = function() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allTools.filter(t => {
    const matchQ = !q || t.name.toLowerCase().includes(q) || t.description.toLowerCase().includes(q);
    const matchCat = activeCategory === 'all' || getCategory(t.name) === activeCategory;
    return matchQ && matchCat;
  });
  renderTools(filtered);
};

window.selectTool = function(name) {
  selectedTool = allTools.find(t => t.name === name);
  if (!selectedTool) return;
  filterTools();

  document.getElementById('detailEmpty').style.display = 'none';
  const dc = document.getElementById('detailContent');
  dc.style.display = 'flex';

  const props = selectedTool.parameters?.properties || {};
  const required = selectedTool.parameters?.required || [];

  const formFields = Object.entries(props).map(([key, schema]) => {
    const isReq = required.includes(key);
    const inputId = 'param_' + key;
    let inputHtml;

    if (schema.type === 'boolean') {
      inputHtml = '<div class="param-input-bool"><input type="checkbox" id="' + inputId + '"><label for="' + inputId + '" style="font-size:13px;color:var(--text-dim)">启用</label></div>';
    } else if (schema.type === 'integer' || schema.type === 'number') {
      inputHtml = '<input type="number" class="param-input" id="' + inputId + '" placeholder="' + (schema.description || '') + '">';
    } else {
      inputHtml = '<input type="text" class="param-input" id="' + inputId + '" placeholder="' + (schema.description || '') + '">';
    }

    return '<div class="param-field">' +
      '<div class="param-label">' + key +
        ' <span class="param-type">' + schema.type + '</span>' +
        (isReq ? ' <span class="param-required">必填</span>' : ' <span class="param-optional-tag">可选</span>') +
      '</div>' +
      inputHtml +
      (schema.description ? '<div class="param-hint">' + schema.description + '</div>' : '') +
    '</div>';
  }).join('');

  dc.innerHTML =
    '<div>' +
      '<div class="detail-title">' + selectedTool.name + '</div>' +
      '<div class="detail-desc">' + selectedTool.description + '</div>' +
    '</div>' +
    '<div>' +
      '<div class="section-title">参数</div>' +
      '<div class="param-form">' + (formFields || '<div style="font-size:13px;color:var(--text-muted)">无参数</div>') + '</div>' +
    '</div>' +
    '<div>' +
      '<button class="btn btn-primary" id="executeBtn" onclick="executeTool()" style="width:100%">执行</button>' +
    '</div>' +
    '<div class="output-section">' +
      '<div class="section-title">输出</div>' +
      '<div class="output-display loading" id="outputDisplay">执行后输出将显示在这里...</div>' +
    '</div>';
};

window.executeTool = async function() {
  if (!selectedTool) return;
  const output = document.getElementById('outputDisplay');
  const execBtn = document.getElementById('executeBtn');
  output.className = 'output-display loading';
  output.textContent = '执行中...';
  if (execBtn) { execBtn.disabled = true; execBtn.textContent = '执行中...'; }

  const props = selectedTool.parameters?.properties || {};
  const params = {};
  Object.entries(props).forEach(([key, schema]) => {
    const el = document.getElementById('param_' + key);
    if (!el) return;
    if (schema.type === 'boolean') {
      params[key] = el.checked;
    } else if (schema.type === 'integer') {
      const v = parseInt(el.value); if (!isNaN(v)) params[key] = v;
    } else if (schema.type === 'number') {
      const v = parseFloat(el.value); if (!isNaN(v)) params[key] = v;
    } else {
      if (el.value.trim()) params[key] = el.value.trim();
    }
  });

  try {
    const res = await fetch(API_BASE + '/tools/' + selectedTool.name + '/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params),
    });
    const data = await res.json();
    output.className = 'output-display';
    output.textContent = JSON.stringify(data, null, 2);
  } catch {
    output.className = 'output-display';
    const demo = {
      tool: selectedTool.name,
      parameters: params,
      result: '[Demo] "' + selectedTool.name + '" executed successfully with ' + Object.keys(params).length + ' parameters.',
      timestamp: new Date().toISOString(),
    };
    output.textContent = JSON.stringify(demo, null, 2);
    showToast('已在演示模式下执行');
  } finally {
    if (execBtn) { execBtn.disabled = false; execBtn.textContent = '执行'; }
  }
};

function updateStats() {
  document.getElementById('totalTools').textContent = allTools.length;
  const cats = new Set(allTools.map(t => getCategory(t.name)));
  document.getElementById('categoryCount').textContent = cats.size;
  const tp = allTools.reduce((a, t) => a + Object.keys(t.parameters?.properties || {}).length, 0);
  document.getElementById('totalParams').textContent = tp;
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--red)' : 'var(--green)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

fetchTools();
})();
</script>
