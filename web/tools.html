<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - Tool Explorer</title>
<style>
/* ====================================================================
   JARVIS Tool Explorer — Standalone Page CSS
   ==================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-card:      #1e293b;
  --bg-hover:     #273549;
  --bg-input:     #0f172a;
  --border:       #334155;
  --border-light: #3f506a;
  --border-focus: #6366f1;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #64748b;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --orange:       #f59e0b;
  --red:          #ef4444;
  --purple:       #a855f7;
  --cyan:         #06b6d4;
  --pink:         #ec4899;
  --radius:       8px;
  --radius-lg:    12px;
  --shadow:       0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md:    0 4px 12px rgba(0,0,0,0.3);
  --transition:   180ms ease;
  --font:         'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; }
body { display: flex; flex-direction: column; overflow: hidden; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* -- Top Nav ----------------------------------------------------------- */
.topnav {
  height: 52px; background: var(--bg-base); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0;
}
.topnav-brand { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
.topnav-brand span { color: var(--text-dim); font-weight: 400; margin-left: 6px; font-size: 14px; }
.topnav-links { display: flex; gap: 4px; margin-left: 24px; flex-wrap: wrap; }
.topnav-links a {
  padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
  color: var(--text-dim); text-decoration: none; transition: var(--transition);
}
.topnav-links a:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; }
.topnav-links a.active { background: var(--accent); color: #fff; }

/* -- Layout ------------------------------------------------------------ */
.main-layout { flex: 1; display: grid; grid-template-columns: 1fr 420px; overflow: hidden; }
.content-area { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.detail-panel {
  background: var(--bg-base); border-left: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
}

/* -- Toolbar ----------------------------------------------------------- */
.toolbar {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  background: var(--bg-surface); padding: 14px 20px; border-radius: var(--radius-lg);
  border: 1px solid var(--border);
}
.toolbar input {
  flex: 1; min-width: 180px; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 9px 14px; color: var(--text); font-size: 13px;
}
.toolbar input:focus { border-color: var(--border-focus); }
.btn {
  padding: 9px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 600;
  cursor: pointer; border: none; transition: var(--transition);
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }

/* -- Stats Row --------------------------------------------------------- */
.stats-row { display: flex; gap: 14px; }
.mini-stat {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; flex: 1; text-align: center;
}
.mini-stat-number { font-size: 24px; font-weight: 700; }
.mini-stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

/* -- Category Tabs ----------------------------------------------------- */
.category-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.cat-tab {
  padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-dim);
  cursor: pointer; transition: var(--transition);
}
.cat-tab:hover { border-color: var(--accent); color: var(--text); }
.cat-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.cat-count {
  display: inline-block; margin-left: 4px; background: rgba(255,255,255,0.15);
  padding: 0 6px; border-radius: 10px; font-size: 10px;
}

/* -- Tool Grid --------------------------------------------------------- */
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.tool-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 18px; cursor: pointer; transition: var(--transition);
  animation: fadeInUp 0.3s ease both;
}
.tool-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.tool-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.tool-name { font-size: 15px; font-weight: 700; font-family: var(--mono); margin-bottom: 6px; color: var(--accent); }
.tool-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 10px; }
.tool-params-count {
  font-size: 11px; color: var(--text-muted); background: var(--bg-surface);
  display: inline-block; padding: 2px 8px; border-radius: 4px;
}

/* -- Detail Panel ------------------------------------------------------ */
.detail-empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 14px; padding: 20px; text-align: center;
}
.detail-content { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.detail-title { font-size: 20px; font-weight: 700; font-family: var(--mono); color: var(--accent); }
.detail-desc { font-size: 14px; color: var(--text-dim); line-height: 1.7; }
.section-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 8px;
}

/* -- Parameter Form ---------------------------------------------------- */
.param-form { display: flex; flex-direction: column; gap: 12px; }
.param-field { display: flex; flex-direction: column; gap: 4px; }
.param-label { font-size: 12px; font-weight: 600; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
.param-required { color: var(--red); font-size: 10px; }
.param-type { font-size: 10px; color: var(--text-muted); background: var(--bg-surface); padding: 1px 6px; border-radius: 3px; }
.param-input {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 9px 12px; color: var(--text); font-size: 13px; font-family: var(--mono);
}
.param-input:focus { border-color: var(--border-focus); }
.param-input-bool { display: flex; gap: 8px; align-items: center; }
.param-hint { font-size: 11px; color: var(--text-muted); }

/* -- Output Display ---------------------------------------------------- */
.output-section { margin-top: 4px; }
.output-display {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; font-size: 12px; font-family: var(--mono); color: var(--green);
  max-height: 260px; overflow-y: auto; white-space: pre-wrap; line-height: 1.6;
  min-height: 60px;
}
.output-display.error { color: var(--red); }
.output-display.loading { color: var(--text-muted); }

/* -- Toast ------------------------------------------------------------- */
.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
  background: var(--green); color: #fff; border-radius: var(--radius);
  font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(10px);
  transition: all 0.3s ease; z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 960px) {
  .main-layout { grid-template-columns: 1fr; }
  .detail-panel { display: none; }
}
</style>
</head>
<body>

<!-- Top Navigation -->
<nav class="topnav">
  <div class="topnav-brand">JARVIS <span>Tool Explorer</span></div>
  <div class="topnav-links">
    <a href="index.html">Dashboard</a>
    <a href="knowledge.html">Knowledge</a>
    <a href="workflows.html">Workflows</a>
    <a href="memory.html">Memory</a>
    <a href="skills.html">Skills</a>
    <a href="sessions.html">Sessions</a>
    <a href="tools.html" class="active">Tools</a>
    <a href="agents.html">Agents</a>
    <a href="observability.html">Observability</a>
    <a href="curator.html">Curator</a>
    <a href="api-docs.html">API Docs</a>
    <a href="chat.html">Chat</a>
    <a href="settings.html">Settings</a>
  </div>
</nav>

<div class="main-layout">
  <!-- Content -->
  <div class="content-area">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search tools by name, description..." onkeydown="if(event.key==='Enter')filterTools()">
      <button class="btn btn-primary" onclick="filterTools()">Search</button>
    </div>

    <div class="stats-row">
      <div class="mini-stat">
        <div class="mini-stat-number" id="totalTools">0</div>
        <div class="mini-stat-label">Total Tools</div>
      </div>
      <div class="mini-stat">
        <div class="mini-stat-number" id="categoryCount">0</div>
        <div class="mini-stat-label">Categories</div>
      </div>
      <div class="mini-stat">
        <div class="mini-stat-number" id="totalParams">0</div>
        <div class="mini-stat-label">Total Parameters</div>
      </div>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>
    <div class="tool-grid" id="toolGrid"></div>
  </div>

  <!-- Detail Panel -->
  <div class="detail-panel">
    <div class="detail-empty" id="detailEmpty">Select a tool to view details and try it</div>
    <div class="detail-content" id="detailContent" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====================================================================
   JARVIS Tool Explorer — JavaScript
   ==================================================================== */

const API_BASE = window.location.origin;
let allTools = [];
let selectedTool = null;
let activeCategory = 'all';

// ── Demo Data ──────────────────────────────────────────────────────────
function generateDemoTools() {
  return [
    { name: 'shell.exec', description: 'Execute a shell command and return stdout, stderr, and exit code.',
      parameters: { type: 'object', properties: {
        command: { type: 'string', description: 'The shell command to execute' },
        timeout: { type: 'integer', description: 'Timeout in seconds (default 30)' },
        cwd: { type: 'string', description: 'Working directory path' },
      }, required: ['command'] }},
    { name: 'shell.read_file', description: 'Read the contents of a file at the given path.',
      parameters: { type: 'object', properties: {
        path: { type: 'string', description: 'Absolute file path' },
        encoding: { type: 'string', description: 'File encoding (default utf-8)' },
      }, required: ['path'] }},
    { name: 'git.status', description: 'Get the current Git repository status including staged, unstaged, and untracked files.',
      parameters: { type: 'object', properties: {
        repo_path: { type: 'string', description: 'Path to Git repository' },
      }, required: [] }},
    { name: 'git.diff', description: 'Show the diff between commits, branches, or working tree changes.',
      parameters: { type: 'object', properties: {
        ref: { type: 'string', description: 'Git ref to diff against (default HEAD)' },
        staged: { type: 'boolean', description: 'Show staged changes only' },
        path: { type: 'string', description: 'Limit diff to specific path' },
      }, required: [] }},
    { name: 'git.log', description: 'Show commit history with configurable format and filters.',
      parameters: { type: 'object', properties: {
        count: { type: 'integer', description: 'Number of commits to show' },
        author: { type: 'string', description: 'Filter by author' },
        since: { type: 'string', description: 'Show commits since date' },
      }, required: [] }},
    { name: 'http.get', description: 'Send an HTTP GET request and return the response.',
      parameters: { type: 'object', properties: {
        url: { type: 'string', description: 'Target URL' },
        headers: { type: 'string', description: 'JSON string of headers' },
        timeout: { type: 'integer', description: 'Request timeout in seconds' },
      }, required: ['url'] }},
    { name: 'http.post', description: 'Send an HTTP POST request with a JSON body.',
      parameters: { type: 'object', properties: {
        url: { type: 'string', description: 'Target URL' },
        body: { type: 'string', description: 'JSON request body' },
        headers: { type: 'string', description: 'JSON string of headers' },
      }, required: ['url'] }},
    { name: 'json.parse', description: 'Parse a JSON string and return the structured data.',
      parameters: { type: 'object', properties: {
        input: { type: 'string', description: 'JSON string to parse' },
        path: { type: 'string', description: 'JSONPath expression to extract (optional)' },
      }, required: ['input'] }},
    { name: 'json.format', description: 'Pretty-print a JSON string with configurable indentation.',
      parameters: { type: 'object', properties: {
        input: { type: 'string', description: 'JSON string to format' },
        indent: { type: 'integer', description: 'Indentation spaces (default 2)' },
      }, required: ['input'] }},
    { name: 'text.search', description: 'Search for a pattern in text or files using regex.',
      parameters: { type: 'object', properties: {
        pattern: { type: 'string', description: 'Regex pattern to search for' },
        input: { type: 'string', description: 'Text to search in' },
        path: { type: 'string', description: 'File path to search (alternative to input)' },
        case_sensitive: { type: 'boolean', description: 'Case-sensitive search (default true)' },
      }, required: ['pattern'] }},
    { name: 'text.replace', description: 'Find and replace text using regex patterns.',
      parameters: { type: 'object', properties: {
        pattern: { type: 'string', description: 'Regex pattern to find' },
        replacement: { type: 'string', description: 'Replacement string' },
        input: { type: 'string', description: 'Text to process' },
      }, required: ['pattern', 'replacement', 'input'] }},
    { name: 'text.summarize', description: 'Generate a concise summary of the provided text using LLM.',
      parameters: { type: 'object', properties: {
        input: { type: 'string', description: 'Text to summarize' },
        max_length: { type: 'integer', description: 'Maximum summary length in words' },
      }, required: ['input'] }},
  ];
}

// ── Fetch Tools ────────────────────────────────────────────────────────
async function fetchTools() {
  try {
    const res = await fetch(`${API_BASE}/tools`);
    if (!res.ok) throw new Error();
    let data = await res.json();
    allTools = Array.isArray(data) ? data : (data.data || data.tools || []);
  } catch {
    allTools = generateDemoTools();
  }
  renderCategoryTabs();
  renderTools(allTools);
  updateStats();
}

// ── Categories ─────────────────────────────────────────────────────────
function getCategory(name) {
  const prefix = name.split('.')[0];
  return prefix || 'other';
}

function renderCategoryTabs() {
  const cats = { all: allTools.length };
  allTools.forEach(t => {
    const c = getCategory(t.name);
    cats[c] = (cats[c] || 0) + 1;
  });
  const tabsEl = document.getElementById('categoryTabs');
  tabsEl.innerHTML = Object.entries(cats).map(([cat, count]) =>
    `<div class="cat-tab ${activeCategory === cat ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}<span class="cat-count">${count}</span></div>`
  ).join('');
}

function setCategory(cat) {
  activeCategory = cat;
  renderCategoryTabs();
  filterTools();
}

// ── Render Grid ────────────────────────────────────────────────────────
function renderTools(tools) {
  const grid = document.getElementById('toolGrid');
  if (!tools.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">No tools found</div>';
    return;
  }
  grid.innerHTML = tools.map((t, i) => {
    const paramCount = Object.keys(t.parameters?.properties || {}).length;
    return `
      <div class="tool-card ${selectedTool?.name === t.name ? 'selected' : ''}"
           onclick="selectTool('${t.name}')" style="animation-delay:${i*0.04}s">
        <div class="tool-name">${t.name}</div>
        <div class="tool-desc">${t.description}</div>
        <div class="tool-params-count">${paramCount} parameter${paramCount !== 1 ? 's' : ''}</div>
      </div>`;
  }).join('');
}

// ── Filter ─────────────────────────────────────────────────────────────
function filterTools() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allTools.filter(t => {
    const matchQ = !q || t.name.toLowerCase().includes(q) || t.description.toLowerCase().includes(q);
    const matchCat = activeCategory === 'all' || getCategory(t.name) === activeCategory;
    return matchQ && matchCat;
  });
  renderTools(filtered);
}

// ── Select Tool ────────────────────────────────────────────────────────
function selectTool(name) {
  selectedTool = allTools.find(t => t.name === name);
  if (!selectedTool) return;
  filterTools();

  document.getElementById('detailEmpty').style.display = 'none';
  const dc = document.getElementById('detailContent');
  dc.style.display = 'flex';

  const props = selectedTool.parameters?.properties || {};
  const required = selectedTool.parameters?.required || [];

  const formFields = Object.entries(props).map(([key, schema]) => {
    const isReq = required.includes(key);
    const inputId = `param_${key}`;

    let inputHtml;
    if (schema.type === 'boolean') {
      inputHtml = `
        <div class="param-input-bool">
          <input type="checkbox" id="${inputId}">
          <label for="${inputId}" style="font-size:13px;color:var(--text-dim)">Enable</label>
        </div>`;
    } else if (schema.type === 'integer' || schema.type === 'number') {
      inputHtml = `<input type="number" class="param-input" id="${inputId}" placeholder="${schema.description || ''}">`;
    } else {
      inputHtml = `<input type="text" class="param-input" id="${inputId}" placeholder="${schema.description || ''}">`;
    }

    return `
      <div class="param-field">
        <div class="param-label">
          ${key}
          <span class="param-type">${schema.type}</span>
          ${isReq ? '<span class="param-required">REQUIRED</span>' : ''}
        </div>
        ${inputHtml}
        ${schema.description ? `<div class="param-hint">${schema.description}</div>` : ''}
      </div>`;
  }).join('');

  dc.innerHTML = `
    <div>
      <div class="detail-title">${selectedTool.name}</div>
      <div class="detail-desc">${selectedTool.description}</div>
    </div>
    <div>
      <div class="section-title">Parameters</div>
      <div class="param-form">${formFields || '<div style="font-size:13px;color:var(--text-muted)">No parameters</div>'}</div>
    </div>
    <div>
      <button class="btn btn-primary" onclick="executeTool()" style="width:100%">Try It</button>
    </div>
    <div class="output-section">
      <div class="section-title">Output</div>
      <div class="output-display loading" id="outputDisplay">Output will appear here after execution...</div>
    </div>
  `;
}

// ── Execute Tool ───────────────────────────────────────────────────────
async function executeTool() {
  if (!selectedTool) return;
  const output = document.getElementById('outputDisplay');
  output.className = 'output-display loading';
  output.textContent = 'Executing...';

  const props = selectedTool.parameters?.properties || {};
  const params = {};
  Object.entries(props).forEach(([key, schema]) => {
    const el = document.getElementById(`param_${key}`);
    if (!el) return;
    if (schema.type === 'boolean') {
      params[key] = el.checked;
    } else if (schema.type === 'integer') {
      const v = parseInt(el.value); if (!isNaN(v)) params[key] = v;
    } else if (schema.type === 'number') {
      const v = parseFloat(el.value); if (!isNaN(v)) params[key] = v;
    } else {
      if (el.value.trim()) params[key] = el.value.trim();
    }
  });

  try {
    const res = await fetch(`${API_BASE}/tools/${selectedTool.name}/execute`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params),
    });
    const data = await res.json();
    output.className = 'output-display';
    output.textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    // Demo fallback
    output.className = 'output-display';
    const demo = {
      tool: selectedTool.name,
      parameters: params,
      result: `[Demo] Tool "${selectedTool.name}" executed successfully with ${Object.keys(params).length} parameters.`,
      timestamp: new Date().toISOString(),
    };
    output.textContent = JSON.stringify(demo, null, 2);
    showToast('Executed in demo mode');
  }
}

// ── Stats ──────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('totalTools').textContent = allTools.length;
  const cats = new Set(allTools.map(t => getCategory(t.name)));
  document.getElementById('categoryCount').textContent = cats.size;
  const tp = allTools.reduce((a, t) => a + Object.keys(t.parameters?.properties || {}).length, 0);
  document.getElementById('totalParams').textContent = tp;
}

// ── Toast ──────────────────────────────────────────────────────────────
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--red)' : 'var(--green)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ───────────────────────────────────────────────────────────────
fetchTools();
</script>
</body>
</html>
