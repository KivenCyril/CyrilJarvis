<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - 工作流</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-hover:     #1c2d42;
  --bg-input:     #0c1322;
  --border:       #1e2d40;
  --border-light: #2d4054;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #5a6d82;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --green-bg:     rgba(34,197,94,0.12);
  --orange:       #f59e0b;
  --orange-bg:    rgba(245,158,11,0.12);
  --red:          #ef4444;
  --red-bg:       rgba(239,68,68,0.12);
  --purple:       #a855f7;
  --purple-bg:    rgba(168,85,247,0.12);
  --cyan:         #06b6d4;
  --cyan-bg:      rgba(6,182,212,0.12);
  --yellow:       #eab308;
  --radius:       8px;
  --radius-lg:    12px;
  --transition:   200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  --shadow:       0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md:    0 4px 12px rgba(0,0,0,0.3);
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; overflow: hidden; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }

/* ── Top Bar ─────────────────────────────────────────────── */
.topbar {
  height: 50px; background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 50; position: relative;
}
.topbar::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2) 50%, transparent); }
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(99,102,241,0.35); }
.topbar-logo svg { width: 16px; height: 16px; color: #fff; }
.topbar-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #93c5fd, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.topbar-page { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-left: 8px; }
.topbar-spacer { flex: 1; }
.topbar-btn { width: 34px; height: 34px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: var(--transition); }
.topbar-btn:hover { background: var(--bg-hover); color: var(--text-dim); }
.topbar-btn svg { width: 17px; height: 17px; }

/* ── Layout ──────────────────────────────────────────────── */
.page-layout { flex: 1; display: grid; grid-template-columns: 248px 1fr; overflow: hidden; transition: grid-template-columns 300ms cubic-bezier(0.16,1,0.3,1); }
.page-layout.sidebar-collapsed { grid-template-columns: 0px 1fr; }

/* ── Sidebar ─────────────────────────────────────────────── */
.page-sidebar {
  background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  width: 248px; min-width: 248px; max-width: 248px;
  transition: all 300ms cubic-bezier(0.16,1,0.3,1);
}
.sidebar-collapsed .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.page-sidebar-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 16px; }
.nav-group { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(30,45,64,0.6); }
.nav-group:last-child { border-bottom: none; }
.nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-muted); font-weight: 600; padding: 10px 10px 5px; user-select: none; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim); text-decoration: none; transition: var(--transition); position: relative; border: 1px solid transparent; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; border-color: var(--border); }
.nav-item.active { background: rgba(59,130,246,0.08); color: var(--accent-hover); font-weight: 500; border-color: rgba(59,130,246,0.15); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.55; }
.nav-item:hover svg { opacity: 0.8; }
.nav-item.active svg { opacity: 1; }

.page-content { overflow-y: auto; }

@media (max-width: 1024px) {
  .page-layout { grid-template-columns: 0px 1fr; }
  .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
}

/* ── Workflow Main Layout ────────────────────────────────── */
.wf-main { display: flex; height: 100%; overflow: hidden; }

/* ── Left Panel: Workflow List ───────────────────────────── */
.wf-list-panel {
  width: 320px; min-width: 260px; background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.wf-list-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.wf-list-header h2 { font-size: 15px; font-weight: 600; }
.btn-new {
  padding: 6px 14px; background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius); font-size: 12px; font-weight: 500; cursor: pointer;
  display: flex; align-items: center; gap: 5px; transition: var(--transition);
}
.btn-new:hover { background: var(--accent-hover); }
.btn-new svg { width: 13px; height: 13px; }
.wf-list { flex: 1; overflow-y: auto; }
.wf-item {
  padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  transition: var(--transition);
}
.wf-item:hover { background: var(--bg-hover); }
.wf-item.active { background: var(--bg-surface); border-left: 3px solid var(--accent); }
.wf-item-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.wf-item-meta { display: flex; gap: 8px; align-items: center; }
.wf-item-meta span { font-size: 11px; color: var(--text-muted); }

/* ── Badges ──────────────────────────────────────────────── */
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 10px; font-weight: 600; text-transform: uppercase;
}
.badge-running   { background: var(--green-bg); color: var(--green); }
.badge-pending   { background: var(--orange-bg); color: var(--orange); }
.badge-failed    { background: var(--red-bg); color: var(--red); }
.badge-completed { background: var(--cyan-bg); color: var(--cyan); }
.badge-draft     { background: rgba(100,116,139,0.15); color: var(--text-muted); }

/* ── Center: Workflow Editor ─────────────────────────────── */
.wf-editor {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}
.wf-editor-toolbar {
  height: 48px; padding: 0 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; background: var(--bg-base);
}
.wf-editor-toolbar .wf-name { font-size: 15px; font-weight: 600; flex: 1; }
.wf-editor-toolbar button {
  padding: 6px 14px; border-radius: var(--radius); font-size: 12px;
  font-weight: 500; border: none; cursor: pointer; display: flex;
  align-items: center; gap: 5px; transition: var(--transition);
}
.wf-editor-toolbar button svg { width: 13px; height: 13px; }
.btn-run { background: var(--green); color: #fff; }
.btn-run:hover { background: #16a34a; }
.btn-save { background: var(--accent); color: #fff; }
.btn-save:hover { background: var(--accent-hover); }
.btn-delete { background: var(--red); color: #fff; }
.btn-delete:hover { opacity: 0.85; }

/* ── Canvas ──────────────────────────────────────────────── */
.wf-canvas {
  flex: 1; position: relative; overflow: auto; background: var(--bg-deep);
  background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
  background-size: 24px 24px;
}
.wf-canvas-inner { position: relative; min-height: 600px; padding: 40px; }

/* ── Step Card ───────────────────────────────────────────── */
.step-card {
  position: absolute; width: 220px; background: var(--bg-surface);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 14px; cursor: grab; box-shadow: var(--shadow); transition: box-shadow 150ms;
  user-select: none;
}
.step-card:hover { box-shadow: var(--shadow-md); }
.step-card.dragging { opacity: 0.8; cursor: grabbing; z-index: 100; }
.step-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.step-icon {
  width: 28px; height: 28px; border-radius: 6px; display: flex;
  align-items: center; justify-content: center; flex-shrink: 0;
}
.step-icon svg { width: 14px; height: 14px; }
.step-icon.action    { background: var(--green-bg); color: var(--green); }
.step-icon.condition { background: var(--orange-bg); color: var(--orange); }
.step-icon.loop      { background: var(--purple-bg); color: var(--purple); }
.step-icon.parallel  { background: var(--cyan-bg); color: var(--cyan); }
.step-icon.approval  { background: var(--red-bg); color: var(--red); }
.step-name { font-size: 13px; font-weight: 600; flex: 1; }
.step-desc { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
.step-status { font-size: 10px; }
.step-actions {
  display: flex; gap: 4px; margin-top: 8px; opacity: 0; transition: opacity 150ms;
}
.step-card:hover .step-actions { opacity: 1; }
.step-actions button {
  padding: 3px 8px; font-size: 10px; border-radius: 4px; border: 1px solid var(--border);
  color: var(--text-dim); background: var(--bg-surface); cursor: pointer; transition: var(--transition);
}
.step-actions button:hover { color: var(--text); border-color: var(--accent); }

/* ── Connectors ──────────────────────────────────────────── */
.wf-connectors { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.wf-connectors svg { width: 100%; height: 100%; }

/* ── Right Panel: Detail ─────────────────────────────────── */
.wf-right-panel {
  width: 300px; background: var(--bg-base); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
}
.panel-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.panel-title {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 10px;
}

/* ── Template Selector ───────────────────────────────────── */
.template-select {
  width: 100%; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 13px; font-family: var(--font);
  transition: var(--transition); cursor: pointer;
}
.template-select:focus { outline: none; border-color: var(--accent); }

/* ── Progress Steps ──────────────────────────────────────── */
.progress-step { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.progress-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.progress-dot.done    { background: var(--green); }
.progress-dot.running { background: var(--accent); animation: pulse 1.5s infinite; }
.progress-dot.pending { background: var(--text-muted); }
.progress-dot.failed  { background: var(--red); }
.progress-label { font-size: 12px; color: var(--text-dim); flex: 1; }
.progress-time { font-size: 10px; color: var(--text-muted); font-family: var(--mono); }

@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

/* ── Variable Inspector ──────────────────────────────────── */
.var-item { display: flex; align-items: center; padding: 6px 0; gap: 8px; border-bottom: 1px solid var(--border); }
.var-item:last-child { border-bottom: none; }
.var-name { font-size: 12px; font-family: var(--mono); color: var(--cyan); min-width: 80px; }
.var-value { font-size: 12px; color: var(--text-dim); flex: 1; word-break: break-all; }
.var-type {
  font-size: 9px; padding: 1px 5px; border-radius: 3px;
  background: var(--bg-surface); color: var(--text-muted);
}

/* ── Add Step Toolbar ────────────────────────────────────── */
.add-step-bar {
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg-base);
  display: flex; gap: 6px; flex-wrap: wrap;
}
.add-step-btn {
  padding: 5px 10px; border-radius: var(--radius); font-size: 11px; font-weight: 500;
  border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-dim);
  cursor: pointer; display: flex; align-items: center; gap: 5px; transition: var(--transition);
}
.add-step-btn:hover { border-color: var(--accent); color: var(--text); }
.add-step-btn svg { width: 12px; height: 12px; }

/* ── Create Workflow Dialog ──────────────────────────────── */
.dialog-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  z-index: 1000; display: none; align-items: center; justify-content: center;
}
.dialog-overlay.visible { display: flex; }
.dialog {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 24px; width: 420px; box-shadow: var(--shadow-md);
}
.dialog h3 { font-size: 16px; margin-bottom: 16px; }
.dialog .form-group { margin-bottom: 12px; }
.dialog label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.dialog input, .dialog select, .dialog textarea {
  width: 100%; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 13px; font-family: var(--font);
  transition: var(--transition);
}
.dialog input:focus, .dialog select:focus, .dialog textarea:focus { outline: none; border-color: var(--accent); }
.dialog textarea { resize: vertical; min-height: 60px; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.dialog-actions button {
  padding: 8px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
  border: none; cursor: pointer; transition: var(--transition);
}
.btn-cancel { background: var(--bg-hover); color: var(--text-dim); }
.btn-cancel:hover { background: var(--border-light); color: var(--text); }
.btn-create { background: var(--accent); color: #fff; }
.btn-create:hover { background: var(--accent-hover); }

/* ── Toast ───────────────────────────────────────────────── */
.toast-container { position: fixed; top: 60px; right: 16px; z-index: 1001; }
.toast {
  padding: 10px 16px; background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; margin-bottom: 8px; box-shadow: var(--shadow);
  animation: toastIn 300ms ease; display: flex; align-items: center; gap: 8px;
}
.toast svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--green); }
@keyframes toastIn {
  from { transform: translateX(120%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ── Workflow Info ────────────────────────────────────────── */
.wf-info-row { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; display: flex; gap: 6px; }
.wf-info-label { color: var(--text-muted); min-width: 60px; flex-shrink: 0; }
.wf-info-desc { font-size: 12px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }

/* ── Empty State ─────────────────────────────────────────── */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); gap: 12px; padding: 40px; }
.empty-state svg { width: 48px; height: 48px; opacity: 0.3; }
.empty-state p { font-size: 13px; }

@media (max-width: 768px) {
  .wf-list-panel { width: 240px; min-width: 200px; }
  .wf-right-panel { width: 240px; }
}
</style>
</head>

<script>
(() => {
'use strict';

/* ====================================================================
   JARVIS Workflow Manager
   ==================================================================== */

const API_BASE = window.location.origin;

/* SVG icon markup for each step type */
const STEP_ICONS = {
  action: {
    cssClass: 'action',
    svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>'

  condition: {

  },
  loop: {
    cssClass: 'loop',
    svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>'
  },
  parallel: {
    cssClass: 'parallel',
    svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="16" y2="21"/></svg>'
  },
  approval: {
    cssClass: 'approval',
    svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>'
  }
};

/* Status label map */
const STATUS_LABELS = {
  running: '运行中',
  pending: '待执行',
  completed: '已完成',
  failed: '已失败',
  draft: '草稿',
  done: '已完成'
};

/* Step type label map */
const STEP_TYPE_LABELS = {
  action: '动作',
  condition: '条件',
  loop: '循环',
  parallel: '并行',
  approval: '审批'
};

let workflows = [];
let activeWfId = null;
let dragTarget = null;
let dragOffset = { x: 0, y: 0 };

/* ── Templates ──────────────────────────────────────────── */

const TEMPLATES = {
  research: {
    steps: [
      { id: 's1', name: '收集资料', type: 'action', desc: '搜索并收集相关来源', x: 60, y: 40, status: 'pending' },
      { id: 's2', name: '质量过滤', type: 'condition', desc: '检查来源可靠性', x: 60, y: 160, status: 'pending' },
      { id: 's3', name: '提取数据', type: 'loop', desc: '从每个来源提取关键信息', x: 60, y: 280, status: 'pending' },
      { id: 's4', name: '生成报告', type: 'action', desc: '整理发现并生成报告', x: 60, y: 400, status: 'pending' },
    ],
    connections: [['s1','s2'],['s2','s3'],['s3','s4']],
    variables: [
      { name: 'query', value: '', type: 'string' },
      { name: 'max_sources', value: '10', type: 'number' },
    ],
  },
  'code-review': {
    steps: [
      { id: 's1', name: '获取 PR', type: 'action', desc: '获取拉取请求差异', x: 60, y: 40, status: 'pending' },
      { id: 's2', name: '静态分析', type: 'parallel', desc: '运行 lint、类型检查、安全扫描', x: 60, y: 160, status: 'pending' },
      { id: 's3', name: 'AI 审查', type: 'action', desc: '基于大模型的代码审查', x: 60, y: 280, status: 'pending' },
      { id: 's4', name: '审批/驳回', type: 'approval', desc: '人工审批关卡', x: 60, y: 400, status: 'pending' },
    ],
    connections: [['s1','s2'],['s2','s3'],['s3','s4']],
    variables: [
      { name: 'pr_url', value: '', type: 'string' },
      { name: 'auto_approve', value: 'false', type: 'boolean' },
    ],
  },
  'data-pipeline': {
    steps: [
      { id: 's1', name: '采集数据', type: 'action', desc: '从数据源读取', x: 60, y: 40, status: 'pending' },
      { id: 's2', name: '校验结构', type: 'condition', desc: '确保数据符合模式', x: 60, y: 160, status: 'pending' },
      { id: 's3', name: '数据转换', type: 'loop', desc: '逐行应用转换规则', x: 60, y: 280, status: 'pending' },
      { id: 's4', name: '写入目标', type: 'action', desc: '写入目标存储', x: 60, y: 400, status: 'pending' },
    ],
    connections: [['s1','s2'],['s2','s3'],['s3','s4']],
    variables: [
      { name: 'source_path', value: '', type: 'string' },
      { name: 'dest_path', value: '', type: 'string' },
    ],
  },
  deployment: {
    steps: [
      { id: 's1', name: '构建', type: 'action', desc: '编译并打包', x: 60, y: 40, status: 'pending' },
      { id: 's2', name: '测试', type: 'parallel', desc: '运行单元测试和集成测试', x: 60, y: 160, status: 'pending' },
      { id: 's3', name: '部署预发', type: 'action', desc: '部署至预发环境', x: 60, y: 280, status: 'pending' },
      { id: 's4', name: '生产审批', type: 'approval', desc: '生产部署人工审批', x: 60, y: 400, status: 'pending' },
      { id: 's5', name: '部署生产', type: 'action', desc: '部署至生产环境', x: 60, y: 520, status: 'pending' },
    ],
    connections: [['s1','s2'],['s2','s3'],['s3','s4'],['s4','s5']],
    variables: [
      { name: 'branch', value: 'main', type: 'string' },
      { name: 'env', value: 'staging', type: 'string' },
    ],
  },
  onboarding: {
    steps: [
      { id: 's1', name: '创建账户', type: 'action', desc: '设置用户账户', x: 60, y: 40, status: 'pending' },
      { id: 's2', name: '发送欢迎邮件', type: 'action', desc: '发送欢迎通知', x: 60, y: 160, status: 'pending' },
      { id: 's3', name: '配置工作区', type: 'parallel', desc: '配置工具和权限', x: 60, y: 280, status: 'pending' },
      { id: 's4', name: '完成检查', type: 'condition', desc: '验证所有步骤完成', x: 60, y: 400, status: 'pending' },
    ],
    connections: [['s1','s2'],['s2','s3'],['s3','s4']],
    variables: [
      { name: 'user_email', value: '', type: 'string' },
      { name: 'role', value: 'member', type: 'string' },
    ],
  },
};

/* ── Initialize ─────────────────────────────────────────── */

function init() {
  loadDemoWorkflows();
  renderWorkflowList();
}

function loadDemoWorkflows() {
  workflows = [
    {
      id: 'wf1', name: '研究管线', description: '自动化研究与报告生成',
      status: 'running', created: '2025-05-28',
      steps: TEMPLATES.research.steps.map(s => ({...s})),
      connections: [...TEMPLATES.research.connections],
      variables: TEMPLATES.research.variables.map(v => ({...v})),
    },
    {
      id: 'wf2', name: '代码审查机器人', description: '自动化 PR 审查管线',
      status: 'completed', created: '2025-05-25',
      steps: TEMPLATES['code-review'].steps.map(s => ({...s, status: 'done'})),
      connections: [...TEMPLATES['code-review'].connections],
      variables: TEMPLATES['code-review'].variables.map(v => ({...v})),
    },
    {
      id: 'wf3', name: '每日部署', description: 'CI/CD 持续集成管线',
      status: 'pending', created: '2025-05-30',
      steps: TEMPLATES.deployment.steps.map(s => ({...s})),
      connections: [...TEMPLATES.deployment.connections],
      variables: TEMPLATES.deployment.variables.map(v => ({...v})),
    },
  ];
}

/* ── Workflow List ──────────────────────────────────────── */

function renderWorkflowList() {
  const container = document.getElementById('workflowList');
  container.innerHTML = workflows.map(wf => `
    <div class="wf-item ${wf.id === activeWfId ? 'active' : ''}" onclick="selectWorkflow('${wf.id}')">
      <div class="wf-item-title">${escapeHtml(wf.name)}</div>
      <div class="wf-item-meta">
        <span class="badge badge-${wf.status}">${STATUS_LABELS[wf.status] || wf.status}</span>
        <span>${wf.steps.length} 个步骤</span>
        <span>${wf.created}</span>
      </div>
    </div>
  `).join('');
}

function selectWorkflow(id) {
  activeWfId = id;
  const wf = workflows.find(w => w.id === id);
  if (!wf) return;

  document.getElementById('editorTitle').textContent = wf.name;
  document.getElementById('btnRun').style.display = '';
  document.getElementById('btnSave').style.display = '';
  document.getElementById('btnDelete').style.display = '';
  document.getElementById('addStepBar').style.display = '';
  document.getElementById('emptyState').style.display = 'none';

  renderWorkflowList();
  renderSteps(wf);
  renderConnectors(wf);
  renderProgress(wf);
  renderVariables(wf);
  renderWfInfo(wf);
}

/* ── Step Rendering ─────────────────────────────────────── */

function renderSteps(wf) {
  const container = document.getElementById('canvasInner');
  container.querySelectorAll('.step-card').forEach(el => el.remove());

  for (const step of wf.steps) {
    const iconInfo = STEP_ICONS[step.type] || STEP_ICONS.action;
    const card = document.createElement('div');
    card.className = 'step-card';
    card.id = 'step-' + step.id;
    card.style.left = step.x + 'px';
    card.style.top = step.y + 'px';
    card.dataset.stepId = step.id;

    card.innerHTML =
      '<div class="step-header">' +
        '<div class="step-icon ' + iconInfo.cssClass + '">' + iconInfo.svg + '</div>' +
        '<div class="step-name">' + escapeHtml(step.name) + '</div>' +
      '</div>' +
      '<div class="step-desc">' + escapeHtml(step.desc) + '</div>' +
      '<div class="step-status"><span class="badge badge-' + step.status + '">' + (STATUS_LABELS[step.status] || step.status) + '</span></div>' +
      '<div class="step-actions">' +
        '<button onclick="editStep(\'' + step.id + '\')">编辑</button>' +
        '<button onclick="removeStep(\'' + step.id + '\')">移除</button>' +
      '</div>';

    card.addEventListener('mousedown', function(e) {
      if (e.target.tagName === 'BUTTON') return;
      dragTarget = step;
      const rect = card.getBoundingClientRect();
      dragOffset.x = e.clientX - rect.left;
      dragOffset.y = e.clientY - rect.top;
      card.classList.add('dragging');
    });

    container.appendChild(card);
  }
}

/* Global drag handlers */
document.addEventListener('mousemove', function(e) {
  if (!dragTarget) return;
  const canvas = document.getElementById('wfCanvas');
  const canvasRect = canvas.getBoundingClientRect();
  const newX = e.clientX - canvasRect.left - dragOffset.x + canvas.scrollLeft;
  const newY = e.clientY - canvasRect.top - dragOffset.y + canvas.scrollTop;
  dragTarget.x = Math.max(0, newX);
  dragTarget.y = Math.max(0, newY);
  const card = document.getElementById('step-' + dragTarget.id);
  if (card) {
    card.style.left = dragTarget.x + 'px';
    card.style.top = dragTarget.y + 'px';
  }
  const wf = workflows.find(w => w.id === activeWfId);
  if (wf) renderConnectors(wf);
});

document.addEventListener('mouseup', function() {
  if (dragTarget) {
    const card = document.getElementById('step-' + dragTarget.id);
    if (card) card.classList.remove('dragging');
    dragTarget = null;
  }
});

/* ── Connectors ─────────────────────────────────────────── */

function renderConnectors(wf) {
  const svg = document.getElementById('connectorsSvg');
  let html = '';

  for (const [fromId, toId] of wf.connections) {
    const fromStep = wf.steps.find(s => s.id === fromId);
    const toStep = wf.steps.find(s => s.id === toId);
    if (!fromStep || !toStep) continue;

    const x1 = fromStep.x + 110;
    const y1 = fromStep.y + 90;
    const x2 = toStep.x + 110;
    const y2 = toStep.y;
    const my = (y1 + y2) / 2;

    html += '<path d="M' + x1 + ',' + y1 + ' C' + x1 + ',' + my + ' ' + x2 + ',' + my + ' ' + x2 + ',' + y2 + '"' +
      ' fill="none" stroke="var(--border-light)" stroke-width="2" stroke-dasharray="4,4" />';
    html += '<polygon points="' + (x2-5) + ',' + (y2-8) + ' ' + (x2+5) + ',' + (y2-8) + ' ' + x2 + ',' + y2 + '"' +
      ' fill="var(--border-light)" />';
  }

  svg.innerHTML = html;
}

/* ── Add / Edit / Remove Steps ──────────────────────────── */

let stepCounter = 100;

window.addStep = function(type) {
  const wf = workflows.find(w => w.id === activeWfId);
  if (!wf) return;

  const id = 's' + (++stepCounter);
  const lastStep = wf.steps[wf.steps.length - 1];
  const y = lastStep ? lastStep.y + 120 : 40;
  const typeLabel = STEP_TYPE_LABELS[type] || type;

  wf.steps.push({
    id: id, name: '新' + typeLabel, type: type,
    desc: typeLabel + '步骤', x: 60, y: y, status: 'pending',
  });

  if (lastStep) {
    wf.connections.push([lastStep.id, id]);
  }

  selectWorkflow(wf.id);
  showToast(typeLabel + '步骤已添加');
};

window.editStep = function(stepId) {
  const wf = workflows.find(w => w.id === activeWfId);
  if (!wf) return;
  const step = wf.steps.find(s => s.id === stepId);
  if (!step) return;

  const name = prompt('步骤名称:', step.name);
  if (name !== null && name.trim()) {
    step.name = name.trim();
    const desc = prompt('步骤描述:', step.desc);
    if (desc !== null) step.desc = desc.trim();
    selectWorkflow(wf.id);
  }
};

window.removeStep = function(stepId) {
  const wf = workflows.find(w => w.id === activeWfId);
  if (!wf) return;
  wf.steps = wf.steps.filter(s => s.id !== stepId);
  wf.connections = wf.connections.filter(function(c) { return c[0] !== stepId && c[1] !== stepId; });
  selectWorkflow(wf.id);
  showToast('步骤已移除');
};

/* ── Progress Rendering ─────────────────────────────────── */

function renderProgress(wf) {
  const container = document.getElementById('progressList');
  if (wf.status === 'pending' || wf.status === 'draft') {
    container.innerHTML = '<div style="font-size:12px;color:var(--text-muted)">工作流未启动</div>';
    return;
  }

  container.innerHTML = wf.steps.map(function(step) {
    const dotClass = step.status === 'done' ? 'done' :
                     step.status === 'running' ? 'running' :
                     step.status === 'failed' ? 'failed' : 'pending';
    return '<div class="progress-step">' +
      '<div class="progress-dot ' + dotClass + '"></div>' +
      '<div class="progress-label">' + escapeHtml(step.name) + '</div>' +
      '<div class="progress-time">' + (step.status === 'done' ? '2.1s' : step.status === 'running' ? '...' : '--') + '</div>' +
    '</div>';
  }).join('');
}

/* ── Variable Inspector ─────────────────────────────────── */

function renderVariables(wf) {
  const container = document.getElementById('variableList');
  if (!wf.variables || wf.variables.length === 0) {
    container.innerHTML = '<div style="font-size:12px;color:var(--text-muted)">暂无定义变量</div>';
    return;
  }

  container.innerHTML = wf.variables.map(function(v) {
    return '<div class="var-item">' +
      '<span class="var-name">' + escapeHtml(v.name) + '</span>' +
      '<span class="var-value">' + (v.value ? escapeHtml(v.value) : '(空)') + '</span>' +
      '<span class="var-type">' + escapeHtml(v.type) + '</span>' +
    '</div>';
  }).join('');
}

/* ── Workflow Info ──────────────────────────────────────── */

function renderWfInfo(wf) {
  const panel = document.getElementById('wfInfoPanel');
  panel.style.display = '';
  document.getElementById('wfInfo').innerHTML =
    '<div class="wf-info-row"><span class="wf-info-label">ID</span><span>' + escapeHtml(wf.id) + '</span></div>' +
    '<div class="wf-info-row"><span class="wf-info-label">创建时间</span><span>' + escapeHtml(wf.created) + '</span></div>' +
    '<div class="wf-info-row"><span class="wf-info-label">步骤数</span><span>' + wf.steps.length + '</span></div>' +
    '<div class="wf-info-row"><span class="wf-info-label">状态</span><span class="badge badge-' + wf.status + '">' + (STATUS_LABELS[wf.status] || wf.status) + '</span></div>' +
    '<div class="wf-info-desc">' + escapeHtml(wf.description) + '</div>';
}

/* ── Template Application ──────────────────────────────── */

window.applyTemplate = function() {
  const sel = document.getElementById('templateSelect');
  const tplName = sel.value;
  if (!tplName || !TEMPLATES[tplName]) return;

  const tpl = TEMPLATES[tplName];
  const id = 'wf' + Date.now();
  const nameMap = {
    'research': '研究报告工作流',
    'code-review': '代码审查工作流',
    'data-pipeline': '数据处理工作流',
    'deployment': '部署工作流',
    'onboarding': '用户引导工作流'
  };

  workflows.push({
    id: id, name: nameMap[tplName] || tplName, description: '从模板创建',
    status: 'draft', created: new Date().toISOString().slice(0,10),
    steps: tpl.steps.map(s => ({...s})),
    connections: tpl.connections.map(c => [...c]),
    variables: tpl.variables.map(v => ({...v})),
  });

  renderWorkflowList();
  selectWorkflow(id);
  sel.value = '';
  showToast('已从模板创建工作流');
};

/* ── CRUD Operations ───────────────────────────────────── */

window.showCreateDialog = function() { document.getElementById('createDialog').classList.add('visible'); };
window.hideCreateDialog = function() { document.getElementById('createDialog').classList.remove('visible'); };

window.createWorkflow = function() {
  const name = document.getElementById('newWfName').value.trim() || '未命名工作流';
  const desc = document.getElementById('newWfDesc').value.trim();
  const tplName = document.getElementById('newWfTemplate').value;

  const id = 'wf' + Date.now();
  const tpl = tplName && TEMPLATES[tplName] ? TEMPLATES[tplName] : { steps: [], connections: [], variables: [] };

  workflows.push({
    id: id, name: name, description: desc, status: 'draft',
    created: new Date().toISOString().slice(0,10),
    steps: tpl.steps.map(s => ({...s})),
    connections: tpl.connections.map(c => [...c]),
    variables: tpl.variables.map(v => ({...v})),
  });

  hideCreateDialog();
  document.getElementById('newWfName').value = '';
  document.getElementById('newWfDesc').value = '';
  document.getElementById('newWfTemplate').value = '';
  renderWorkflowList();
  selectWorkflow(id);
  showToast('工作流"' + name + '"已创建');
};

window.saveWorkflow = function() {
  showToast('工作流已保存');
};

window.deleteWorkflow = function() {
  if (!activeWfId) return;
  const wf = workflows.find(w => w.id === activeWfId);
  const wfName = wf ? wf.name : '';
  workflows = workflows.filter(w => w.id !== activeWfId);
  activeWfId = null;
  document.getElementById('editorTitle').textContent = '选择一个工作流';
  document.getElementById('btnRun').style.display = 'none';
  document.getElementById('btnSave').style.display = 'none';
  document.getElementById('btnDelete').style.display = 'none';
  document.getElementById('addStepBar').style.display = 'none';
  document.getElementById('emptyState').style.display = '';
  document.getElementById('canvasInner').querySelectorAll('.step-card').forEach(el => el.remove());
  document.getElementById('connectorsSvg').innerHTML = '';
  document.getElementById('wfInfoPanel').style.display = 'none';
  document.getElementById('progressList').innerHTML = '<div style="font-size:12px;color:var(--text-muted)">暂无执行中的任务</div>';
  document.getElementById('variableList').innerHTML = '<div style="font-size:12px;color:var(--text-muted)">暂无定义变量</div>';
  renderWorkflowList();
  showToast('工作流"' + wfName + '"已删除');
};

window.runWorkflow = function() {
  const wf = workflows.find(w => w.id === activeWfId);
  if (!wf) return;
  wf.status = 'running';
  wf.steps[0].status = 'running';
  selectWorkflow(wf.id);
  renderWorkflowList();
  showToast('工作流已启动');

  let idx = 0;
  const interval = setInterval(function() {
    if (idx < wf.steps.length) {
      wf.steps[idx].status = 'done';
      idx++;
      if (idx < wf.steps.length) wf.steps[idx].status = 'running';
    }
    if (idx >= wf.steps.length) {
      wf.status = 'completed';
      clearInterval(interval);
      showToast('工作流已完成');
    }
    if (wf.id === activeWfId) {
      renderSteps(wf);
      renderConnectors(wf);
      renderProgress(wf);
      renderWorkflowList();
    }
  }, 1500);
};

/* ── Toast ──────────────────────────────────────────────── */

function showToast(message) {
  const container = document.getElementById('toasts');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' +
    '<span>' + escapeHtml(message) + '</span>';
  container.appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

/* ── Utilities ──────────────────────────────────────────── */

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ── Sidebar Toggle ─────────────────────────────────────── */

document.getElementById('sidebarToggle').addEventListener('click', function() {
  document.getElementById('pageLayout').classList.toggle('sidebar-collapsed');
});

/* ── Expose select for onclick ──────────────────────────── */

window.selectWorkflow = selectWorkflow;

/* ── Start ──────────────────────────────────────────────── */

init();

})();
</script>
</body>
</html>
