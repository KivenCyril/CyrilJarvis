<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - 会话管理</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-hover:     #1c2d42;
  --bg-input:     #0c1322;
  --border:       #1e2d40;
  --border-light: #2d4054;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #5a6d82;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --orange:       #f59e0b;
  --red:          #ef4444;
  --purple:       #a855f7;
  --cyan:         #06b6d4;
  --pink:         #ec4899;
  --yellow:       #eab308;
  --radius:       8px;
  --radius-lg:    12px;
  --transition:   200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; overflow: hidden; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }

/* ── Top Bar ─────────────────────────────────────────────── */
.topbar {
  height: 50px; background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 50; position: relative;
}
.topbar::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2) 50%, transparent); }
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(99,102,241,0.35); }
.topbar-logo svg { width: 16px; height: 16px; color: #fff; }
.topbar-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #93c5fd, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.topbar-page { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-left: 8px; }
.topbar-spacer { flex: 1; }
.topbar-btn { width: 34px; height: 34px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: var(--transition); }
.topbar-btn:hover { background: var(--bg-hover); color: var(--text-dim); }
.topbar-btn svg { width: 17px; height: 17px; }

/* ── Layout ──────────────────────────────────────────────── */
.page-layout { flex: 1; display: grid; grid-template-columns: 248px 1fr; overflow: hidden; transition: grid-template-columns 300ms cubic-bezier(0.16,1,0.3,1); }
.page-layout.sidebar-collapsed { grid-template-columns: 0px 1fr; }

/* ── Sidebar ─────────────────────────────────────────────── */
.page-sidebar {
  background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  width: 248px; min-width: 248px; max-width: 248px;
  transition: all 300ms cubic-bezier(0.16,1,0.3,1);
}
.sidebar-collapsed .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.page-sidebar-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 16px; }
.nav-group { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(30,45,64,0.6); }
.nav-group:last-child { border-bottom: none; }
.nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-muted); font-weight: 600; padding: 10px 10px 5px; user-select: none; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim); text-decoration: none; transition: var(--transition); position: relative; border: 1px solid transparent; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; border-color: var(--border); }
.nav-item.active { background: rgba(59,130,246,0.08); color: var(--accent-hover); font-weight: 500; border-color: rgba(59,130,246,0.15); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.55; }
.nav-item:hover svg { opacity: 0.8; }
.nav-item.active svg { opacity: 1; }

.page-content { overflow-y: auto; }

@media (max-width: 1024px) {
  .page-layout { grid-template-columns: 0px 1fr; }
  .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
}

/* ── Session Main Layout ─────────────────────────────────── */
.main-layout { display: grid; grid-template-columns: 340px 1fr; height: 100%; min-height: 0; overflow: hidden; }

.session-list-panel {
  background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.session-detail-panel { overflow-y: auto; padding: 0; display: flex; flex-direction: column; }

/* ── List Header ─────────────────────────────────────────── */
.list-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center;
}
.list-header input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 12px; color: var(--text); font-size: 13px;
  font-family: var(--font); transition: var(--transition);
}
.list-header input::placeholder { color: var(--text-muted); }
.list-header input:focus { outline: none; border-color: var(--accent); }

.btn {
  padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
  cursor: pointer; border: none; transition: var(--transition); font-family: var(--font);
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { opacity: 0.85; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }

/* ── Session List ────────────────────────────────────────── */
.session-list { flex: 1; overflow-y: auto; }

.session-item {
  padding: 14px 20px; border-bottom: 1px solid var(--border); cursor: pointer;
  transition: var(--transition); animation: fadeIn 0.2s ease both;
}
.session-item:hover { background: var(--bg-hover); }
.session-item.selected { background: var(--bg-hover); border-left: 3px solid var(--accent); }

.session-id { font-size: 13px; font-family: var(--mono); color: var(--accent); margin-bottom: 4px; }
.session-row { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 10px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
}
.badge-active { background: rgba(34,197,94,0.15); color: var(--green); }
.badge-idle { background: rgba(245,158,11,0.15); color: var(--orange); }
.badge-expired { background: rgba(100,116,139,0.15); color: var(--text-muted); }
.badge-cli { background: rgba(59,130,246,0.15); color: var(--accent); }
.badge-web { background: rgba(168,85,247,0.15); color: var(--purple); }
.badge-api { background: rgba(6,182,212,0.15); color: var(--cyan); }

/* ── Metrics Bar ─────────────────────────────────────────── */
.metrics-bar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  padding: 20px; border-bottom: 1px solid var(--border); background: var(--bg-base);
}
.metric-card {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; text-align: center;
}
.metric-icon { margin-bottom: 4px; display: flex; justify-content: center; }
.metric-icon svg { width: 18px; height: 18px; color: var(--text-muted); }
.metric-number { font-size: 24px; font-weight: 700; }
.metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

/* ── Agent Usage Chart ───────────────────────────────────── */
.usage-section { padding: 14px 20px; border-bottom: 1px solid var(--border); }
.usage-section-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
}
.usage-section-title svg { width: 14px; height: 14px; }

.usage-chart { display: flex; gap: 6px; align-items: flex-end; height: 100px; }
.usage-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; }
.usage-bar {
  width: 100%; border-radius: 4px 4px 0 0; min-height: 4px;
  transition: height 0.5s ease;
}
.usage-bar-label { font-size: 10px; color: var(--text-muted); margin-top: 4px; writing-mode: vertical-lr; text-orientation: mixed; }

/* ── Detail Panel ────────────────────────────────────────── */
.detail-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 14px; gap: 12px;
}
.detail-empty svg { width: 48px; height: 48px; opacity: 0.3; }
.detail-header {
  padding: 20px; border-bottom: 1px solid var(--border); background: var(--bg-base);
}
.detail-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.detail-title svg { width: 18px; height: 18px; color: var(--accent); }
.detail-meta { display: flex; gap: 16px; font-size: 13px; color: var(--text-dim); flex-wrap: wrap; }
.detail-meta-item { display: flex; align-items: center; gap: 4px; }
.detail-meta-item svg { width: 13px; height: 13px; opacity: 0.6; }

/* ── Chat View ───────────────────────────────────────────── */
.chat-container {
  flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
}
.chat-msg {
  display: flex; gap: 12px; max-width: 80%; animation: fadeIn 0.2s ease;
}
.chat-msg.user { align-self: flex-end; flex-direction: row-reverse; }
.chat-msg.agent { align-self: flex-start; }
.chat-avatar {
  width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0;
}
.chat-avatar.user-avatar { background: var(--accent); }
.chat-avatar.user-avatar svg { width: 16px; height: 16px; color: #fff; }
.chat-avatar.agent-avatar { background: var(--purple); }
.chat-avatar.agent-avatar svg { width: 16px; height: 16px; color: #fff; }
.chat-bubble {
  padding: 10px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5;
}
.chat-msg.user .chat-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.chat-msg.agent .chat-bubble { background: var(--bg-surface); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.chat-timestamp { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
.chat-agent-label { font-size: 11px; color: var(--purple); font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
.chat-agent-label svg { width: 12px; height: 12px; }

/* ── Timeline ────────────────────────────────────────────── */
.timeline { padding: 20px; border-top: 1px solid var(--border); }
.timeline-title {
  font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
}
.timeline-title svg { width: 14px; height: 14px; }
.timeline-event {
  display: flex; gap: 12px; padding: 8px 0; font-size: 13px; color: var(--text-dim);
  border-left: 2px solid var(--border); padding-left: 16px; margin-left: 6px; position: relative;
}
.timeline-event::before {
  content: ''; position: absolute; left: -5px; top: 12px;
  width: 8px; height: 8px; background: var(--accent); border-radius: 50%;
}
.timeline-event-time { color: var(--text-muted); font-size: 11px; min-width: 70px; }

/* ── Actions Bar ─────────────────────────────────────────── */
.actions-bar {
  padding: 14px 20px; border-top: 1px solid var(--border); background: var(--bg-base);
  display: flex; gap: 8px; justify-content: flex-end;
}
.actions-bar .btn { display: inline-flex; align-items: center; gap: 6px; }
.actions-bar .btn svg { width: 14px; height: 14px; }

/* ── Toast ────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
  background: var(--green); color: #fff; border-radius: var(--radius);
  font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(10px);
  transition: all 0.3s ease; z-index: 200; pointer-events: none;
  display: flex; align-items: center; gap: 8px;
}
.toast svg { width: 16px; height: 16px; }
.toast.show { opacity: 1; transform: translateY(0); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 900px) {
  .main-layout { grid-template-columns: 1fr; }
  .session-detail-panel { display: none; }
  .metrics-bar { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 768px) {
  .page-sidebar {
    position: fixed; left: 0; top: 50px; bottom: 0; z-index: 100; width: 248px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
}
</style>

        <div class="metrics-bar">
          <div class="metric-card">
            <div class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
            <div class="metric-number" id="totalSessions">0</div>
            <div class="metric-label">总计</div>
          </div>
          <div class="metric-card">
            <div class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>
            <div class="metric-number" style="color:var(--green)" id="activeSessions">0</div>
            <div class="metric-label">活跃</div>
          </div>
          <div class="metric-card">
            <div class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
            <div class="metric-number" id="avgDuration">0m</div>
            <div class="metric-label">平均时长</div>
          </div>
          <div class="metric-card">
            <div class="metric-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg></div>
            <div class="metric-number" id="totalMessages">0</div>
            <div class="metric-label">消息数</div>
          </div>
        </div>

        <!-- Agent Usage -->
        <div class="usage-section">
          <div class="usage-section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/></svg>
            智能体使用
          </div>
          <div class="usage-chart" id="usageChart"></div>
        </div>

        <!-- Session List -->
        <div class="session-list" id="sessionList">
          <div class="detail-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            加载会话中...
          </div>
        </div>
      </div>

      <!-- Detail Panel -->
      <div class="session-detail-panel" id="detailPanel">
        <div class="detail-empty" id="detailEmpty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          选择一个会话查看详情
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ── Sidebar Toggle ──────────────────────────────────────────────────── */
document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('pageLayout').classList.toggle('sidebar-collapsed');
});

/* ── SVG Icon Helpers ────────────────────────────────────────────────── */
const SVG = {
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  agent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  xCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
  timeline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  agents: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  message: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  duration: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
};

/* ── State ───────────────────────────────────────────────────────────── */
const API_BASE = window.location.origin;
let allSessions = [];
let selectedSession = null;

/* ── Demo Data ───────────────────────────────────────────────────────── */
function generateDemoSessions() {
  const agents = ['orchestrator', 'coder', 'reviewer', 'researcher', 'ops', 'planner'];
  const channels = ['cli', 'web', 'api'];
  const states = ['active', 'idle', 'expired'];
  const userNames = ['alice', 'bob', 'charlie', 'diana', 'eve'];
  const msgSamples = [
    { role: 'user', content: 'Can you review the latest PR for the auth module?' },
    { role: 'agent', agent: 'orchestrator', content: 'I will route this to the reviewer agent for a thorough code review.' },
    { role: 'agent', agent: 'reviewer', content: 'Reviewing PR #42. Found 3 issues: 1) Missing input validation on email field, 2) SQL injection risk in query builder, 3) Unused import on line 87.' },
    { role: 'user', content: 'Fix the SQL injection issue first.' },
    { role: 'agent', agent: 'coder', content: 'I have parameterized the query in `query_builder.py` line 34. The fix uses prepared statements with bound parameters.' },
    { role: 'agent', agent: 'reviewer', content: 'Fix verified. The parameterized query correctly prevents SQL injection. Approving the change.' },
    { role: 'user', content: 'Great, now deploy to staging.' },
    { role: 'agent', agent: 'ops', content: 'Deploying to staging environment. Build #156 triggered. ETA: 3 minutes.' },
  ];

  return Array.from({ length: 12 }, (_, i) => {
    const sessionAgents = agents.slice(0, 2 + Math.floor(Math.random() * 4));
    const msgCount = 4 + Math.floor(Math.random() * 8);
    const created = new Date(Date.now() - Math.random() * 7 * 86400000);
    const duration = Math.floor(5 + Math.random() * 120);
    const state = states[i < 4 ? 0 : i < 8 ? 1 : 2];

    const messages = Array.from({ length: msgCount }, (_, j) => {
      const sample = msgSamples[j % msgSamples.length];
      return { ...sample, timestamp: new Date(created.getTime() + j * 60000).toISOString() };
    });

    const events = [
      { time: created.toISOString(), type: 'created', event: '会话已创建' },
      { time: new Date(created.getTime() + 1000).toISOString(), type: 'routed', event: '路由到 ' + sessionAgents[0] },
      ...sessionAgents.slice(1).map((a, j) => ({
        time: new Date(created.getTime() + (j+2) * 30000).toISOString(),
        type: 'delegated',
        event: '委派到 ' + a,
      })),
      { time: new Date(created.getTime() + duration * 60000).toISOString(), type: 'end', event: state === 'active' ? '等待输入' : '会话结束' },
    ];

    return {
      id: 'sess_' + String(i+1).padStart(3,'0') + '_' + Math.random().toString(36).slice(2,8),
      user: userNames[i % userNames.length],
      channel: channels[i % channels.length],
      state,
      message_count: msgCount,
      agents: sessionAgents,
      duration_min: duration,
      last_activity: new Date(created.getTime() + duration * 60000).toISOString(),
      created_at: created.toISOString(),
      messages,
      events,
    };
  });
}

/* ── Fetch ───────────────────────────────────────────────────────────── */
async function fetchSessions() {
  try {
    const res = await fetch(API_BASE + '/sessions');
    if (!res.ok) throw new Error();
    let data = await res.json();
    allSessions = Array.isArray(data) ? data : (data.data || []);
  } catch {
    allSessions = generateDemoSessions();
  }
  renderSessionList(allSessions);
  updateMetrics();
}

/* ── Render List ─────────────────────────────────────────────────────── */
function renderSessionList(sessions) {
  const list = document.getElementById('sessionList');
  if (!sessions.length) {
    list.innerHTML = '<div class="detail-empty"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>暂无会话记录</div>';
    return;
  }
  list.innerHTML = sessions.map((s, i) =>
    '<div class="session-item ' + (selectedSession && selectedSession.id === s.id ? 'selected' : '') + '"'
    + ' onclick="selectSession(\'' + s.id + '\')" style="animation-delay:' + (i*0.04) + 's">'
    + '<div class="session-id">' + s.id + '</div>'
    + '<div class="session-row">'
    + '  <span class="badge badge-' + s.state + '">' + stateLabel(s.state) + '</span>'
    + '  <span class="badge badge-' + s.channel + '">' + s.channel + '</span>'
    + '  <span style="display:inline-flex;align-items:center;gap:3px">' + SVG.user + ' ' + s.user + '</span>'
    + '</div>'
    + '<div class="session-row" style="margin-top:4px">'
    + '  <span>' + s.message_count + ' 条消息</span>'
    + '  <span>' + (s.agents ? s.agents.length : 0) + ' 个智能体</span>'
    + '  <span>' + s.duration_min + 'm</span>'
    + '  <span>' + timeAgo(s.last_activity) + '</span>'
    + '</div>'
    + '</div>'
  ).join('');
}

function stateLabel(state) {
  const map = { active: '活跃', idle: '空闲', expired: '过期' };
  return map[state] || state;
}

/* ── Select Session ──────────────────────────────────────────────────── */
window.selectSession = function(id) {
  selectedSession = allSessions.find(s => s.id === id);
  if (!selectedSession) return;

  renderSessionList(allSessions);

  const panel = document.getElementById('detailPanel');
  const s = selectedSession;

  const messages = (s.messages || []).map(m => {
    const isUser = m.role === 'user';
    return '<div class="chat-msg ' + (isUser ? 'user' : 'agent') + '">'
      + '<div class="chat-avatar ' + (isUser ? 'user-avatar' : 'agent-avatar') + '">'
      + (isUser ? SVG.user : SVG.agent)
      + '</div>'
      + '<div>'
      + (!isUser ? '<div class="chat-agent-label">' + SVG.agents + ' ' + (m.agent || 'agent') + '</div>' : '')
      + '<div class="chat-bubble">' + escapeHtml(m.content) + '</div>'
      + '<div class="chat-timestamp">' + new Date(m.timestamp).toLocaleTimeString() + '</div>'
      + '</div>'
      + '</div>';
  }).join('');

  const events = (s.events || []).map(e =>
    '<div class="timeline-event">'
    + '<span class="timeline-event-time">' + new Date(e.time).toLocaleTimeString() + '</span>'
    + '<span>' + escapeHtml(e.event) + '</span>'
    + '</div>'
  ).join('');

  panel.innerHTML =
    '<div class="detail-header">'
    + '<div class="detail-title">' + SVG.message + ' 会话 ' + s.id + '</div>'
    + '<div class="detail-meta">'
    + '  <span class="badge badge-' + s.state + '">' + stateLabel(s.state) + '</span>'
    + '  <span class="badge badge-' + s.channel + '">' + s.channel + '</span>'
    + '  <span class="detail-meta-item">' + SVG.user + ' 用户: ' + s.user + '</span>'
    + '  <span class="detail-meta-item">' + SVG.duration + ' 持续时间: ' + s.duration_min + 'm</span>'
    + '  <span class="detail-meta-item">' + SVG.agents + ' 智能体: ' + (s.agents || []).join(', ') + '</span>'
    + '</div>'
    + '</div>'
    + '<div class="chat-container">' + (messages || '<div class="detail-empty">暂无消息</div>') + '</div>'
    + '<div class="timeline">'
    + '  <div class="timeline-title">' + SVG.timeline + ' 事件时间线</div>'
    + events
    + '</div>'
    + '<div class="actions-bar">'
    + '  <button class="btn btn-ghost" onclick="exportSession(\'' + s.id + '\')">' + SVG.download + ' 导出 JSON</button>'
    + '  <button class="btn btn-danger" onclick="expireSession(\'' + s.id + '\')">' + SVG.xCircle + ' 过期</button>'
    + '</div>';
};

/* ── Metrics ─────────────────────────────────────────────────────────── */
function updateMetrics() {
  document.getElementById('totalSessions').textContent = allSessions.length;
  const active = allSessions.filter(s => s.state === 'active').length;
  document.getElementById('activeSessions').textContent = active;
  const totalMsgs = allSessions.reduce((a, s) => a + (s.message_count || 0), 0);
  document.getElementById('totalMessages').textContent = totalMsgs;
  const avgDur = allSessions.length ? Math.round(allSessions.reduce((a, s) => a + (s.duration_min || 0), 0) / allSessions.length) : 0;
  document.getElementById('avgDuration').textContent = avgDur + 'm';

  // Agent usage chart
  const agentCounts = {};
  allSessions.forEach(s => (s.agents || []).forEach(a => { agentCounts[a] = (agentCounts[a] || 0) + 1; }));
  const maxAgent = Math.max(...Object.values(agentCounts), 1);
  const colors = ['var(--accent)', 'var(--green)', 'var(--purple)', 'var(--orange)', 'var(--cyan)', 'var(--pink)'];
  const chart = document.getElementById('usageChart');
  chart.innerHTML = Object.entries(agentCounts).map(([name, count], i) =>
    '<div class="usage-bar-wrap">'
    + '<div class="usage-bar" style="height:' + ((count/maxAgent)*80) + 'px;background:' + colors[i % colors.length] + '"></div>'
    + '<div class="usage-bar-label">' + name.slice(0,8) + '</div>'
    + '</div>'
  ).join('');

  try {
    fetch(API_BASE + '/sessions/metrics').then(r => r.json()).catch(() => {});
  } catch {}
}

/* ── Filter ──────────────────────────────────────────────────────────── */
window.filterSessions = function() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allSessions.filter(s =>
    s.id.includes(q) || s.user.includes(q) || s.channel.includes(q) || s.state.includes(q)
  );
  renderSessionList(filtered);
};

/* ── Actions ─────────────────────────────────────────────────────────── */
window.expireOld = function() {
  const expired = allSessions.filter(s => s.state === 'idle');
  expired.forEach(s => { s.state = 'expired'; });
  renderSessionList(allSessions);
  updateMetrics();
  showToast('已过期 ' + expired.length + ' 个空闲会话');
};

window.expireSession = function(id) {
  const s = allSessions.find(s => s.id === id);
  if (s) {
    s.state = 'expired';
    selectSession(id);
    updateMetrics();
    showToast('会话已过期');
  }
};

window.exportSession = function(id) {
  const s = allSessions.find(s => s.id === id);
  if (!s) return;
  const blob = new Blob([JSON.stringify(s, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'session_' + id + '.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('会话已导出');
};

/* ── Helpers ──────────────────────────────────────────────────────────── */
function timeAgo(isoStr) {
  const diff = Date.now() - new Date(isoStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return mins + ' 分钟前';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + ' 小时前';
  return Math.floor(hrs / 24) + ' 天前';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.innerHTML = (isError ? SVG.xCircle : SVG.check) + ' ' + escapeHtml(msg);
  t.style.background = isError ? 'var(--red)' : 'var(--green)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ── Init ─────────────────────────────────────────────────────────────── */
fetchSessions();

})();
</script>
</body>
</html>
