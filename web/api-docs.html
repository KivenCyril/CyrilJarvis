<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - 接口文档</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-hover:     #1c2d42;
  --bg-input:     #0c1322;
  --border:       #1e2d40;
  --border-light: #2d4054;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #5a6d82;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --purple:       #a855f7;
  --yellow:       #eab308;
  --red:          #ef4444;
  --orange:       #f59e0b;
  --cyan:         #06b6d4;
  --radius:       8px;
  --radius-lg:    12px;
  --transition:   200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; overflow: hidden; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }

/* ── Top Bar ─────────────────────────────────────────────── */
.topbar {
  height: 50px; background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 50; position: relative;
}
.topbar::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2) 50%, transparent); }
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(99,102,241,0.35); }
.topbar-logo svg { width: 16px; height: 16px; color: #fff; }
.topbar-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #93c5fd, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.topbar-page { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-left: 8px; }
.topbar-spacer { flex: 1; }
.topbar-btn { width: 34px; height: 34px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: var(--transition); }
.topbar-btn:hover { background: var(--bg-hover); color: var(--text-dim); }
.topbar-btn svg { width: 17px; height: 17px; }

/* ── Layout ──────────────────────────────────────────────── */
.page-layout { flex: 1; display: grid; grid-template-columns: 248px 1fr; overflow: hidden; transition: grid-template-columns 300ms cubic-bezier(0.16,1,0.3,1); }
.page-layout.sidebar-collapsed { grid-template-columns: 0px 1fr; }

/* ── Sidebar ─────────────────────────────────────────────── */
.page-sidebar {
  background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  width: 248px; min-width: 248px; max-width: 248px;
  transition: all 300ms cubic-bezier(0.16,1,0.3,1);
}
.sidebar-collapsed .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.page-sidebar-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 16px; }
.nav-group { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(30,45,64,0.6); }
.nav-group:last-child { border-bottom: none; }
.nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-muted); font-weight: 600; padding: 10px 10px 5px; user-select: none; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim); text-decoration: none; transition: var(--transition); position: relative; border: 1px solid transparent; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; border-color: var(--border); }
.nav-item.active { background: rgba(59,130,246,0.08); color: var(--accent-hover); font-weight: 500; border-color: rgba(59,130,246,0.15); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.55; }
.nav-item:hover svg { opacity: 0.8; }
.nav-item.active svg { opacity: 1; }

.page-content { overflow-y: auto; }

@media (max-width: 1024px) {
  .page-layout { grid-template-columns: 0px 1fr; }
  .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
}

/* ── API Docs Layout ─────────────────────────────────────── */
.api-layout { display: grid; grid-template-columns: 260px 1fr; height: 100%; overflow: hidden; }
.api-sidebar {
  background: var(--bg-base); border-right: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
}
.api-content { overflow-y: auto; padding: 24px; }

/* ── API Sidebar ─────────────────────────────────────────── */
.api-sidebar-search {
  padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.api-sidebar-search input {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 12px; color: var(--text); font-size: 12px;
  font-family: var(--font); outline: none; transition: var(--transition);
}
.api-sidebar-search input:focus { border-color: var(--accent); }

.api-sidebar-group { padding: 10px 0; }
.api-sidebar-group-title {
  padding: 6px 14px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-muted); font-weight: 700;
}
.api-sidebar-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px;
  cursor: pointer; transition: var(--transition); font-size: 12px; color: var(--text-dim);
}
.api-sidebar-item:hover { background: var(--bg-hover); color: var(--text); }
.api-sidebar-item.active { background: rgba(59,130,246,0.1); color: var(--accent); border-right: 2px solid var(--accent); }

/* ── Method Badges ───────────────────────────────────────── */
.method-badge {
  display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px;
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  flex-shrink: 0; min-width: 38px; justify-content: center;
}
.method-GET { background: rgba(34,197,94,0.15); color: var(--green); }
.method-POST { background: rgba(245,158,11,0.15); color: var(--orange); }
.method-DELETE { background: rgba(239,68,68,0.15); color: var(--red); }
.method-PATCH { background: rgba(168,85,247,0.15); color: var(--purple); }
.method-PUT { background: rgba(59,130,246,0.15); color: var(--accent); }
.method-WS { background: rgba(6,182,212,0.15); color: var(--cyan); }

/* ── Endpoint Card ───────────────────────────────────────── */
.endpoint-card {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 24px; margin-bottom: 20px; scroll-margin-top: 20px;
  animation: fadeInUp 0.3s ease both;
}
.endpoint-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.endpoint-method { font-size: 12px; }
.endpoint-path { font-family: var(--mono); font-size: 15px; font-weight: 600; }
.endpoint-desc { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 16px; }

/* ── Parameters Table ────────────────────────────────────── */
.params-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.params-table th {
  text-align: left; padding: 8px 12px; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--text-muted); border-bottom: 1px solid var(--border);
  font-weight: 600;
}
.params-table td {
  padding: 8px 12px; font-size: 12px; border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.params-table tr:last-child td { border-bottom: none; }
.param-name { font-family: var(--mono); color: var(--accent); font-weight: 500; }
.param-type-tag { font-size: 11px; color: var(--purple); padding: 1px 6px; background: rgba(168,85,247,0.1); border-radius: 3px; }
.param-required { font-size: 10px; color: var(--red); font-weight: 600; }
.param-optional { font-size: 10px; color: var(--text-muted); }

/* ── Schema Section ──────────────────────────────────────── */
.schema-section { margin-bottom: 16px; }
.schema-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted);
  font-weight: 600; margin-bottom: 8px;
}
.schema-json {
  background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  white-space: pre-wrap; word-break: break-word; max-height: 250px; overflow-y: auto;
  line-height: 1.6;
}

/* ── Try It Section ──────────────────────────────────────── */
.try-section {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-top: 16px;
}
.try-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.try-title { font-size: 13px; font-weight: 600; }
.try-form { display: flex; flex-direction: column; gap: 10px; }
.try-field { display: flex; flex-direction: column; gap: 4px; }
.try-field-label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.try-field-input {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 12px; color: var(--text); font-size: 12px; font-family: var(--mono);
  outline: none; transition: var(--transition);
}
.try-field-input:focus { border-color: var(--accent); }
textarea.try-field-input { resize: vertical; min-height: 60px; font-family: var(--mono); }
.try-actions { display: flex; gap: 8px; margin-top: 8px; }
.try-response {
  margin-top: 12px; background: var(--bg-deep); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; font-family: var(--mono); font-size: 11px;
  color: var(--text-dim); white-space: pre-wrap; word-break: break-word; max-height: 200px;
  overflow-y: auto; display: none;
}
.try-response.show { display: block; }
.try-status { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
.try-status.ok { color: var(--green); }
.try-status.error { color: var(--red); }

/* ── Buttons ─────────────────────────────────────────────── */
.btn {
  padding: 8px 16px; border-radius: var(--radius); font-size: 12px; font-weight: 600;
  cursor: pointer; border: none; transition: var(--transition); display: inline-flex;
  align-items: center; gap: 6px; font-family: var(--font);
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Category Header ─────────────────────────────────────── */
.category-header {
  font-size: 18px; font-weight: 700; margin-bottom: 16px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* ── No Results ──────────────────────────────────────────── */
.no-results {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 60px 20px; color: var(--text-muted); text-align: center;
}
.no-results svg { width: 36px; height: 36px; opacity: 0.3; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 960px) {
  .api-layout { grid-template-columns: 1fr; }
  .api-sidebar { display: none; }
}
</style>
</head>

'use strict';

document.getElementById('sidebarToggle').addEventListener('click', () => {

});

const ENDPOINTS = [
  { category: 'System', method: 'GET', path: '/health', description: '健康检查接口。返回系统状态、版本和运行时间。', params: [], body: null, response: '{\n  "status": "healthy",\n  "version": "2.0.0",\n  "uptime_seconds": 86400,\n  "agents_online": 5\n}' },

function esc(s) { const d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }
function slugify(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

function groupEndpoints(endpoints) {
  const groups = {};
  endpoints.forEach(ep => {
    if (!groups[ep.category]) groups[ep.category] = [];
    groups[ep.category].push(ep);
  });
  return groups;
}

function renderSidebar(endpoints) {
  const groups = groupEndpoints(endpoints);
  const el = document.getElementById('apiSidebarContent');

  el.innerHTML = Object.entries(groups).map(([cat, eps]) =>
    '<div class="api-sidebar-group">' +
      '<div class="api-sidebar-group-title">' + esc(cat) + '</div>' +
      eps.map(ep =>
        '<div class="api-sidebar-item" data-endpoint="' + slugify(ep.method + '-' + ep.path) + '" onclick="scrollToEndpoint(\'' + slugify(ep.method + '-' + ep.path) + '\')">' +
          '<span class="method-badge method-' + ep.method + '">' + ep.method + '</span>' +
          '<span style="font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(ep.path) + '</span>' +
        '</div>'
      ).join('') +
    '</div>'
  ).join('');
}

function renderEndpoints(endpoints) {
  const groups = groupEndpoints(endpoints);
  const area = document.getElementById('apiContentArea');

  if (!endpoints.length) {
    area.innerHTML =
      '<div class="no-results">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
        '<span>未找到匹配的接口</span>' +
      '</div>';
    return;
  }

  let html = '';
  for (const [cat, eps] of Object.entries(groups)) {
    html += '<div class="category-header" id="cat-' + slugify(cat) + '">' + esc(cat) + '</div>';
    eps.forEach((ep, idx) => {
      const epId = slugify(ep.method + '-' + ep.path);
      const hasParams = ep.params && ep.params.length > 0;
      const hasBody = ep.body != null;
      const tryId = 'try-' + epId;
      const respId = 'resp-' + epId;

      html += '<div class="endpoint-card" id="' + epId + '" style="animation-delay:' + (idx * 0.04) + 's;">';
      html += '<div class="endpoint-header">';
      html += '<span class="method-badge method-' + ep.method + ' endpoint-method">' + ep.method + '</span>';
      html += '<span class="endpoint-path">' + esc(ep.path) + '</span>';
      html += '</div>';
      html += '<div class="endpoint-desc">' + esc(ep.description) + '</div>';

      if (hasParams) {
        html += '<div class="schema-section">';
        html += '<div class="schema-label">参数</div>';
        html += '<table class="params-table"><thead><tr><th>名称</th><th>类型</th><th>必填</th><th>描述</th></tr></thead><tbody>';
        ep.params.forEach(p => {
          html += '<tr>';
          html += '<td><span class="param-name">' + esc(p.name) + '</span></td>';
          html += '<td><span class="param-type-tag">' + esc(p.type) + '</span></td>';
          html += '<td>' + (p.required ? '<span class="param-required">必填</span>' : '<span class="param-optional">可选</span>') + '</td>';
          html += '<td style="color:var(--text-dim);">' + esc(p.desc) + '</td>';
          html += '</tr>';
        });
        html += '</tbody></table></div>';
      }

      if (hasBody) {
        html += '<div class="schema-section">';
        html += '<div class="schema-label">请求体</div>';
        html += '<div class="schema-json">' + esc(ep.body) + '</div>';
        html += '</div>';
      }

      html += '<div class="schema-section">';
      html += '<div class="schema-label">响应</div>';
      html += '<div class="schema-json">' + esc(ep.response) + '</div>';
      html += '</div>';

      if (ep.method !== 'WS') {
        html += '<div class="try-section" id="' + tryId + '">';
        html += '<div class="try-header"><span class="try-title">试一试</span></div>';
        html += '<div class="try-form">';

        if (hasParams) {
          ep.params.forEach(p => {
            html += '<div class="try-field">';
            html += '<label class="try-field-label">' + esc(p.name) + (p.required ? ' (必填)' : '') + '</label>';
            html += '<input class="try-field-input" data-param="' + esc(p.name) + '" placeholder="' + esc(p.desc) + '" />';
            html += '</div>';
          });
        }

        if (hasBody) {
          html += '<div class="try-field">';
          html += '<label class="try-field-label">请求体</label>';
          html += '<textarea class="try-field-input" data-body="true" rows="4">' + esc(ep.body) + '</textarea>';
          html += '</div>';
        }

        html += '<div class="try-actions">';
        html += '<button class="btn btn-primary btn-sm" onclick="executeEndpoint(\'' + epId + '\', \'' + ep.method + '\', \'' + esc(ep.path) + '\')">执行</button>';
        html += '<button class="btn btn-ghost btn-sm" onclick="clearResponse(\'' + respId + '\')">清除</button>';
        html += '</div>';
        html += '</div>';
        html += '<div class="try-response" id="' + respId + '"></div>';
        html += '</div>';
      }

      html += '</div>';
    });
  }

  area.innerHTML = html;
}

window.scrollToEndpoint = function(epId) {
  const el = document.getElementById(epId);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.querySelectorAll('.api-sidebar-item').forEach(s => s.classList.remove('active'));
    const sItem = document.querySelector('.api-sidebar-item[data-endpoint="' + epId + '"]');
    if (sItem) sItem.classList.add('active');
  }
};

window.executeEndpoint = async function(epId, method, path) {
  const trySection = document.getElementById('try-' + epId);
  const respEl = document.getElementById('resp-' + epId);
  if (!trySection || !respEl) return;

  let url = path;
  trySection.querySelectorAll('input[data-param]').forEach(input => {
    const val = input.value.trim();
    if (val) {
      url = url.replace('{' + input.dataset.param + '}', encodeURIComponent(val));
    }
  });

  let body = null;
  const bodyEl = trySection.querySelector('textarea[data-body]');
  if (bodyEl) {
    try { body = bodyEl.value.trim(); } catch {}
  }

  respEl.classList.add('show');
  respEl.innerHTML = '<div style="color:var(--text-muted);">发送请求中...</div>';

  try {
    const opts = {
      method: method,
      headers: { 'Content-Type': 'application/json' },
    };
    if (body && method !== 'GET' && method !== 'DELETE') {
      opts.body = body;
    }

    const res = await fetch(location.origin + url, opts);
    const text = await res.text();
    let formatted = text;
    try { formatted = JSON.stringify(JSON.parse(text), null, 2); } catch {}

    respEl.innerHTML =
      '<div class="try-status ' + (res.ok ? 'ok' : 'error') + '">' + res.status + ' ' + res.statusText + '</div>' +
      '<div>' + esc(formatted) + '</div>';
  } catch (err) {
    respEl.innerHTML =
      '<div class="try-status error">错误</div>' +
      '<div>' + esc(err.message) + '</div>';
  }
};

window.clearResponse = function(respId) {
  const el = document.getElementById(respId);
  if (el) { el.classList.remove('show'); el.innerHTML = ''; }
};

document.getElementById('endpointSearch').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  const filtered = q
    ? ENDPOINTS.filter(ep =>
        ep.path.toLowerCase().includes(q) ||
        ep.method.toLowerCase().includes(q) ||
        ep.category.toLowerCase().includes(q) ||
        ep.description.toLowerCase().includes(q)
      )
    : ENDPOINTS;
  renderSidebar(filtered);
  renderEndpoints(filtered);
});

renderSidebar(ENDPOINTS);
renderEndpoints(ENDPOINTS);
})();
</script>
</body>
</html>
