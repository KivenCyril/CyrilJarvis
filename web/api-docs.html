<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - API Documentation</title>
<style>
/* ====================================================================
   JARVIS API Documentation — Standalone Page CSS
   ==================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-card:      #1e293b;
  --bg-hover:     #273549;
  --bg-input:     #0f172a;
  --border:       #334155;
  --border-light: #3f506a;
  --border-focus: #6366f1;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #64748b;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --orange:       #f59e0b;
  --red:          #ef4444;
  --purple:       #a855f7;
  --cyan:         #06b6d4;
  --pink:         #ec4899;
  --radius:       8px;
  --radius-lg:    12px;
  --shadow:       0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md:    0 4px 12px rgba(0,0,0,0.3);
  --transition:   180ms ease;
  --font:         'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; }
body { display: flex; flex-direction: column; overflow: hidden; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* -- Top Nav ----------------------------------------------------------- */
.topnav {
  height: 52px; background: var(--bg-base); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0;
}
.topnav-brand { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
.topnav-brand span { color: var(--text-dim); font-weight: 400; margin-left: 6px; font-size: 14px; }
.topnav-links { display: flex; gap: 4px; margin-left: 24px; flex-wrap: wrap; }
.topnav-links a {
  padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
  color: var(--text-dim); text-decoration: none; transition: var(--transition);
}
.topnav-links a:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; }
.topnav-links a.active { background: var(--accent); color: #fff; }

/* -- Layout ------------------------------------------------------------ */
.main-layout { flex: 1; display: grid; grid-template-columns: 260px 1fr; overflow: hidden; }
.sidebar {
  background: var(--bg-base); border-right: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
}
.content-area { overflow-y: auto; padding: 24px; }

/* -- Sidebar ----------------------------------------------------------- */
.sidebar-search {
  padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.sidebar-search input {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 12px; color: var(--text); font-size: 12px;
}
.sidebar-search input:focus { border-color: var(--border-focus); outline: none; }

.sidebar-group { padding: 10px 0; }
.sidebar-group-title {
  padding: 6px 14px; font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text-muted); font-weight: 700;
}
.sidebar-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px;
  cursor: pointer; transition: var(--transition); font-size: 12px; color: var(--text-dim);
}
.sidebar-item:hover { background: var(--bg-hover); color: var(--text); }
.sidebar-item.active { background: rgba(59,130,246,0.1); color: var(--accent); border-right: 2px solid var(--accent); }

/* -- Method Badges ----------------------------------------------------- */
.method-badge {
  display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px;
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
  flex-shrink: 0; min-width: 38px; justify-content: center;
}
.method-GET { background: rgba(34,197,94,0.15); color: var(--green); }
.method-POST { background: rgba(245,158,11,0.15); color: var(--orange); }
.method-DELETE { background: rgba(239,68,68,0.15); color: var(--red); }
.method-PATCH { background: rgba(168,85,247,0.15); color: var(--purple); }
.method-PUT { background: rgba(59,130,246,0.15); color: var(--accent); }
.method-WS { background: rgba(6,182,212,0.15); color: var(--cyan); }

/* -- Endpoint Card ----------------------------------------------------- */
.endpoint-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 24px; margin-bottom: 20px; scroll-margin-top: 20px;
  animation: fadeInUp 0.3s ease both;
}
.endpoint-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.endpoint-method { font-size: 12px; }
.endpoint-path { font-family: var(--mono); font-size: 15px; font-weight: 600; }
.endpoint-desc { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 16px; }

/* Parameters table */
.params-table {
  width: 100%; border-collapse: collapse; margin-bottom: 16px;
}
.params-table th {
  text-align: left; padding: 8px 12px; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--text-muted); border-bottom: 1px solid var(--border);
  font-weight: 600;
}
.params-table td {
  padding: 8px 12px; font-size: 12px; border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.params-table tr:last-child td { border-bottom: none; }
.param-name { font-family: var(--mono); color: var(--accent); font-weight: 500; }
.param-type { font-size: 11px; color: var(--purple); padding: 1px 6px; background: rgba(168,85,247,0.1); border-radius: 3px; }
.param-required { font-size: 10px; color: var(--red); font-weight: 600; }
.param-optional { font-size: 10px; color: var(--text-muted); }

/* Request body / Response */
.schema-section { margin-bottom: 16px; }
.schema-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted);
  font-weight: 600; margin-bottom: 8px;
}
.schema-json {
  background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  white-space: pre-wrap; word-break: break-word; max-height: 250px; overflow-y: auto;
  line-height: 1.6;
}

/* Try it */
.try-section {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-top: 16px;
}
.try-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.try-title { font-size: 13px; font-weight: 600; }
.try-form { display: flex; flex-direction: column; gap: 10px; }
.try-field { display: flex; flex-direction: column; gap: 4px; }
.try-field-label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.try-field-input {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 12px; color: var(--text); font-size: 12px; font-family: var(--mono);
}
.try-field-input:focus { border-color: var(--border-focus); outline: none; }
textarea.try-field-input { resize: vertical; min-height: 60px; font-family: var(--mono); }
.try-actions { display: flex; gap: 8px; margin-top: 8px; }
.try-response {
  margin-top: 12px; background: var(--bg-deep); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px; font-family: var(--mono); font-size: 11px;
  color: var(--text-dim); white-space: pre-wrap; word-break: break-word; max-height: 200px;
  overflow-y: auto; display: none;
}
.try-response.show { display: block; }
.try-status { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
.try-status.ok { color: var(--green); }
.try-status.error { color: var(--red); }

.btn {
  padding: 8px 16px; border-radius: var(--radius); font-size: 12px; font-weight: 600;
  cursor: pointer; border: none; transition: var(--transition); display: inline-flex;
  align-items: center; gap: 6px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* -- Section Divider --------------------------------------------------- */
.category-header {
  font-size: 18px; font-weight: 700; margin-bottom: 16px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* -- No results -------------------------------------------------------- */
.no-results {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 60px 20px; color: var(--text-muted); text-align: center;
}
.no-results-icon { font-size: 36px; opacity: 0.3; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

/* ── Helper Functions ─────────────────────────────────────────────── */
function esc(s) { const d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }

function slugify(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

/* ── Group Endpoints ──────────────────────────────────────────────── */
function groupEndpoints(endpoints) {
  const groups = {};
  endpoints.forEach(ep => {
    if (!groups[ep.category]) groups[ep.category] = [];
    groups[ep.category].push(ep);
  });
  return groups;
}

/* ── Render Sidebar ───────────────────────────────────────────────── */
function renderSidebar(endpoints) {
  const groups = groupEndpoints(endpoints);
  const el = document.getElementById('sidebarContent');

  el.innerHTML = Object.entries(groups).map(([cat, eps]) => `
    <div class="sidebar-group">
      <div class="sidebar-group-title">${esc(cat)}</div>
      ${eps.map(ep => `
        <div class="sidebar-item" data-endpoint="${slugify(ep.method + '-' + ep.path)}"
             onclick="scrollToEndpoint('${slugify(ep.method + '-' + ep.path)}')">
          <span class="method-badge method-${ep.method}">${ep.method}</span>
          <span style="font-family:var(--mono); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(ep.path)}</span>
        </div>
      `).join('')}
    </div>
  `).join('');
}

/* ── Render Endpoints ─────────────────────────────────────────────── */
function renderEndpoints(endpoints) {
  const groups = groupEndpoints(endpoints);
  const area = document.getElementById('contentArea');

  if (!endpoints.length) {
    area.innerHTML = `
      <div class="no-results">
        <span class="no-results-icon">&#128269;</span>
        <span>No endpoints match your search</span>
      </div>
    `;
    return;
  }

  let html = '';
  for (const [cat, eps] of Object.entries(groups)) {
    html += `<div class="category-header" id="cat-${slugify(cat)}">${esc(cat)}</div>`;
    eps.forEach((ep, idx) => {
      const epId = slugify(ep.method + '-' + ep.path);
      const hasParams = ep.params && ep.params.length > 0;
      const hasBody = ep.body != null;
      const tryId = 'try-' + epId;
      const respId = 'resp-' + epId;

      html += `
        <div class="endpoint-card" id="${epId}" style="animation-delay:${idx * 0.04}s;">
          <div class="endpoint-header">
            <span class="method-badge method-${ep.method} endpoint-method">${ep.method}</span>
            <span class="endpoint-path">${esc(ep.path)}</span>
          </div>
          <div class="endpoint-desc">${esc(ep.description)}</div>

          ${hasParams ? `
          <div class="schema-section">
            <div class="schema-label">Parameters</div>
            <table class="params-table">
              <thead><tr><th>Name</th><th>Type</th><th>Required</th><th>Description</th></tr></thead>
              <tbody>
                ${ep.params.map(p => `
                  <tr>
                    <td><span class="param-name">${esc(p.name)}</span></td>
                    <td><span class="param-type">${esc(p.type)}</span></td>
                    <td>${p.required ? '<span class="param-required">required</span>' : '<span class="param-optional">optional</span>'}</td>
                    <td style="color:var(--text-dim);">${esc(p.desc)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>` : ''}

          ${hasBody ? `
          <div class="schema-section">
            <div class="schema-label">Request Body</div>
            <div class="schema-json">${esc(ep.body)}</div>
          </div>` : ''}

          <div class="schema-section">
            <div class="schema-label">Response</div>
            <div class="schema-json">${esc(ep.response)}</div>
          </div>

          ${ep.method !== 'WS' ? `
          <div class="try-section" id="${tryId}">
            <div class="try-header">
              <span class="try-title">Try it</span>
            </div>
            <div class="try-form">
              ${hasParams ? ep.params.map(p => `
                <div class="try-field">
                  <label class="try-field-label">${esc(p.name)} ${p.required ? '(required)' : ''}</label>
                  <input class="try-field-input" data-param="${esc(p.name)}" placeholder="${esc(p.desc)}" />
                </div>
              `).join('') : ''}
              ${hasBody ? `
                <div class="try-field">
                  <label class="try-field-label">Request Body</label>
                  <textarea class="try-field-input" data-body="true" rows="4">${esc(ep.body)}</textarea>
                </div>
              ` : ''}
              <div class="try-actions">
                <button class="btn btn-primary btn-sm" onclick="executeEndpoint('${epId}', '${ep.method}', '${esc(ep.path)}')">Execute</button>
                <button class="btn btn-ghost btn-sm" onclick="clearResponse('${respId}')">Clear</button>
              </div>
            </div>
            <div class="try-response" id="${respId}"></div>
          </div>` : ''}
        </div>
      `;
    });
  }

  area.innerHTML = html;
}

/* ── Scroll To Endpoint ───────────────────────────────────────────── */
window.scrollToEndpoint = function(epId) {
  const el = document.getElementById(epId);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    // Highlight sidebar
    document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
    const sItem = document.querySelector(`.sidebar-item[data-endpoint="${epId}"]`);
    if (sItem) sItem.classList.add('active');
  }
};

/* ── Execute Endpoint ─────────────────────────────────────────────── */
window.executeEndpoint = async function(epId, method, path) {
  const trySection = document.getElementById('try-' + epId);
  const respEl = document.getElementById('resp-' + epId);
  if (!trySection || !respEl) return;

  // Collect params
  let url = path;
  trySection.querySelectorAll('input[data-param]').forEach(input => {
    const val = input.value.trim();
    if (val) {
      url = url.replace(`{${input.dataset.param}}`, encodeURIComponent(val));
    }
  });

  // Collect body
  let body = null;
  const bodyEl = trySection.querySelector('textarea[data-body]');
  if (bodyEl) {
    try { body = bodyEl.value.trim(); } catch {}
  }

  respEl.classList.add('show');
  respEl.innerHTML = '<div style="color:var(--text-muted);">Sending request...</div>';

  try {
    const opts = {
      method: method === 'GET' || method === 'DELETE' ? method : method,
      headers: { 'Content-Type': 'application/json' },
    };
    if (body && method !== 'GET' && method !== 'DELETE') {
      opts.body = body;
    }

    const res = await fetch(location.origin + url, opts);
    const text = await res.text();
    let formatted = text;
    try { formatted = JSON.stringify(JSON.parse(text), null, 2); } catch {}

    respEl.innerHTML = `
      <div class="try-status ${res.ok ? 'ok' : 'error'}">${res.status} ${res.statusText}</div>
      <div>${esc(formatted)}</div>
    `;
  } catch (err) {
    respEl.innerHTML = `
      <div class="try-status error">Error</div>
      <div>${esc(err.message)}</div>
    `;
  }
};

window.clearResponse = function(respId) {
  const el = document.getElementById(respId);
  if (el) { el.classList.remove('show'); el.innerHTML = ''; }
};

/* ── Search ───────────────────────────────────────────────────────── */
document.getElementById('endpointSearch').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  const filtered = q
    ? ENDPOINTS.filter(ep =>
        ep.path.toLowerCase().includes(q) ||
        ep.method.toLowerCase().includes(q) ||
        ep.category.toLowerCase().includes(q) ||
        ep.description.toLowerCase().includes(q)
      )
    : ENDPOINTS;
  renderSidebar(filtered);
  renderEndpoints(filtered);
});

/* ── Init ─────────────────────────────────────────────────────────── */
renderSidebar(ENDPOINTS);
renderEndpoints(ENDPOINTS);

})();
</script>
