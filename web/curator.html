<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - 策展</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-hover:     #1c2d42;
  --bg-input:     #0c1322;
  --border:       #1e2d40;
  --border-light: #2d4054;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #5a6d82;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --orange:       #f59e0b;
  --red:          #ef4444;
  --purple:       #a855f7;
  --cyan:         #06b6d4;
  --yellow:       #eab308;
  --radius:       8px;
  --radius-lg:    12px;
  --transition:   200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; overflow: hidden; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }

/* ── Top Bar ─────────────────────────────────────────────── */
.topbar {
  height: 50px; background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 50; position: relative;
}
.topbar::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2) 50%, transparent); }
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(99,102,241,0.35); }
.topbar-logo svg { width: 16px; height: 16px; color: #fff; }
.topbar-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #93c5fd, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.topbar-page { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-left: 8px; }
.topbar-spacer { flex: 1; }
.topbar-btn { width: 34px; height: 34px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: var(--transition); }
.topbar-btn:hover { background: var(--bg-hover); color: var(--text-dim); }
.topbar-btn svg { width: 17px; height: 17px; }

/* ── Layout ──────────────────────────────────────────────── */
.page-layout { flex: 1; display: grid; grid-template-columns: 248px 1fr; overflow: hidden; transition: grid-template-columns 300ms cubic-bezier(0.16,1,0.3,1); }
.page-layout.sidebar-collapsed { grid-template-columns: 0px 1fr; }

/* ── Sidebar ─────────────────────────────────────────────── */
.page-sidebar {
  background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  width: 248px; min-width: 248px; max-width: 248px;
  transition: all 300ms cubic-bezier(0.16,1,0.3,1);
}
.sidebar-collapsed .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.page-sidebar-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 16px; }
.nav-group { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(30,45,64,0.6); }
.nav-group:last-child { border-bottom: none; }
.nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-muted); font-weight: 600; padding: 10px 10px 5px; user-select: none; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim); text-decoration: none; transition: var(--transition); position: relative; border: 1px solid transparent; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; border-color: var(--border); }
.nav-item.active { background: rgba(59,130,246,0.08); color: var(--accent-hover); font-weight: 500; border-color: rgba(59,130,246,0.15); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.55; }
.nav-item:hover svg { opacity: 0.8; }
.nav-item.active svg { opacity: 1; }

.page-content { overflow-y: auto; }

@media (max-width: 1024px) {
  .page-layout { grid-template-columns: 0px 1fr; }
  .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
}

/* ── Main Content Layout ────────────────────────────────── */
.main-layout { display: grid; grid-template-columns: 1fr 380px; min-height: 100%; }
.content-area { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.right-panel {
  background: var(--bg-base); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}

/* ── Buttons ─────────────────────────────────────────────── */
.btn {
  padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
  cursor: pointer; border: none; transition: var(--transition); display: inline-flex;
  align-items: center; gap: 6px; font-family: var(--font);
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Stats Row ───────────────────────────────────────────── */
.stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.stat-card {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 18px; text-align: center;
}
.stat-number { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-number.green { color: var(--green); }
.stat-number.blue { color: var(--accent); }
.stat-number.orange { color: var(--orange); }
.stat-number.red { color: var(--red); }
.stat-number.purple { color: var(--purple); }
.stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

/* ── Verdict Badges ──────────────────────────────────────── */
.verdict-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
  border-radius: 10px; font-size: 11px; font-weight: 600;
}
.verdict-approved { background: rgba(34,197,94,0.15); color: var(--green); }
.verdict-needs_revision { background: rgba(245,158,11,0.15); color: var(--orange); }
.verdict-rejected { background: rgba(239,68,68,0.15); color: var(--red); }
.verdict-flagged { background: rgba(168,85,247,0.15); color: var(--purple); }

/* ── Score Bar ───────────────────────────────────────────── */
.score-bar-container { display: flex; align-items: center; gap: 8px; }
.score-bar-track { flex: 1; height: 8px; background: var(--bg-deep); border-radius: 4px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
.score-bar-value { font-size: 12px; font-weight: 600; min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

/* ── Review List ─────────────────────────────────────────── */
.review-item {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 16px; cursor: pointer; transition: var(--transition);
  animation: fadeInUp 0.3s ease both;
}
.review-item:hover { border-color: var(--border-light); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.review-item.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.review-id { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
.review-timestamp { font-size: 11px; color: var(--text-muted); }
.review-request { font-size: 13px; color: var(--text); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.review-footer { display: flex; justify-content: space-between; align-items: center; }

/* ── Trend Chart ─────────────────────────────────────────── */
.trend-container {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px;
}
.trend-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.trend-title { font-size: 15px; font-weight: 700; }
.trend-svg { width: 100%; height: 160px; }

/* ── Distribution Chart ──────────────────────────────────── */
.distribution-container {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px;
}
.distribution-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.distribution-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.distribution-label { width: 100px; font-size: 12px; font-weight: 500; }
.distribution-bar-track { flex: 1; height: 20px; background: var(--bg-deep); border-radius: 4px; overflow: hidden; position: relative; }
.distribution-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; }
.distribution-bar-text { font-size: 10px; font-weight: 600; color: #fff; }
.distribution-count { font-size: 12px; color: var(--text-muted); min-width: 40px; text-align: right; }

/* ── Flagged Panel ───────────────────────────────────────── */
.flagged-item {
  padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  transition: var(--transition);
}
.flagged-item:hover { background: var(--bg-hover); }
.flagged-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.flagged-reason { font-size: 12px; color: var(--orange); font-weight: 500; }
.flagged-request { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Submit Form ─────────────────────────────────────────── */
.submit-section { padding: 20px 16px; border-bottom: 1px solid var(--border); }
.submit-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
.form-group { margin-bottom: 12px; }
.form-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 6px; display: block; }
.form-input {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px; color: var(--text); font-size: 13px;
  transition: border-color var(--transition); font-family: var(--font);
}
.form-input:focus { border-color: var(--accent); outline: none; }
textarea.form-input { resize: vertical; min-height: 60px; }

/* ── Panel Tabs ──────────────────────────────────────────── */
.panel-tabs {
  display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.panel-tab {
  flex: 1; padding: 12px; text-align: center; font-size: 12px; font-weight: 600;
  color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
  transition: var(--transition); text-transform: uppercase; letter-spacing: 0.5px;
}
.panel-tab:hover { color: var(--text-dim); background: var(--bg-surface); }
.panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.panel-view { display: none; flex: 1; overflow-y: auto; }
.panel-view.active { display: block; }

/* ── Section Header ──────────────────────────────────────── */
.section-header { display: flex; justify-content: space-between; align-items: center; }
.section-title { font-size: 16px; font-weight: 700; }

/* ── Empty State ─────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 60px 20px; color: var(--text-muted); text-align: center;
}
.empty-icon { opacity: 0.3; }
.empty-icon svg { width: 40px; height: 40px; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text-dim); }

/* ── Review Detail ───────────────────────────────────────── */
.review-detail-section { margin-bottom: 18px; }
.review-detail-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
.review-detail-text { font-size: 13px; color: var(--text); line-height: 1.6; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 900px) {
  .main-layout { grid-template-columns: 1fr; }
  .right-panel { border-left: none; border-top: 1px solid var(--border); }
}
</style>
</head>

          <div id="reviewList" style="display:flex; flex-direction:column; gap:10px;"></div>
          <div class="empty-state" id="reviewListEmpty" style="display:none;">
            <span class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
            <span class="empty-title">暂无审核记录</span>
          </div>
        </div>
      </div>

      <!-- Right Panel -->
      <div class="right-panel">
        <div class="panel-tabs">
          <div class="panel-tab active" onclick="switchPanelTab('submit')">提交</div>
          <div class="panel-tab" onclick="switchPanelTab('flagged')">已标记</div>
          <div class="panel-tab" onclick="switchPanelTab('detail')">详情</div>
        </div>

        <!-- Submit Tab -->
        <div class="panel-view active" id="submitView">
          <div class="submit-section">
            <div class="submit-title">提交审核</div>
            <form id="reviewForm" onsubmit="submitReview(event)">
              <div class="form-group">
                <label class="form-label">请求 / 提示词</label>
                <textarea class="form-input" id="reviewRequest" placeholder="原始请求或提示词..." rows="3"></textarea>
              </div>
              <div class="form-group">
                <label class="form-label">输出 / 响应</label>
                <textarea class="form-input" id="reviewOutput" placeholder="智能体的输出或响应..." rows="3"></textarea>
              </div>
              <div class="form-group">
                <label class="form-label">约束 (可选)</label>
                <textarea class="form-input" id="reviewConstraints" placeholder="任何约束或条件..." rows="2"></textarea>
              </div>
              <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;">提交审核</button>
            </form>
          </div>
          <div id="submitResult" style="display:none; padding:16px;"></div>
        </div>

        <!-- Flagged Tab -->
        <div class="panel-view" id="flaggedView">
          <div id="flaggedList"></div>
          <div class="empty-state" id="flaggedEmpty">
            <span class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
            <span class="empty-title">暂无已标记项</span>
          </div>
        </div>

        <!-- Detail Tab -->
        <div class="panel-view" id="detailView">
          <div class="empty-state" id="detailEmpty">
            <span class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
            <span class="empty-title">选择一条审核查看详情</span>
          </div>
          <div id="detailContent" style="display:none; padding:20px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ── Sidebar Toggle ──────────────────────────────────────── */
document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('pageLayout').classList.toggle('sidebar-collapsed');
});

const API_BASE = location.origin;
let reviews = [];
let selectedReviewId = null;
let stats = {};

/* ── Mock Data ───────────────────────────────────────────── */
const MOCK_REVIEWS = [
  { id: 'rev-001', verdict: 'approved', score: 0.92, timestamp: new Date(Date.now() - 60000).toISOString(), request: '生成用户认证 REST API 端点', output: '创建 POST /auth/login 使用 JWT 令牌生成...', constraints: '必须使用 bcrypt 进行密码哈希', feedback: '实现干净，错误处理妥当' },
  { id: 'rev-002', verdict: 'needs_revision', score: 0.65, timestamp: new Date(Date.now() - 180000).toISOString(), request: '为支付服务编写单元测试', output: '创建了5个覆盖基本支付流程的测试用例...', constraints: '覆盖边界情况和错误路径', feedback: '缺少退款的错误路径测试和边界用例' },
  { id: 'rev-003', verdict: 'approved', score: 0.88, timestamp: new Date(Date.now() - 300000).toISOString(), request: '为数据库查询实现缓存层', output: '添加基于 Redis 的缓存并配置 TTL...', constraints: '必须支持缓存失效', feedback: '实现良好，缓存预热略有改进空间' },
  { id: 'rev-004', verdict: 'rejected', score: 0.31, timestamp: new Date(Date.now() - 420000).toISOString(), request: '将应用部署到生产环境', output: '尝试跳过预发环境直接部署...', constraints: '必须遵循 CI/CD 流水线', feedback: '跳过了预发环境且未运行集成测试' },
  { id: 'rev-005', verdict: 'flagged', score: 0.55, timestamp: new Date(Date.now() - 600000).toISOString(), request: '重构用户模型以支持多租户', output: '添加 tenant_id 列并更新查询...', constraints: '需向后兼容', feedback: '存在数据迁移风险，需人工审核向后兼容性', flagReason: '向后兼容性风险' },
  { id: 'rev-006', verdict: 'approved', score: 0.95, timestamp: new Date(Date.now() - 900000).toISOString(), request: '为智能体端点创建 API 文档', output: '生成 OpenAPI 3.0 规范及示例...', constraints: '包含请求/响应示例', feedback: '文档完整，示例清晰' },
  { id: 'rev-007', verdict: 'needs_revision', score: 0.58, timestamp: new Date(Date.now() - 1200000).toISOString(), request: '优化仪表盘数据库查询', output: '添加索引并重写了3条查询...', constraints: '不得破坏现有功能', feedback: '索引添加合理，但一条查询重写改变了结果排序' },
  { id: 'rev-008', verdict: 'flagged', score: 0.45, timestamp: new Date(Date.now() - 1500000).toISOString(), request: '为 API 实现限流', output: '添加令牌桶限流器...', constraints: '必须支持按用户限流', feedback: '仅支持全局限流，不支持按用户限流', flagReason: '缺少按用户限流支持' },
];

const MOCK_STATS = {
  total_reviews: 156,
  average_score: 0.74,
  approved_count: 89,
  needs_revision_count: 34,
  rejected_count: 12,
  flagged_count: 21,
  scores_over_time: [0.68, 0.72, 0.71, 0.75, 0.74, 0.78, 0.76, 0.80, 0.77, 0.82, 0.79, 0.74, 0.81, 0.83, 0.85],
};

/* ── Verdict Labels (Chinese) ────────────────────────────── */
const VERDICT_LABELS = {
  approved: '已通过',
  needs_revision: '需修改',
  rejected: '已拒绝',
  flagged: '已标记',
};

/* ── Helper Functions ────────────────────────────────────── */
function esc(s) { const d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }

function formatTime(ts) {
  try { return new Date(ts).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch { return '--'; }
}

function scoreColor(score) {
  if (score >= 0.8) return 'var(--green)';
  if (score >= 0.6) return 'var(--orange)';
  return 'var(--red)';
}

function verdictClass(verdict) {
  return 'verdict-' + (verdict || 'approved');
}

function verdictLabel(verdict) {
  return VERDICT_LABELS[verdict] || verdict;
}

/* ── Load Stats ──────────────────────────────────────────── */
async function loadStats() {
  try {
    stats = await fetch(API_BASE + '/curator/stats').then(r => r.json());
  } catch {
    stats = MOCK_STATS;
  }
  renderStats();
  renderTrendChart();
  renderDistribution();
}

function renderStats() {
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card">
      <div class="stat-number blue">${stats.total_reviews || 0}</div>
      <div class="stat-label">审核总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" style="color:${scoreColor(stats.average_score || 0)}">${((stats.average_score || 0) * 100).toFixed(1)}%</div>
      <div class="stat-label">平均分</div>
    </div>
    <div class="stat-card">
      <div class="stat-number green">${stats.approved_count || 0}</div>
      <div class="stat-label">已通过</div>
    </div>
    <div class="stat-card">
      <div class="stat-number orange">${stats.needs_revision_count || 0}</div>
      <div class="stat-label">需修改</div>
    </div>
    <div class="stat-card">
      <div class="stat-number red">${stats.rejected_count || 0}</div>
      <div class="stat-label">已拒绝</div>
    </div>
    <div class="stat-card">
      <div class="stat-number purple">${stats.flagged_count || 0}</div>
      <div class="stat-label">已标记</div>
    </div>
  `;
}

/* ── Trend Chart (SVG line chart) ────────────────────────── */
function renderTrendChart() {
  const scores = stats.scores_over_time || [];
  if (!scores.length) return;

  const svg = document.getElementById('trendChart');
  const w = svg.clientWidth || 600;
  const h = 160;
  const padding = { top: 10, right: 20, bottom: 30, left: 40 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;

  const minScore = Math.max(0, Math.min(...scores) - 0.05);
  const maxScore = Math.min(1, Math.max(...scores) + 0.05);
  const scaleX = (i) => padding.left + (i / (scores.length - 1)) * chartW;
  const scaleY = (v) => padding.top + (1 - (v - minScore) / (maxScore - minScore)) * chartH;

  const points = scores.map((s, i) => `${scaleX(i)},${scaleY(s)}`).join(' ');
  const areaPoints = points + ` ${scaleX(scores.length - 1)},${scaleY(minScore)} ${scaleX(0)},${scaleY(minScore)}`;

  let gridLines = '';
  const gridSteps = 4;
  for (let i = 0; i <= gridSteps; i++) {
    const v = minScore + (maxScore - minScore) * (i / gridSteps);
    const y = scaleY(v);
    gridLines += `<line x1="${padding.left}" y1="${y}" x2="${w - padding.right}" y2="${y}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4" />`;
    gridLines += `<text x="${padding.left - 8}" y="${y + 4}" fill="var(--text-muted)" font-size="10" text-anchor="end">${(v * 100).toFixed(0)}%</text>`;
  }

  let dots = scores.map((s, i) =>
    `<circle cx="${scaleX(i)}" cy="${scaleY(s)}" r="3" fill="var(--accent)" stroke="var(--bg-surface)" stroke-width="2" />`
  ).join('');

  svg.innerHTML = `
    ${gridLines}
    <polygon points="${areaPoints}" fill="rgba(59,130,246,0.1)" />
    <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" />
    ${dots}
  `;
}

/* ── Distribution Chart ──────────────────────────────────── */
function renderDistribution() {
  const total = (stats.approved_count || 0) + (stats.needs_revision_count || 0) +
                (stats.rejected_count || 0) + (stats.flagged_count || 0);
  if (!total) return;

  const items = [
    { label: '已通过', count: stats.approved_count || 0, color: 'var(--green)' },
    { label: '需修改', count: stats.needs_revision_count || 0, color: 'var(--orange)' },
    { label: '已拒绝', count: stats.rejected_count || 0, color: 'var(--red)' },
    { label: '已标记', count: stats.flagged_count || 0, color: 'var(--purple)' },
  ];

  document.getElementById('distributionChart').innerHTML = items.map(item => {
    const pct = (item.count / total) * 100;
    return `
      <div class="distribution-row">
        <div class="distribution-label">${item.label}</div>
        <div class="distribution-bar-track">
          <div class="distribution-bar-fill" style="width:${pct}%; background:${item.color};">
            ${pct > 8 ? `<span class="distribution-bar-text">${pct.toFixed(0)}%</span>` : ''}
          </div>
        </div>
        <div class="distribution-count">${item.count}</div>
      </div>
    `;
  }).join('');
}

/* ── Load Reviews ────────────────────────────────────────── */
async function loadReviews() {
  try {
    reviews = await fetch(API_BASE + '/curator/reviews').then(r => r.json());
  } catch {
    reviews = MOCK_REVIEWS;
  }
  renderReviews();
  renderFlaggedItems();
}

function renderReviews() {
  const el = document.getElementById('reviewList');
  const empty = document.getElementById('reviewListEmpty');

  if (!reviews.length) {
    el.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  el.innerHTML = reviews.map((r, i) => `
    <div class="review-item ${r.id === selectedReviewId ? 'selected' : ''}"
         onclick="selectReview('${esc(r.id)}')"
         style="animation-delay: ${i * 0.05}s;">
      <div class="review-header">
        <span class="review-id">${esc(r.id)}</span>
        <span class="review-timestamp">${formatTime(r.timestamp)}</span>
      </div>
      <div class="review-request">${esc(r.request)}</div>
      <div class="review-footer">
        <span class="verdict-badge ${verdictClass(r.verdict)}">${esc(verdictLabel(r.verdict))}</span>
        <div class="score-bar-container" style="width:140px;">
          <div class="score-bar-track">
            <div class="score-bar-fill" style="width:${(r.score * 100).toFixed(0)}%; background:${scoreColor(r.score)};"></div>
          </div>
          <span class="score-bar-value" style="color:${scoreColor(r.score)};">${(r.score * 100).toFixed(0)}%</span>
        </div>
      </div>
    </div>
  `).join('');
}

/* ── Select Review ───────────────────────────────────────── */
window.selectReview = function(id) {
  selectedReviewId = id;
  const review = reviews.find(r => r.id === id);
  if (!review) return;
  renderReviews();
  switchPanelTab('detail');
  renderReviewDetail(review);
};

function renderReviewDetail(r) {
  document.getElementById('detailEmpty').style.display = 'none';
  const el = document.getElementById('detailContent');
  el.style.display = 'block';
  el.innerHTML = `
    <div class="review-detail-section">
      <div class="review-detail-label">审核 ID</div>
      <div style="font-family:var(--mono); font-size:12px; color:var(--text-dim);">${esc(r.id)}</div>
    </div>
    <div class="review-detail-section">
      <div class="review-detail-label">结论</div>
      <span class="verdict-badge ${verdictClass(r.verdict)}" style="font-size:13px;">${esc(verdictLabel(r.verdict))}</span>
    </div>
    <div class="review-detail-section">
      <div class="review-detail-label">分数</div>
      <div class="score-bar-container">
        <div class="score-bar-track" style="height:12px;">
          <div class="score-bar-fill" style="width:${(r.score * 100)}%; background:${scoreColor(r.score)};"></div>
        </div>
        <span class="score-bar-value" style="color:${scoreColor(r.score)}; font-size:16px;">${(r.score * 100).toFixed(1)}%</span>
      </div>
    </div>
    <div class="review-detail-section">
      <div class="review-detail-label">请求</div>
      <div class="review-detail-text">${esc(r.request)}</div>
    </div>
    <div class="review-detail-section">
      <div class="review-detail-label">输出</div>
      <div class="review-detail-text">${esc(r.output)}</div>
    </div>
    ${r.constraints ? `
    <div class="review-detail-section">
      <div class="review-detail-label">约束</div>
      <div class="review-detail-text">${esc(r.constraints)}</div>
    </div>` : ''}
    ${r.feedback ? `
    <div class="review-detail-section">
      <div class="review-detail-label">反馈</div>
      <div class="review-detail-text">${esc(r.feedback)}</div>
    </div>` : ''}
    ${r.flagReason ? `
    <div class="review-detail-section">
      <div class="review-detail-label">标记原因</div>
      <div style="color:var(--orange); font-size:13px;">${esc(r.flagReason)}</div>
    </div>` : ''}
    <div class="review-detail-section">
      <div class="review-detail-label">日期</div>
      <div class="review-detail-text">${formatTime(r.timestamp)}</div>
    </div>
  `;
}

/* ── Submit Review ───────────────────────────────────────── */
window.submitReview = async function(e) {
  e.preventDefault();
  const request = document.getElementById('reviewRequest').value.trim();
  const output = document.getElementById('reviewOutput').value.trim();
  const constraints = document.getElementById('reviewConstraints').value.trim();

  if (!request || !output) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  try {
    const result = await fetch(API_BASE + '/curator/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ request, output, constraints }),
    }).then(r => r.json());

    document.getElementById('submitResult').style.display = 'block';
    document.getElementById('submitResult').innerHTML = `
      <div style="background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px;">
        <div style="font-size:13px; font-weight:600; margin-bottom:8px;">审核结果</div>
        <div style="margin-bottom:8px;"><span class="verdict-badge ${verdictClass(result.verdict)}">${esc(verdictLabel(result.verdict || ''))}</span></div>
        <div class="score-bar-container" style="margin-bottom:8px;">
          <div class="score-bar-track"><div class="score-bar-fill" style="width:${((result.score || 0) * 100)}%; background:${scoreColor(result.score || 0)};"></div></div>
          <span class="score-bar-value" style="color:${scoreColor(result.score || 0)};">${((result.score || 0) * 100).toFixed(1)}%</span>
        </div>
        ${result.feedback ? `<div style="font-size:12px; color:var(--text-dim);">${esc(result.feedback)}</div>` : ''}
      </div>
    `;
    document.getElementById('reviewForm').reset();
    loadReviews();
    loadStats();
  } catch (err) {
    const mockResult = { verdict: 'approved', score: 0.82, feedback: '模拟审核: 整体看起来不错。' };
    document.getElementById('submitResult').style.display = 'block';
    document.getElementById('submitResult').innerHTML = `
      <div style="background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px;">
        <div style="font-size:13px; font-weight:600; margin-bottom:8px;">审核结果 (演示)</div>
        <div style="margin-bottom:8px;"><span class="verdict-badge verdict-approved">已通过</span></div>
        <div class="score-bar-container" style="margin-bottom:8px;">
          <div class="score-bar-track"><div class="score-bar-fill" style="width:82%; background:var(--green);"></div></div>
          <span class="score-bar-value" style="color:var(--green);">82.0%</span>
        </div>
        <div style="font-size:12px; color:var(--text-dim);">模拟审核: 整体看起来不错。</div>
      </div>
    `;
  } finally {
    btn.disabled = false;
    btn.textContent = '提交审核';
  }
};

/* ── Flagged Items ───────────────────────────────────────── */
function renderFlaggedItems() {
  const flagged = reviews.filter(r => r.verdict === 'flagged');
  const el = document.getElementById('flaggedList');
  const empty = document.getElementById('flaggedEmpty');

  if (!flagged.length) {
    el.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  el.innerHTML = flagged.map(r => `
    <div class="flagged-item" onclick="selectReview('${esc(r.id)}')">
      <div class="flagged-header">
        <span class="verdict-badge verdict-flagged">已标记</span>
        <span style="font-size:11px; color:var(--text-muted);">${formatTime(r.timestamp)}</span>
      </div>
      <div class="flagged-reason">${esc(r.flagReason || '需人工审核')}</div>
      <div class="flagged-request">${esc(r.request)}</div>
    </div>
  `).join('');
}

/* ── Panel Tab Switching ─────────────────────────────────── */
window.switchPanelTab = function(tab) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel-view').forEach(v => v.classList.remove('active'));

  const tabs = ['submit', 'flagged', 'detail'];
  const idx = tabs.indexOf(tab);
  if (idx >= 0) {
    document.querySelectorAll('.panel-tab')[idx].classList.add('active');
    document.getElementById(tab + 'View').classList.add('active');
  }
};

/* ── Init ─────────────────────────────────────────────────── */
window.loadStats = loadStats;
window.loadReviews = loadReviews;

loadStats();
loadReviews();

})();
</script>
</body>
</html>
