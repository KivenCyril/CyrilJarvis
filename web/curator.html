<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - Curator Quality Dashboard</title>
<style>
/* ====================================================================
   JARVIS Curator Quality Dashboard — Standalone Page CSS
   ==================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-card:      #1e293b;
  --bg-hover:     #273549;
  --bg-input:     #0f172a;
  --border:       #334155;
  --border-light: #3f506a;
  --border-focus: #6366f1;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #64748b;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --orange:       #f59e0b;
  --red:          #ef4444;
  --purple:       #a855f7;
  --cyan:         #06b6d4;
  --pink:         #ec4899;
  --radius:       8px;
  --radius-lg:    12px;
  --shadow:       0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md:    0 4px 12px rgba(0,0,0,0.3);
  --transition:   180ms ease;
  --font:         'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; }
body { display: flex; flex-direction: column; overflow: hidden; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* -- Top Nav ----------------------------------------------------------- */
.topnav {
  height: 52px; background: var(--bg-base); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0;
}
.topnav-brand { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
.topnav-brand span { color: var(--text-dim); font-weight: 400; margin-left: 6px; font-size: 14px; }
.topnav-links { display: flex; gap: 4px; margin-left: 24px; flex-wrap: wrap; }
.topnav-links a {
  padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
  color: var(--text-dim); text-decoration: none; transition: var(--transition);
}
.topnav-links a:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; }
.topnav-links a.active { background: var(--accent); color: #fff; }

/* -- Layout ------------------------------------------------------------ */
.main-layout { flex: 1; display: grid; grid-template-columns: 1fr 380px; overflow: hidden; }
.content-area { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.right-panel {
  background: var(--bg-base); border-left: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
}

/* -- Buttons ----------------------------------------------------------- */
.btn {
  padding: 9px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 600;
  cursor: pointer; border: none; transition: var(--transition); display: inline-flex;
  align-items: center; gap: 6px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* -- Stats Row --------------------------------------------------------- */
.stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
.stat-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 18px; text-align: center;
}
.stat-number { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-number.green { color: var(--green); }
.stat-number.blue { color: var(--accent); }
.stat-number.orange { color: var(--orange); }
.stat-number.red { color: var(--red); }
.stat-number.purple { color: var(--purple); }
.stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

/* -- Verdict Badges ---------------------------------------------------- */
.verdict-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
  border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase;
}
.verdict-approved { background: rgba(34,197,94,0.15); color: var(--green); }
.verdict-needs_revision { background: rgba(245,158,11,0.15); color: var(--orange); }
.verdict-rejected { background: rgba(239,68,68,0.15); color: var(--red); }
.verdict-flagged { background: rgba(168,85,247,0.15); color: var(--purple); }

/* -- Score Bar --------------------------------------------------------- */
.score-bar-container { display: flex; align-items: center; gap: 8px; }
.score-bar-track { flex: 1; height: 8px; background: var(--bg-deep); border-radius: 4px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
.score-bar-value { font-size: 12px; font-weight: 600; min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

/* -- Review List ------------------------------------------------------- */
.review-item {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 16px; cursor: pointer; transition: var(--transition);
  animation: fadeInUp 0.3s ease both;
}
.review-item:hover { border-color: var(--border-light); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.review-item.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.review-id { font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
.review-timestamp { font-size: 11px; color: var(--text-muted); }
.review-request { font-size: 13px; color: var(--text); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.review-footer { display: flex; justify-content: space-between; align-items: center; }

/* -- Trend Chart ------------------------------------------------------- */
.trend-container {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px;
}
.trend-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.trend-title { font-size: 15px; font-weight: 700; }
.trend-svg { width: 100%; height: 160px; }

/* -- Distribution Chart ------------------------------------------------ */
.distribution-container {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px;
}
.distribution-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; }
.distribution-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.distribution-label { width: 100px; font-size: 12px; font-weight: 500; text-transform: capitalize; }
.distribution-bar-track { flex: 1; height: 20px; background: var(--bg-deep); border-radius: 4px; overflow: hidden; position: relative; }
.distribution-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; }
.distribution-bar-text { font-size: 10px; font-weight: 600; color: #fff; }
.distribution-count { font-size: 12px; color: var(--text-muted); min-width: 40px; text-align: right; }

/* -- Flagged Panel ----------------------------------------------------- */
.flagged-item {
  padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  transition: var(--transition);
}
.flagged-item:hover { background: var(--bg-hover); }
.flagged-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.flagged-reason { font-size: 12px; color: var(--orange); font-weight: 500; }
.flagged-request { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* -- Submit Form ------------------------------------------------------- */
.submit-section {
  padding: 20px 16px; border-bottom: 1px solid var(--border);
}
.submit-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
.form-group { margin-bottom: 12px; }
.form-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 6px; display: block; }
.form-input {
  width: 100%; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px; color: var(--text); font-size: 13px;
  transition: border-color var(--transition);
}
.form-input:focus { border-color: var(--border-focus); outline: none; }
textarea.form-input { resize: vertical; min-height: 60px; font-family: var(--font); }

/* -- Panel Tabs -------------------------------------------------------- */
.panel-tabs {
  display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.panel-tab {
  flex: 1; padding: 12px; text-align: center; font-size: 12px; font-weight: 600;
  color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
  transition: var(--transition); text-transform: uppercase; letter-spacing: 0.5px;
}
.panel-tab:hover { color: var(--text-dim); background: var(--bg-surface); }
.panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.panel-view { display: none; flex: 1; overflow-y: auto; }
.panel-view.active { display: block; }

/* -- Section Header ---------------------------------------------------- */
.section-header { display: flex; justify-content: space-between; align-items: center; }
.section-title { font-size: 16px; font-weight: 700; }

/* -- Empty State ------------------------------------------------------- */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 60px 20px; color: var(--text-muted); text-align: center;
}
.empty-icon { font-size: 40px; opacity: 0.3; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text-dim); }

/* -- Review Detail ----------------------------------------------------- */
.review-detail-section { margin-bottom: 18px; }
.review-detail-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
.review-detail-text { font-size: 13px; color: var(--text); line-height: 1.6; }
.review-detail-json {
  background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<!-- Top Navigation -->
<nav class="topnav">
  <div class="topnav-brand">JARVIS <span>Curator</span></div>
  <div class="topnav-links">

<div class="main-layout">
  <!-- Content Area -->
  <div class="content-area">
    <!-- Stats -->
    <div class="stats-row" id="statsRow">
      <!-- Populated by JS -->
    </div>

    <!-- Quality Trend Chart -->
    <div class="trend-container">
      <div class="trend-header">
        <div class="trend-title">Quality Score Trend</div>
        <button class="btn btn-ghost btn-sm" onclick="loadStats()">Refresh</button>
      </div>
      <svg class="trend-svg" id="trendChart"></svg>
    </div>

    <!-- Verdict Distribution -->
    <div class="distribution-container">
      <div class="distribution-title">Verdict Distribution</div>
      <div id="distributionChart"></div>
    </div>

    <!-- Review History -->
    <div>
      <div class="section-header" style="margin-bottom:14px;">
        <div class="section-title">Review History</div>
        <button class="btn btn-ghost btn-sm" onclick="loadReviews()">Refresh</button>
      </div>
      <div id="reviewList" style="display:flex; flex-direction:column; gap:10px;">
        <!-- Populated by JS -->
      </div>
      <div class="empty-state" id="reviewListEmpty" style="display:none;">
        <span class="empty-icon">&#128203;</span>
        <span class="empty-title">No reviews yet</span>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="panel-tabs">
      <div class="panel-tab active" onclick="switchPanelTab('submit')">Submit</div>
      <div class="panel-tab" onclick="switchPanelTab('flagged')">Flagged</div>
      <div class="panel-tab" onclick="switchPanelTab('detail')">Detail</div>
    </div>

    <!-- Submit Tab -->
    <div class="panel-view active" id="submitView">
      <div class="submit-section">
        <div class="submit-title">Submit Review</div>
        <form id="reviewForm" onsubmit="submitReview(event)">
          <div class="form-group">
            <label class="form-label">Request / Prompt</label>
            <textarea class="form-input" id="reviewRequest" placeholder="The original request or prompt..." rows="3"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Output / Response</label>
            <textarea class="form-input" id="reviewOutput" placeholder="The agent's output or response..." rows="3"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Constraints (optional)</label>
            <textarea class="form-input" id="reviewConstraints" placeholder="Any constraints or criteria..." rows="2"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;">Submit for Review</button>
        </form>
      </div>
      <div id="submitResult" style="display:none; padding:16px;">
        <!-- Shows last review result -->
      </div>
    </div>

    <!-- Flagged Tab -->
    <div class="panel-view" id="flaggedView">
      <div id="flaggedList">
        <!-- Populated by JS -->
      </div>
      <div class="empty-state" id="flaggedEmpty">
        <span class="empty-icon">&#9888;</span>
        <span class="empty-title">No flagged items</span>
      </div>
    </div>

    <!-- Detail Tab -->
    <div class="panel-view" id="detailView">
      <div class="empty-state" id="detailEmpty">
        <span class="empty-icon">&#128269;</span>
        <span class="empty-title">Select a review to see details</span>
      </div>
      <div id="detailContent" style="display:none; padding:20px;"></div>
    </div>
  </div>
</div>

<script>
/* ====================================================================
   JARVIS Curator Quality Dashboard — JavaScript
   ==================================================================== */
(() => {
'use strict';

const API_BASE = location.origin;
let reviews = [];
let selectedReviewId = null;
let stats = {};

/* ── Mock Data ────────────────────────────────────────────────────── */
const MOCK_REVIEWS = [
  { id: 'rev-001', verdict: 'approved', score: 0.92, timestamp: new Date(Date.now() - 60000).toISOString(), request: 'Generate a REST API endpoint for user authentication', output: 'Created POST /auth/login with JWT token generation...', constraints: 'Must use bcrypt for password hashing', feedback: 'Clean implementation with proper error handling' },
  { id: 'rev-002', verdict: 'needs_revision', score: 0.65, timestamp: new Date(Date.now() - 180000).toISOString(), request: 'Write unit tests for the payment service', output: 'Created 5 test cases covering basic payment flow...', constraints: 'Cover edge cases and error paths', feedback: 'Missing error path tests and edge cases for refunds' },
  { id: 'rev-003', verdict: 'approved', score: 0.88, timestamp: new Date(Date.now() - 300000).toISOString(), request: 'Implement caching layer for database queries', output: 'Added Redis-based caching with TTL configuration...', constraints: 'Must support cache invalidation', feedback: 'Good implementation, minor improvement needed for cache warming' },
  { id: 'rev-004', verdict: 'rejected', score: 0.31, timestamp: new Date(Date.now() - 420000).toISOString(), request: 'Deploy the application to production', output: 'Attempted direct deployment without staging...', constraints: 'Must follow CI/CD pipeline', feedback: 'Skipped staging environment and did not run integration tests' },
  { id: 'rev-005', verdict: 'flagged', score: 0.55, timestamp: new Date(Date.now() - 600000).toISOString(), request: 'Refactor the user model to support multi-tenancy', output: 'Added tenant_id column and updated queries...', constraints: 'Backward compatible', feedback: 'Potential data migration issues, needs human review for backward compatibility', flagReason: 'Backward compatibility concern' },
  { id: 'rev-006', verdict: 'approved', score: 0.95, timestamp: new Date(Date.now() - 900000).toISOString(), request: 'Create API documentation for the agents endpoint', output: 'Generated OpenAPI 3.0 spec with examples...', constraints: 'Include request/response examples', feedback: 'Comprehensive documentation with clear examples' },
  { id: 'rev-007', verdict: 'needs_revision', score: 0.58, timestamp: new Date(Date.now() - 1200000).toISOString(), request: 'Optimize database queries for the dashboard', output: 'Added indexes and rewrote 3 queries...', constraints: 'Must not break existing functionality', feedback: 'Index additions are good but one query rewrite changes result ordering' },
  { id: 'rev-008', verdict: 'flagged', score: 0.45, timestamp: new Date(Date.now() - 1500000).toISOString(), request: 'Implement rate limiting for the API', output: 'Added token bucket rate limiter...', constraints: 'Must support per-user limits', feedback: 'Implementation only supports global limits, not per-user', flagReason: 'Missing per-user rate limit support' },
];

const MOCK_STATS = {
  total_reviews: 156,
  average_score: 0.74,
  approved_count: 89,
  needs_revision_count: 34,
  rejected_count: 12,
  flagged_count: 21,
  scores_over_time: [0.68, 0.72, 0.71, 0.75, 0.74, 0.78, 0.76, 0.80, 0.77, 0.82, 0.79, 0.74, 0.81, 0.83, 0.85],
};

/* ── Helper Functions ─────────────────────────────────────────────── */
function esc(s) { const d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }

function formatTime(ts) {
  try { return new Date(ts).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch { return '--'; }
}

function scoreColor(score) {
  if (score >= 0.8) return 'var(--green)';
  if (score >= 0.6) return 'var(--orange)';
  return 'var(--red)';
}

function verdictClass(verdict) {
  return 'verdict-' + (verdict || 'approved');
}

/* ── Load Stats ───────────────────────────────────────────────────── */
async function loadStats() {
  try {
    stats = await fetch(API_BASE + '/curator/stats').then(r => r.json());
  } catch {
    stats = MOCK_STATS;
  }
  renderStats();
  renderTrendChart();
  renderDistribution();
}

function renderStats() {
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card">
      <div class="stat-number blue">${stats.total_reviews || 0}</div>
      <div class="stat-label">Total Reviews</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" style="color:${scoreColor(stats.average_score || 0)}">${((stats.average_score || 0) * 100).toFixed(1)}%</div>
      <div class="stat-label">Average Score</div>
    </div>
    <div class="stat-card">
      <div class="stat-number green">${stats.approved_count || 0}</div>
      <div class="stat-label">Approved</div>
    </div>
    <div class="stat-card">
      <div class="stat-number orange">${stats.needs_revision_count || 0}</div>
      <div class="stat-label">Needs Revision</div>
    </div>
    <div class="stat-card">
      <div class="stat-number red">${stats.rejected_count || 0}</div>
      <div class="stat-label">Rejected</div>
    </div>
    <div class="stat-card">
      <div class="stat-number purple">${stats.flagged_count || 0}</div>
      <div class="stat-label">Flagged</div>
    </div>
  `;
}

/* ── Trend Chart (SVG line chart) ─────────────────────────────────── */
function renderTrendChart() {
  const scores = stats.scores_over_time || [];
  if (!scores.length) return;

  const svg = document.getElementById('trendChart');
  const w = svg.clientWidth || 600;
  const h = 160;
  const padding = { top: 10, right: 20, bottom: 30, left: 40 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;

  const minScore = Math.max(0, Math.min(...scores) - 0.05);
  const maxScore = Math.min(1, Math.max(...scores) + 0.05);
  const scaleX = (i) => padding.left + (i / (scores.length - 1)) * chartW;
  const scaleY = (v) => padding.top + (1 - (v - minScore) / (maxScore - minScore)) * chartH;

  // Build points
  const points = scores.map((s, i) => `${scaleX(i)},${scaleY(s)}`).join(' ');
  const areaPoints = points + ` ${scaleX(scores.length - 1)},${scaleY(minScore)} ${scaleX(0)},${scaleY(minScore)}`;

  // Grid lines
  let gridLines = '';
  const gridSteps = 4;
  for (let i = 0; i <= gridSteps; i++) {
    const v = minScore + (maxScore - minScore) * (i / gridSteps);
    const y = scaleY(v);
    gridLines += `<line x1="${padding.left}" y1="${y}" x2="${w - padding.right}" y2="${y}" stroke="var(--border)" stroke-width="0.5" stroke-dasharray="4,4" />`;
    gridLines += `<text x="${padding.left - 8}" y="${y + 4}" fill="var(--text-muted)" font-size="10" text-anchor="end">${(v * 100).toFixed(0)}%</text>`;
  }

  // Dots
  let dots = scores.map((s, i) =>
    `<circle cx="${scaleX(i)}" cy="${scaleY(s)}" r="3" fill="var(--accent)" stroke="var(--bg-card)" stroke-width="2" />`
  ).join('');

  svg.innerHTML = `
    ${gridLines}
    <polygon points="${areaPoints}" fill="rgba(59,130,246,0.1)" />
    <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" />
    ${dots}
  `;
}

/* ── Distribution Chart ───────────────────────────────────────────── */
function renderDistribution() {
  const total = (stats.approved_count || 0) + (stats.needs_revision_count || 0) +
                (stats.rejected_count || 0) + (stats.flagged_count || 0);
  if (!total) return;

  const items = [
    { label: 'Approved', count: stats.approved_count || 0, color: 'var(--green)' },
    { label: 'Needs Revision', count: stats.needs_revision_count || 0, color: 'var(--orange)' },
    { label: 'Rejected', count: stats.rejected_count || 0, color: 'var(--red)' },
    { label: 'Flagged', count: stats.flagged_count || 0, color: 'var(--purple)' },
  ];

  document.getElementById('distributionChart').innerHTML = items.map(item => {
    const pct = (item.count / total) * 100;
    return `
      <div class="distribution-row">
        <div class="distribution-label">${item.label}</div>
        <div class="distribution-bar-track">
          <div class="distribution-bar-fill" style="width:${pct}%; background:${item.color};">
            ${pct > 8 ? `<span class="distribution-bar-text">${pct.toFixed(0)}%</span>` : ''}
          </div>
        </div>
        <div class="distribution-count">${item.count}</div>
      </div>
    `;
  }).join('');
}

/* ── Load Reviews ─────────────────────────────────────────────────── */
async function loadReviews() {
  try {
    reviews = await fetch(API_BASE + '/curator/reviews').then(r => r.json());
  } catch {
    reviews = MOCK_REVIEWS;
  }
  renderReviews();
}

function renderReviews() {
  const el = document.getElementById('reviewList');
  const empty = document.getElementById('reviewListEmpty');

  if (!reviews.length) {
    el.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  el.innerHTML = reviews.map((r, i) => `
    <div class="review-item ${r.id === selectedReviewId ? 'selected' : ''}"
         onclick="selectReview('${esc(r.id)}')"
         style="animation-delay: ${i * 0.05}s;">
      <div class="review-header">
        <span class="review-id">${esc(r.id)}</span>
        <span class="review-timestamp">${formatTime(r.timestamp)}</span>
      </div>
      <div class="review-request">${esc(r.request)}</div>
      <div class="review-footer">
        <span class="verdict-badge ${verdictClass(r.verdict)}">${esc(r.verdict.replace(/_/g, ' '))}</span>
        <div class="score-bar-container" style="width:140px;">
          <div class="score-bar-track">
            <div class="score-bar-fill" style="width:${(r.score * 100).toFixed(0)}%; background:${scoreColor(r.score)};"></div>
          </div>
          <span class="score-bar-value" style="color:${scoreColor(r.score)};">${(r.score * 100).toFixed(0)}%</span>
        </div>
      </div>
    </div>
  `).join('');
}

/* ── Select Review ────────────────────────────────────────────────── */
window.selectReview = function(id) {
  selectedReviewId = id;
  const review = reviews.find(r => r.id === id);
  if (!review) return;
  renderReviews();
  switchPanelTab('detail');
  renderReviewDetail(review);
};

function renderReviewDetail(r) {
  document.getElementById('detailEmpty').style.display = 'none';
  const el = document.getElementById('detailContent');
  el.style.display = 'block';
  el.innerHTML = `
    <div class="review-detail-section">
      <div class="review-detail-label">Review ID</div>
      <div style="font-family:var(--mono); font-size:12px; color:var(--text-dim);">${esc(r.id)}</div>
    </div>
    <div class="review-detail-section">
      <div class="review-detail-label">Verdict</div>
      <span class="verdict-badge ${verdictClass(r.verdict)}" style="font-size:13px;">${esc(r.verdict.replace(/_/g, ' '))}</span>
    </div>
    <div class="review-detail-section">
      <div class="review-detail-label">Score</div>
      <div class="score-bar-container">
        <div class="score-bar-track" style="height:12px;">
          <div class="score-bar-fill" style="width:${(r.score * 100)}%; background:${scoreColor(r.score)};"></div>
        </div>
        <span class="score-bar-value" style="color:${scoreColor(r.score)}; font-size:16px;">${(r.score * 100).toFixed(1)}%</span>
      </div>
    </div>
    <div class="review-detail-section">
      <div class="review-detail-label">Request</div>
      <div class="review-detail-text">${esc(r.request)}</div>
    </div>
    <div class="review-detail-section">
      <div class="review-detail-label">Output</div>
      <div class="review-detail-text">${esc(r.output)}</div>
    </div>
    ${r.constraints ? `
    <div class="review-detail-section">
      <div class="review-detail-label">Constraints</div>
      <div class="review-detail-text">${esc(r.constraints)}</div>
    </div>` : ''}
    ${r.feedback ? `
    <div class="review-detail-section">
      <div class="review-detail-label">Feedback</div>
      <div class="review-detail-text">${esc(r.feedback)}</div>
    </div>` : ''}
    ${r.flagReason ? `
    <div class="review-detail-section">
      <div class="review-detail-label">Flag Reason</div>
      <div style="color:var(--orange); font-size:13px;">${esc(r.flagReason)}</div>
    </div>` : ''}
    <div class="review-detail-section">
      <div class="review-detail-label">Timestamp</div>
      <div class="review-detail-text">${formatTime(r.timestamp)}</div>
    </div>
  `;
}

/* ── Submit Review ────────────────────────────────────────────────── */
window.submitReview = async function(e) {
  e.preventDefault();
  const request = document.getElementById('reviewRequest').value.trim();
  const output = document.getElementById('reviewOutput').value.trim();
  const constraints = document.getElementById('reviewConstraints').value.trim();

  if (!request || !output) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  try {
    const result = await fetch(API_BASE + '/curator/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ request, output, constraints }),
    }).then(r => r.json());

    document.getElementById('submitResult').style.display = 'block';
    document.getElementById('submitResult').innerHTML = `
      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px;">
        <div style="font-size:13px; font-weight:600; margin-bottom:8px;">Review Result</div>
        <div style="margin-bottom:8px;"><span class="verdict-badge ${verdictClass(result.verdict)}">${esc((result.verdict || '').replace(/_/g, ' '))}</span></div>
        <div class="score-bar-container" style="margin-bottom:8px;">
          <div class="score-bar-track"><div class="score-bar-fill" style="width:${((result.score || 0) * 100)}%; background:${scoreColor(result.score || 0)};"></div></div>
          <span class="score-bar-value" style="color:${scoreColor(result.score || 0)};">${((result.score || 0) * 100).toFixed(1)}%</span>
        </div>
        ${result.feedback ? `<div style="font-size:12px; color:var(--text-dim);">${esc(result.feedback)}</div>` : ''}
      </div>
    `;
    document.getElementById('reviewForm').reset();
    loadReviews();
    loadStats();
  } catch (err) {
    // Mock a result for demo
    const mockResult = { verdict: 'approved', score: 0.82, feedback: 'Mock review: looks good overall.' };
    document.getElementById('submitResult').style.display = 'block';
    document.getElementById('submitResult').innerHTML = `
      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px;">
        <div style="font-size:13px; font-weight:600; margin-bottom:8px;">Review Result (demo)</div>
        <div style="margin-bottom:8px;"><span class="verdict-badge verdict-approved">approved</span></div>
        <div class="score-bar-container" style="margin-bottom:8px;">
          <div class="score-bar-track"><div class="score-bar-fill" style="width:82%; background:var(--green);"></div></div>
          <span class="score-bar-value" style="color:var(--green);">82.0%</span>
        </div>
        <div style="font-size:12px; color:var(--text-dim);">Mock review: looks good overall.</div>
      </div>
    `;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit for Review';
  }
};

/* ── Flagged Items ────────────────────────────────────────────────── */
function renderFlaggedItems() {
  const flagged = reviews.filter(r => r.verdict === 'flagged');
  const el = document.getElementById('flaggedList');
  const empty = document.getElementById('flaggedEmpty');

  if (!flagged.length) {
    el.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  el.innerHTML = flagged.map(r => `
    <div class="flagged-item" onclick="selectReview('${esc(r.id)}')">
      <div class="flagged-header">
        <span class="verdict-badge verdict-flagged">flagged</span>
        <span style="font-size:11px; color:var(--text-muted);">${formatTime(r.timestamp)}</span>
      </div>
      <div class="flagged-reason">${esc(r.flagReason || 'Needs human review')}</div>
      <div class="flagged-request">${esc(r.request)}</div>
    </div>
  `).join('');
}

/* ── Panel Tab Switching ──────────────────────────────────────────── */
window.switchPanelTab = function(tab) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel-view').forEach(v => v.classList.remove('active'));

  const tabs = ['submit', 'flagged', 'detail'];
  const idx = tabs.indexOf(tab);
  if (idx >= 0) {
    document.querySelectorAll('.panel-tab')[idx].classList.add('active');
    document.getElementById(tab + 'View').classList.add('active');
  }
};

/* ── Init ─────────────────────────────────────────────────────────── */
window.loadStats = loadStats;
window.loadReviews = loadReviews;

loadStats();
loadReviews();
setTimeout(renderFlaggedItems, 500);

// Re-render flagged when reviews load
const origRender = renderReviews;
window._origRenderReviews = origRender;

})();
</script>
</body>
</html>
