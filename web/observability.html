<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - 可观测</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-hover:     #1c2d42;
  --bg-input:     #0c1322;
  --border:       #1e2d40;
  --border-light: #2d4054;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #5a6d82;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --purple:       #a855f7;
  --yellow:       #eab308;
  --red:          #ef4444;
  --orange:       #f59e0b;
  --cyan:         #06b6d4;
  --pink:         #ec4899;
  --radius:       8px;
  --radius-lg:    12px;
  --transition:   200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; overflow: hidden; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }

/* ── Top Bar ─────────────────────────────────────────────── */
.topbar {
  height: 50px; background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 50; position: relative;
}
.topbar::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2) 50%, transparent); }
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(99,102,241,0.35); }
.topbar-logo svg { width: 16px; height: 16px; color: #fff; }
.topbar-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #93c5fd, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.topbar-page { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-left: 8px; }
.topbar-spacer { flex: 1; }
.topbar-btn { width: 34px; height: 34px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: var(--transition); }
.topbar-btn:hover { background: var(--bg-hover); color: var(--text-dim); }
.topbar-btn svg { width: 17px; height: 17px; }

/* ── Layout ──────────────────────────────────────────────── */
.page-layout { flex: 1; display: grid; grid-template-columns: 248px 1fr; overflow: hidden; transition: grid-template-columns 300ms cubic-bezier(0.16,1,0.3,1); }
.page-layout.sidebar-collapsed { grid-template-columns: 0px 1fr; }

/* ── Sidebar ─────────────────────────────────────────────── */
.page-sidebar {
  background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  width: 248px; min-width: 248px; max-width: 248px;
  transition: all 300ms cubic-bezier(0.16,1,0.3,1);
}
.sidebar-collapsed .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.page-sidebar-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 16px; }
.nav-group { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(30,45,64,0.6); }
.nav-group:last-child { border-bottom: none; }
.nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-muted); font-weight: 600; padding: 10px 10px 5px; user-select: none; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim); text-decoration: none; transition: var(--transition); position: relative; border: 1px solid transparent; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; border-color: var(--border); }
.nav-item.active { background: rgba(59,130,246,0.08); color: var(--accent-hover); font-weight: 500; border-color: rgba(59,130,246,0.15); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.55; }
.nav-item:hover svg { opacity: 0.8; }
.nav-item.active svg { opacity: 1; }

.page-content { overflow-y: auto; }

@media (max-width: 1024px) {
  .page-layout { grid-template-columns: 0px 1fr; }
  .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
}

/* ── Observability Main Layout ───────────────────────────── */
.obs-layout { flex: 1; display: grid; grid-template-columns: 340px 1fr; overflow: hidden; height: 100%; }
.trace-list-panel {
  background: var(--bg-base); border-right: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
}
.content-area { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }

/* ── Toolbar ──────────────────────────────────────────────── */
.toolbar {
  display: flex; gap: 10px; align-items: center; padding: 12px 14px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.toolbar input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 7px 10px 7px 32px; color: var(--text); font-size: 12px;
  font-family: var(--font); transition: var(--transition);
}
.toolbar input:focus { border-color: var(--accent); outline: none; }
.toolbar select {
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 7px 10px; color: var(--text); font-size: 12px;
  font-family: var(--font); cursor: pointer; transition: var(--transition);
}
.toolbar select:focus { border-color: var(--accent); outline: none; }
.search-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
.search-wrapper svg { position: absolute; left: 10px; width: 14px; height: 14px; color: var(--text-muted); pointer-events: none; }

.btn {
  padding: 7px 14px; border-radius: var(--radius); font-size: 12px; font-weight: 500;
  cursor: pointer; border: none; transition: var(--transition); font-family: var(--font);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn svg { width: 13px; height: 13px; }

/* ── Trace List ──────────────────────────────────────────── */
.trace-item {
  padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
  transition: var(--transition);
}
.trace-item:hover { background: var(--bg-hover); }
.trace-item.selected { background: rgba(59,130,246,0.08); border-left: 3px solid var(--accent); }
.trace-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.trace-id { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 600; }
.trace-time { font-size: 11px; color: var(--text-muted); }
.trace-operation { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.trace-meta { display: flex; gap: 10px; font-size: 11px; color: var(--text-muted); }
.trace-meta-item { display: flex; align-items: center; gap: 4px; }

/* ── Status Badges ───────────────────────────────────────── */
.status-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
  border-radius: 10px; font-size: 10px; font-weight: 600; text-transform: uppercase;
}
.status-ok { background: rgba(34,197,94,0.15); color: var(--green); }
.status-error { background: rgba(239,68,68,0.15); color: var(--red); }
.status-pending { background: rgba(245,158,11,0.15); color: var(--orange); }

/* ── Waterfall Chart ─────────────────────────────────────── */
.waterfall-container {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px; overflow-x: auto;
}
.waterfall-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.waterfall-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.waterfall-title svg { width: 18px; height: 18px; color: var(--accent); }
.waterfall-subtitle { font-size: 12px; color: var(--text-muted); }
.waterfall-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; min-height: 28px; }
.waterfall-label {
  width: 160px; flex-shrink: 0; font-size: 12px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.waterfall-bar-container { flex: 1; position: relative; height: 20px; }
.waterfall-bar {
  position: absolute; height: 100%; border-radius: 3px; min-width: 4px;
  transition: opacity var(--transition); cursor: pointer;
}
.waterfall-bar:hover { opacity: 0.8; }
.waterfall-bar-tooltip {
  display: none; position: absolute; top: -32px; left: 50%; transform: translateX(-50%);
  background: var(--bg-surface); border: 1px solid var(--border); padding: 4px 8px;
  border-radius: 4px; font-size: 10px; white-space: nowrap; z-index: 10;
}
.waterfall-bar:hover .waterfall-bar-tooltip { display: block; }
.waterfall-time-axis {
  display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted);
  padding-left: 172px; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 6px;
}
.waterfall-duration { font-size: 11px; color: var(--text-dim); font-family: var(--mono); width: 70px; text-align: right; flex-shrink: 0; }

/* ── Metrics Panel ───────────────────────────────────────── */
.metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.metric-card {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 18px; transition: var(--transition);
}
.metric-card:hover { border-color: var(--border-light); }
.metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.metric-label svg { width: 13px; height: 13px; opacity: 0.6; }
.metric-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.metric-value.green { color: var(--green); }
.metric-value.blue { color: var(--accent); }
.metric-value.orange { color: var(--orange); }
.metric-value.red { color: var(--red); }
.metric-unit { font-size: 14px; font-weight: 400; color: var(--text-muted); margin-left: 4px; }
.metric-change { font-size: 11px; margin-top: 6px; }
.metric-change.up { color: var(--green); }
.metric-change.down { color: var(--red); }

/* ── Histogram ───────────────────────────────────────────── */
.histogram-container {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px;
}
.histogram-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.histogram-bars { display: flex; align-items: flex-end; gap: 3px; height: 100px; }
.histogram-bar {
  flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-width: 8px;
  transition: var(--transition); position: relative; cursor: pointer;
}
.histogram-bar:hover { background: var(--accent-hover); }
.histogram-bar-label {
  display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  background: var(--bg-surface); border: 1px solid var(--border); padding: 2px 6px;
  border-radius: 3px; font-size: 9px; white-space: nowrap; margin-bottom: 4px;
}
.histogram-bar:hover .histogram-bar-label { display: block; }
.histogram-axis { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--text-muted); }

/* ── Section Header ──────────────────────────────────────── */
.section-header { display: flex; justify-content: space-between; align-items: center; }
.section-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.section-title svg { width: 18px; height: 18px; color: var(--accent); }
.section-subtitle { font-size: 12px; color: var(--text-muted); }
.auto-refresh-badge {
  display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--green);
  padding: 4px 10px; background: rgba(34,197,94,0.1); border-radius: 10px;
}
.auto-refresh-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }

/* ── Span Detail Overlay ─────────────────────────────────── */
.span-detail-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  z-index: 100; display: flex; justify-content: flex-end; opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.span-detail-overlay.show { opacity: 1; pointer-events: all; }
.span-detail-panel {
  width: 480px; max-width: 90vw; background: var(--bg-base); border-left: 1px solid var(--border);
  overflow-y: auto; padding: 24px; transform: translateX(100%); transition: transform 0.3s ease;
}
.span-detail-overlay.show .span-detail-panel { transform: translateX(0); }
.span-detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.span-detail-title { font-size: 17px; font-weight: 700; }
.span-detail-close { background: none; border: none; color: var(--text-dim); cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); transition: var(--transition); }
.span-detail-close:hover { background: var(--bg-hover); color: var(--text); }
.span-detail-close svg { width: 18px; height: 18px; }
.span-detail-section { margin-bottom: 18px; }
.span-detail-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
.span-detail-value { font-size: 13px; color: var(--text); word-break: break-all; }
.span-detail-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.span-detail-tag { padding: 3px 8px; background: var(--bg-surface); border-radius: 4px; font-size: 11px; color: var(--text-dim); }
.span-detail-json {
  background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto;
}

/* ── Empty State ─────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 60px 20px; color: var(--text-muted); text-align: center;
}
.empty-icon { opacity: 0.3; }
.empty-icon svg { width: 40px; height: 40px; }
.empty-title { font-size: 15px; font-weight: 600; color: var(--text-dim); }
.empty-sub { font-size: 12px; max-width: 280px; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 768px) {
  .page-sidebar {
    position: fixed; left: 0; top: 50px; bottom: 0; z-index: 100; width: 248px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .obs-layout { grid-template-columns: 1fr; }
  .trace-list-panel { max-height: 40vh; }
}
</style>
</head>

/* -- Helper Functions --------------------------------------------------- */
function esc(s) { const d = document.createElement('div'); d.textContent = String(s || ''); return d.innerHTML; }

function formatDuration(ms) {
  if (ms < 1) return '<1ms';
  if (ms < 1000) return ms.toFixed(0) + 'ms';
  return (ms / 1000).toFixed(2) + 's';
}

function formatTime(ts) {
  try { return new Date(ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
  catch { return '--'; }
}

function serviceColor(svc) {
  const map = {
    gateway: 'var(--accent)', orchestrator: 'var(--purple)', planner: 'var(--cyan)',
    storage: 'var(--green)', router: 'var(--orange)', executor: 'var(--pink)',
    'tool-runner': '#f97316', 'llm-proxy': '#a855f7', sandbox: '#14b8a6',
    audit: 'var(--text-muted)', websocket: '#06b6d4', chat: '#ec4899',
    curator: '#8b5cf6',
  };
  return map[svc] || 'var(--accent)';
}

/* -- Load & Render Traces ----------------------------------------------- */
async function loadTraces() {
  try {
    traces = await fetch(API_BASE + '/traces').then(r => r.json());
  } catch {
    traces = MOCK_TRACES;
  }
  renderTraceList();
}

function renderTraceList() {
  const search = document.getElementById('traceSearch').value.toLowerCase();
  const filter = document.getElementById('traceFilter').value;
  let filtered = traces;
  if (search) filtered = filtered.filter(t => t.trace_id.includes(search) || t.root_operation.toLowerCase().includes(search));
  if (filter !== 'all') filtered = filtered.filter(t => t.status === filter);

  const el = document.getElementById('traceList');
  const empty = document.getElementById('traceListEmpty');

  if (!filtered.length) {
    el.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  el.innerHTML = filtered.map(t => `
    <div class="trace-item ${t.trace_id === selectedTraceId ? 'selected' : ''}"
         onclick="selectTrace('${esc(t.trace_id)}')"
         style="animation: fadeInUp 0.3s ease both;">
      <div class="trace-item-header">
        <span class="trace-id">${esc(t.trace_id.slice(0, 16))}</span>
        <span class="trace-time">${formatTime(t.timestamp)}</span>
      </div>
      <div class="trace-operation">${esc(t.root_operation)}</div>
      <div class="trace-meta">
        <span class="trace-meta-item"><span class="status-badge ${t.status === 'ok' ? 'status-ok' : 'status-error'}">${t.status.toUpperCase()}</span></span>

        </span>
        <span class="trace-meta-item">

          ${formatDuration(t.duration_ms)}
        </span>
      </div>
    </div>
  `).join('');
}

/* -- Select Trace ------------------------------------------------------- */
window.selectTrace = async function(traceId) {
  selectedTraceId = traceId;

  try {
    selectedTrace = await fetch(API_BASE + '/traces/' + traceId).then(r => r.json());
  } catch {
    selectedTrace = traces.find(t => t.trace_id === traceId) || null;
  }

  if (!selectedTrace) return;

  renderTraceList();
  renderTraceDetail();
};

function renderTraceDetail() {
  const t = selectedTrace;
  if (!t) return;

  document.getElementById('traceDetail').style.display = 'block';
  document.getElementById('contentEmpty').style.display = 'none';

  document.getElementById('traceDetailSubtitle').textContent = `时间戳: ${formatTime(t.timestamp)}`;
  document.getElementById('detailTraceId').textContent = t.trace_id;
  document.getElementById('detailRootOp').textContent = t.root_operation;
  document.getElementById('detailDuration').textContent = formatDuration(t.duration_ms);
  document.getElementById('detailSpanCount').textContent = t.span_count;
  document.getElementById('detailStatus').innerHTML =
    `<span class="status-badge ${t.status === 'ok' ? 'status-ok' : 'status-error'}" style="font-size:13px;">${t.status.toUpperCase()}</span>`;

  renderWaterfall(t.spans || [], t.duration_ms);
}

window.closeTraceDetail = function() {
  document.getElementById('traceDetail').style.display = 'none';
  document.getElementById('contentEmpty').style.display = 'flex';
  selectedTraceId = null;
  selectedTrace = null;
  renderTraceList();
};

/* -- Waterfall Rendering ------------------------------------------------ */
function renderWaterfall(spans, totalMs) {
  const container = document.getElementById('waterfallRows');
  const axis = document.getElementById('waterfallAxis');
  document.getElementById('waterfallSubtitle').textContent = `${spans.length} 个跨度, 总耗时 ${formatDuration(totalMs)}`;

  if (!spans.length || !totalMs) {
    container.innerHTML = '<div style="padding:20px; color:var(--text-muted); text-align:center;">无跨度数据</div>';
    axis.innerHTML = '';
    return;
  }

  container.innerHTML = spans.map((s, i) => {
    const leftPct = (s.start_ms / totalMs) * 100;
    const widthPct = Math.max((s.duration_ms / totalMs) * 100, 0.5);
    const color = serviceColor(s.service);
    return `
      <div class="waterfall-row" style="animation: fadeInUp ${0.1 + i * 0.05}s ease both;">
        <div class="waterfall-label" title="${esc(s.operation)}">${esc(s.operation)}</div>
        <div class="waterfall-bar-container">
          <div class="waterfall-bar" style="left:${leftPct}%; width:${widthPct}%; background:${color};"
               onclick="showSpanDetail('${esc(s.span_id)}')">
            <div class="waterfall-bar-tooltip">${esc(s.service)} | ${formatDuration(s.duration_ms)}</div>
          </div>
        </div>
        <div class="waterfall-duration">${formatDuration(s.duration_ms)}</div>
      </div>
    `;
  }).join('');

  const ticks = 5;
  let axisHtml = '';
  for (let i = 0; i <= ticks; i++) {
    axisHtml += `<span>${formatDuration((totalMs / ticks) * i)}</span>`;
  }
  axis.innerHTML = axisHtml;
}

/* -- Span Detail -------------------------------------------------------- */
window.showSpanDetail = function(spanId) {
  if (!selectedTrace) return;
  const span = selectedTrace.spans.find(s => s.span_id === spanId);
  if (!span) return;

  document.getElementById('spanDetailTitle').textContent = span.operation;
  const content = document.getElementById('spanDetailContent');
  content.innerHTML = `
    <div class="span-detail-section">
      <div class="span-detail-label">跨度 ID</div>
      <div class="span-detail-value" style="font-family:var(--mono);">${esc(span.span_id)}</div>
    </div>
    <div class="span-detail-section">
      <div class="span-detail-label">服务</div>
      <div class="span-detail-value">${esc(span.service)}</div>
    </div>
    <div class="span-detail-section">
      <div class="span-detail-label">状态</div>
      <div><span class="status-badge ${span.status === 'ok' ? 'status-ok' : 'status-error'}">${span.status.toUpperCase()}</span></div>
    </div>
    <div class="span-detail-section">
      <div class="span-detail-label">耗时</div>
      <div class="span-detail-value">开始: ${formatDuration(span.start_ms)} | 耗时: ${formatDuration(span.duration_ms)}</div>
    </div>
    ${Object.keys(span.tags || {}).length ? `
    <div class="span-detail-section">
      <div class="span-detail-label">标签</div>
      <div class="span-detail-tags">
        ${Object.entries(span.tags).map(([k,v]) => `<span class="span-detail-tag">${esc(k)}: ${esc(v)}</span>`).join('')}
      </div>
    </div>` : ''}
    <div class="span-detail-section">
      <div class="span-detail-label">原始 JSON</div>
      <div class="span-detail-json">${esc(JSON.stringify(span, null, 2))}</div>
    </div>
  `;

  document.getElementById('spanDetailOverlay').classList.add('show');
};

window.closeSpanDetail = function() {
  document.getElementById('spanDetailOverlay').classList.remove('show');
};

document.getElementById('spanDetailOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeSpanDetail();
});

/* -- Metrics ------------------------------------------------------------ */
async function loadMetrics() {
  try {
    metrics = await fetch(API_BASE + '/metrics').then(r => r.json());
  } catch {
    metrics = MOCK_METRICS;
  }
  renderMetrics();
}

function renderMetrics() {
  const grid = document.getElementById('metricsGrid');

  const metricIcons = {
    requests_total: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
    errors_total: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    agent_invocations: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>',
    ws_connections: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>',
    busy_agents: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
    memory_mb: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>',
    uptime_hours: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  };

  const defaultIcon = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>';

  const counterCards = (metrics.counters || []).map(c => `
    <div class="metric-card">
      <div class="metric-label">${metricIcons[c.name] || defaultIcon} ${esc(METRIC_LABELS[c.name] || c.name.replace(/_/g, ' '))}</div>
      <div class="metric-value">${typeof c.value === 'number' ? c.value.toLocaleString() : c.value}</div>
      ${c.change ? `<div class="metric-change ${c.changeDir === 'up' && c.name.includes('error') ? 'down' : c.changeDir}">${esc(c.change)}</div>` : ''}
    </div>
  `).join('');

  const gaugeCards = (metrics.gauges || []).map(g => `
    <div class="metric-card">
      <div class="metric-label">${metricIcons[g.name] || defaultIcon} ${esc(METRIC_LABELS[g.name] || g.name.replace(/_/g, ' '))}</div>
      <div class="metric-value ${g.color || ''}">${g.value}<span class="metric-unit">${g.unit || ''}</span></div>
    </div>
  `).join('');

  grid.innerHTML = counterCards + gaugeCards;

  // Histogram
  const hist = metrics.histogram;
  if (hist && hist.buckets && hist.buckets.length) {
    document.getElementById('histogramContainer').style.display = 'block';
    document.getElementById('histogramTitle').textContent = hist.title || '直方图';
    const maxCount = Math.max(...hist.buckets.map(b => b.count));
    const bars = document.getElementById('histogramBars');
    bars.innerHTML = hist.buckets.map(b => {
      const heightPct = maxCount > 0 ? (b.count / maxCount) * 100 : 0;
      return `
        <div class="histogram-bar" style="height:${heightPct}%;">
          <div class="histogram-bar-label">${b.label}: ${b.count.toLocaleString()}</div>
        </div>
      `;
    }).join('');
    document.getElementById('histogramAxis').innerHTML = hist.buckets.map(b => `<span>${b.label}</span>`).join('');
  }
}

/* -- Auto Refresh ------------------------------------------------------- */
function startAutoRefresh() {
  refreshTimer = setInterval(() => {
    loadMetrics();
  }, 5000);
}

/* -- Search & Filter ---------------------------------------------------- */
document.getElementById('traceSearch').addEventListener('input', renderTraceList);
document.getElementById('traceFilter').addEventListener('change', renderTraceList);

/* -- Sidebar Toggle ----------------------------------------------------- */
document.getElementById('sidebarToggle').addEventListener('click', function() {
  document.getElementById('pageLayout').classList.toggle('sidebar-collapsed');
});

/* -- Init --------------------------------------------------------------- */
window.loadTraces = loadTraces;
loadTraces();
loadMetrics();
startAutoRefresh();

})();
</script>
