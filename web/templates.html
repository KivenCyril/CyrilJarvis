<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - 模板</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-hover:     #1c2d42;
  --bg-input:     #0c1322;
  --border:       #1e2d40;
  --border-light: #2d4054;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #5a6d82;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --purple:       #a855f7;
  --yellow:       #eab308;
  --red:          #ef4444;
  --radius:       8px;
  --radius-lg:    12px;
  --transition:   200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; overflow: hidden; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }

/* ── Top Bar ─────────────────────────────────────────────── */
.topbar {
  height: 50px; background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 50; position: relative;
}
.topbar::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2) 50%, transparent); }
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(99,102,241,0.35); }
.topbar-logo svg { width: 16px; height: 16px; color: #fff; }
.topbar-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #93c5fd, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.topbar-page { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-left: 8px; }
.topbar-spacer { flex: 1; }
.topbar-btn { width: 34px; height: 34px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: var(--transition); }
.topbar-btn:hover { background: var(--bg-hover); color: var(--text-dim); }
.topbar-btn svg { width: 17px; height: 17px; }

/* ── Layout ──────────────────────────────────────────────── */
.page-layout { flex: 1; display: grid; grid-template-columns: 248px 1fr; overflow: hidden; transition: grid-template-columns 300ms cubic-bezier(0.16,1,0.3,1); }
.page-layout.sidebar-collapsed { grid-template-columns: 0px 1fr; }

/* ── Sidebar ─────────────────────────────────────────────── */
.page-sidebar {
  background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  width: 248px; min-width: 248px; max-width: 248px;
  transition: all 300ms cubic-bezier(0.16,1,0.3,1);
}
.sidebar-collapsed .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.page-sidebar-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 16px; }
.nav-group { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(30,45,64,0.6); }
.nav-group:last-child { border-bottom: none; }
.nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-muted); font-weight: 600; padding: 10px 10px 5px; user-select: none; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim); text-decoration: none; transition: var(--transition); position: relative; border: 1px solid transparent; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; border-color: var(--border); }
.nav-item.active { background: rgba(59,130,246,0.08); color: var(--accent-hover); font-weight: 500; border-color: rgba(59,130,246,0.15); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.55; }
.nav-item:hover svg { opacity: 0.8; }
.nav-item.active svg { opacity: 1; }

.page-content { overflow-y: auto; }

@media (max-width: 1024px) {
  .page-layout { grid-template-columns: 0px 1fr; }
  .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
}

/* ── Content ─────────────────────────────────────────────── */
.container { max-width: 1100px; margin: 0 auto; padding: 24px; }

.stats-bar { display: flex; gap: 20px; margin-bottom: 24px; padding: 16px 20px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.stat-item { text-align: center; flex: 1; }
.stat-value { font-size: 22px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab { padding: 10px 20px; border: none; background: none; color: var(--text-dim); font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: var(--transition); font-family: var(--font); }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }

.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

.tpl-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; transition: var(--transition); cursor: pointer; }
.tpl-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.tpl-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.tpl-name { font-size: 15px; font-weight: 600; }
.tpl-type { font-size: 10px; padding: 2px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
.tpl-type.spec { background: rgba(59,130,246,0.15); color: var(--accent); }
.tpl-type.prompt { background: rgba(168,85,247,0.15); color: var(--purple); }
.tpl-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.5; }
.tpl-meta { display: flex; gap: 12px; font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
.tpl-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tpl-tag { font-size: 10px; padding: 2px 8px; border-radius: 6px; background: rgba(100,116,139,0.15); color: var(--text-dim); }
.tpl-preview { background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; font-family: var(--mono); font-size: 12px; color: var(--green); margin-top: 10px; max-height: 60px; overflow: hidden; position: relative; line-height: 1.5; }
.tpl-preview::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 24px; background: linear-gradient(transparent, var(--bg-deep)); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 90%; max-width: 640px; max-height: 85vh; overflow-y: auto; padding: 24px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-title { font-size: 18px; font-weight: 600; }
.modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius); transition: var(--transition); }
.modal-close:hover { background: var(--bg-hover); color: var(--text); }
.modal-section { margin-bottom: 20px; }
.modal-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
.var-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.var-item { display: flex; align-items: center; gap: 10px; }
.var-name { font-family: var(--mono); font-size: 12px; color: var(--accent); background: rgba(59,130,246,0.1); padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
.var-input { flex: 1; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; font-family: var(--font); transition: var(--transition); }
.var-input:focus { outline: none; border-color: var(--accent); }
.constraint-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.constraint-item { padding: 6px 0; border-bottom: 1px solid rgba(30,45,64,0.4); font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
.constraint-item:last-child { border-bottom: none; }
.constraint-icon { color: var(--yellow); font-size: 12px; font-weight: 700; }
.rendered-output { background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-family: var(--mono); font-size: 12px; color: var(--green); white-space: pre-wrap; min-height: 60px; line-height: 1.5; }
.btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.btn { padding: 8px 16px; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--transition); font-family: var(--font); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-hover); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border-light); }

@media (max-width: 768px) { .tpl-grid { grid-template-columns: 1fr; } .stats-bar { flex-wrap: wrap; } }
</style>
</head>

<script>
(() => {
'use strict';

document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('pageLayout').classList.toggle('sidebar-collapsed');
});

const SPEC_TEMPLATES = [
  { name: 'code_review', label: '代码审查', desc: '审查代码变更的质量和正确性', intent: '审查以下代码变更: {changes}', vars: ['changes'], tags: ['code', 'review'], constraints: ['关注正确性', '检查安全问题'] },
  { name: 'bug_fix', label: 'Bug 修复', desc: '诊断并修复报告的 Bug', intent: '修复 Bug: {description}，受影响组件: {component}', vars: ['description', 'component'], tags: ['bug', 'fix'], constraints: ['为修复编写测试', '记录根本原因'] },
  { name: 'feature_impl', label: '功能实现', desc: '端到端实现新功能', intent: '实现功能: {feature_name}，需求: {requirements}', vars: ['feature_name', 'requirements'], tags: ['feature'], constraints: ['遵循现有模式', '添加文档'] },
  { name: 'data_analysis', label: '数据分析', desc: '分析数据并生成报告', intent: '分析 {dataset} 并报告 {metrics}', vars: ['dataset', 'metrics'], tags: ['data', 'analysis'], constraints: ['包含可视化', '引用数据来源'] },
  { name: 'documentation', label: '文档生成', desc: '生成或更新文档', intent: '记录 {target}，重点面向 {audience}', vars: ['target', 'audience'], tags: ['docs'], constraints: ['使用清晰语言', '包含示例'] },
];

const PROMPT_TEMPLATES = [
  { name: 'system_prompt', label: '系统提示词', desc: 'JARVIS 智能体基础系统提示词', template: '你是 {agent_name}，专长于 {domain}。{extra_instructions}', vars: ['agent_name', 'domain', 'extra_instructions'] },
  { name: 'task_decomposition', label: '任务分解', desc: '将复杂任务分解为子任务', template: '将以下任务分解为3-7个具体步骤: {task}', vars: ['task'] },
  { name: 'code_generation', label: '代码生成', desc: '根据需求生成代码', template: '生成 {language} 代码: {requirements}\n约束: {constraints}', vars: ['language', 'requirements', 'constraints'] },
  { name: 'summarization', label: '内容总结', desc: '总结文本内容', template: '用不超过 {max_words} 个字总结以下内容:\n{content}', vars: ['max_words', 'content'] },
];

function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function renderCards() {
  document.getElementById('spec-templates').innerHTML = SPEC_TEMPLATES.map(t => `
    <div class="tpl-card" onclick="openSpec('${t.name}')">
      <div class="tpl-card-header"><span class="tpl-name">${t.label}</span><span class="tpl-type spec">规格</span></div>
      <div class="tpl-desc">${t.desc}</div>
      <div class="tpl-meta"><span>${t.vars.length} 个变量</span><span>${(t.constraints||[]).length} 个约束</span></div>
      <div class="tpl-tags">${t.tags.map(g => '<span class="tpl-tag">'+g+'</span>').join('')}</div>
      <div class="tpl-preview">${t.intent}</div>
    </div>`).join('');

  document.getElementById('prompt-templates').innerHTML = PROMPT_TEMPLATES.map(t => `
    <div class="tpl-card" onclick="openPrompt('${t.name}')">
      <div class="tpl-card-header"><span class="tpl-name">${t.label}</span><span class="tpl-type prompt">提示词</span></div>
      <div class="tpl-desc">${t.desc}</div>
      <div class="tpl-meta"><span>${t.vars.length} 个变量</span></div>
      <div class="tpl-preview">${t.template}</div>
    </div>`).join('');
}

window.openSpec = function(name) {
  const t = SPEC_TEMPLATES.find(x => x.name === name);
  if (!t) return;
  document.getElementById('modalTitle').textContent = t.label;
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-section"><div class="modal-section-label">描述</div><p style="color:var(--text-dim);font-size:13px">${t.desc}</p></div>
    <div class="modal-section"><div class="modal-section-label">意图模板</div><div class="rendered-output">${t.intent}</div></div>
    <div class="modal-section"><div class="modal-section-label">变量</div>
      <ul class="var-list">${t.vars.map(v => '<li class="var-item"><span class="var-name">{'+v+'}</span><input type="text" class="var-input" placeholder="输入 '+v+'..." id="var-'+v+'" oninput="updateSpecPreview(\''+name+'\')"></li>').join('')}</ul>
    </div>
    ${t.constraints && t.constraints.length ? '<div class="modal-section"><div class="modal-section-label">默认约束</div><ul class="constraint-list">'+t.constraints.map(c => '<li class="constraint-item"><span class="constraint-icon">!</span>'+c+'</li>').join('')+'</ul></div>' : ''}
    <div class="modal-section"><div class="modal-section-label">预览</div><div class="rendered-output" id="renderPreview">${t.intent}</div></div>
    <div class="btn-row"><button class="btn btn-secondary" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick="renderAndUse('${name}','spec')">渲染并使用</button></div>`;
  document.getElementById('modalOverlay').classList.add('active');
};

window.openPrompt = function(name) {
  const t = PROMPT_TEMPLATES.find(x => x.name === name);
  if (!t) return;
  document.getElementById('modalTitle').textContent = t.label;
  document.getElementById('modalBody').innerHTML = `
    <div class="modal-section"><div class="modal-section-label">描述</div><p style="color:var(--text-dim);font-size:13px">${t.desc}</p></div>
    <div class="modal-section"><div class="modal-section-label">模板</div><div class="rendered-output">${t.template}</div></div>
    <div class="modal-section"><div class="modal-section-label">变量</div>
      <ul class="var-list">${t.vars.map(v => '<li class="var-item"><span class="var-name">{'+v+'}</span><input type="text" class="var-input" placeholder="输入 '+v+'..." id="var-'+v+'" oninput="updatePromptPreview(\''+name+'\')"></li>').join('')}</ul>
    </div>
    <div class="modal-section"><div class="modal-section-label">预览</div><div class="rendered-output" id="renderPreview">${t.template}</div></div>
    <div class="btn-row"><button class="btn btn-secondary" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick="renderAndUse('${name}','prompt')">渲染</button></div>`;
  document.getElementById('modalOverlay').classList.add('active');
};

window.updateSpecPreview = function(name) {
  const t = SPEC_TEMPLATES.find(x => x.name === name);
  if (!t) return;
  let r = t.intent;
  t.vars.forEach(v => { const el = document.getElementById('var-'+v); if (el && el.value) r = r.replace('{'+v+'}', el.value); });
  document.getElementById('renderPreview').textContent = r;
};

window.updatePromptPreview = function(name) {
  const t = PROMPT_TEMPLATES.find(x => x.name === name);
  if (!t) return;
  let r = t.template;
  t.vars.forEach(v => { const el = document.getElementById('var-'+v); if (el && el.value) r = r.replace('{'+v+'}', el.value); });
  document.getElementById('renderPreview').textContent = r;
};

window.renderAndUse = function(name, type) {
  const templates = type === 'spec' ? SPEC_TEMPLATES : PROMPT_TEMPLATES;
  const t = templates.find(x => x.name === name);
  if (!t) return;
  let r = type === 'spec' ? t.intent : t.template;
  t.vars.forEach(v => { const el = document.getElementById('var-'+v); if (el && el.value) r = r.replace('{'+v+'}', el.value); });
  document.getElementById('renderPreview').textContent = r;
};

window.closeModal = function() { document.getElementById('modalOverlay').classList.remove('active'); };

renderCards();
})();
</script>
</body>
</html>
