<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - 智能体</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-hover:     #1c2d42;
  --bg-input:     #0c1322;
  --border:       #1e2d40;
  --border-light: #2d4054;
  --border-focus: #6366f1;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #5a6d82;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --orange:       #f59e0b;
  --red:          #ef4444;
  --purple:       #a855f7;
  --cyan:         #06b6d4;
  --pink:         #ec4899;
  --yellow:       #eab308;
  --radius:       8px;
  --radius-lg:    12px;
  --transition:   200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --font:         -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; overflow: hidden; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.3); border-radius: 3px; }

/* ── Top Bar ─────────────────────────────────────────────── */
.topbar {
  height: 50px; background: rgba(15,23,42,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  padding: 0 16px; gap: 12px; flex-shrink: 0; z-index: 50; position: relative;
}
.topbar::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(59,130,246,0.2) 50%, transparent); }
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #3b82f6, #7c3aed); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(99,102,241,0.35); }
.topbar-logo svg { width: 16px; height: 16px; color: #fff; }
.topbar-title { font-size: 14px; font-weight: 700; letter-spacing: 2px; background: linear-gradient(135deg, #93c5fd, #c4b5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.topbar-page { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-left: 8px; }
.topbar-spacer { flex: 1; }
.topbar-btn { width: 34px; height: 34px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: var(--transition); }
.topbar-btn:hover { background: var(--bg-hover); color: var(--text-dim); }
.topbar-btn svg { width: 17px; height: 17px; }

/* ── Layout ──────────────────────────────────────────────── */
.page-layout { flex: 1; display: grid; grid-template-columns: 248px 1fr; overflow: hidden; transition: grid-template-columns 300ms cubic-bezier(0.16,1,0.3,1); }
.page-layout.sidebar-collapsed { grid-template-columns: 0px 1fr; }

/* ── Sidebar ─────────────────────────────────────────────── */
.page-sidebar {
  background: var(--bg-base); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  width: 248px; min-width: 248px; max-width: 248px;
  transition: all 300ms cubic-bezier(0.16,1,0.3,1);
}
.sidebar-collapsed .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.page-sidebar-scroll { flex: 1; overflow-y: auto; padding: 12px 10px 16px; }
.nav-group { margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(30,45,64,0.6); }
.nav-group:last-child { border-bottom: none; }
.nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--text-muted); font-weight: 600; padding: 10px 10px 5px; user-select: none; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim); text-decoration: none; transition: var(--transition); position: relative; border: 1px solid transparent; }
.nav-item:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; border-color: var(--border); }
.nav-item.active { background: rgba(59,130,246,0.08); color: var(--accent-hover); font-weight: 500; border-color: rgba(59,130,246,0.15); }
.nav-item.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.55; }
.nav-item:hover svg { opacity: 0.8; }
.nav-item.active svg { opacity: 1; }

.page-content { overflow-y: auto; }

@media (max-width: 1024px) {
  .page-layout { grid-template-columns: 0px 1fr; }
  .page-sidebar { transform: translateX(-100%); opacity: 0; pointer-events: none; }
}

/* ── Main Content Layout ────────────────────────────────── */
.main-layout { height: 100%; display: grid; grid-template-columns: 1fr 400px; overflow: hidden; }
.content-area { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.right-panel {
  background: var(--bg-base); border-left: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
}

/* ── Agent Grid ──────────────────────────────────────────── */
.agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.agent-card {
  background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px; cursor: pointer; transition: var(--transition);
  animation: fadeInUp 0.3s ease both;
}
.agent-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.agent-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.agent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.agent-name { font-size: 16px; font-weight: 700; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.status-online { background: var(--green); box-shadow: 0 0 6px var(--green); }
.status-idle { background: var(--orange); }
.status-offline { background: var(--text-muted); }
.agent-domain {
  display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 11px;
  font-weight: 600; text-transform: uppercase; margin-bottom: 8px;
}
.domain-orchestrator { background: rgba(99,102,241,0.15); color: #818cf8; }
.domain-coding { background: rgba(59,130,246,0.15); color: var(--accent); }
.domain-review { background: rgba(34,197,94,0.15); color: var(--green); }
.domain-research { background: rgba(168,85,247,0.15); color: var(--purple); }
.domain-ops { background: rgba(245,158,11,0.15); color: var(--orange); }
.domain-planner { background: rgba(6,182,212,0.15); color: var(--cyan); }
.agent-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.5; }
.agent-skills { display: flex; gap: 5px; flex-wrap: wrap; }
.agent-skill-tag { padding: 2px 8px; background: rgba(99,102,241,0.12); color: #818cf8; border-radius: 4px; font-size: 11px; }
.agent-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); margin-top: 10px; }
.agent-meta-item { display: flex; align-items: center; gap: 4px; }
.agent-meta-item svg { width: 12px; height: 12px; opacity: 0.6; }

/* ── Buttons ──────────────────────────────────────────────── */
.btn {
  padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
  cursor: pointer; border: none; transition: var(--transition); font-family: var(--font);
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }

/* ── Right Panel Tabs ────────────────────────────────────── */
.panel-tabs {
  display: flex; border-bottom: 1px solid var(--border); background: var(--bg-base); flex-shrink: 0;
}
.panel-tab {
  flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 600;
  color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
  transition: var(--transition); background: none; border-top: none; border-left: none; border-right: none;
  font-family: var(--font);
}
.panel-tab:hover { color: var(--text); background: var(--bg-hover); }
.panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.panel-content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
.panel-content.active { display: block; }

/* ── Detail Tab ──────────────────────────────────────────── */
.detail-section { margin-bottom: 16px; }
.detail-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 6px;
}
.detail-value { font-size: 13px; color: var(--text-dim); }
.detail-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.mode-badge {
  display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px;
  background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-dim);
}
.delegate-badge {
  display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600;
}
.delegate-yes { background: rgba(34,197,94,0.15); color: var(--green); }
.delegate-no { background: rgba(239,68,68,0.15); color: var(--red); }

/* ── Chat Tab ────────────────────────────────────────────── */
.chat-area { display: flex; flex-direction: column; height: 100%; }
.chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
.chat-msg { max-width: 90%; animation: fadeIn 0.2s ease; }
.chat-msg.user { align-self: flex-end; }
.chat-msg.agent { align-self: flex-start; }
.chat-bubble { padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
.chat-msg.user .chat-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.chat-msg.agent .chat-bubble { background: var(--bg-surface); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.chat-input-row { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
.chat-input-row input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; color: var(--text); font-size: 13px; font-family: var(--font);
  transition: var(--transition);
}
.chat-input-row input:focus { outline: none; border-color: var(--border-focus); }

/* ── Routing Tester ──────────────────────────────────────── */
.routing-input { margin-bottom: 16px; display: flex; gap: 8px; }
.routing-input input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 9px 14px; color: var(--text); font-size: 13px; font-family: var(--font);
  transition: var(--transition);
}
.routing-input input:focus { outline: none; border-color: var(--border-focus); }
.routing-results { display: flex; flex-direction: column; gap: 8px; }
.routing-row { display: flex; align-items: center; gap: 10px; }
.routing-agent-name { min-width: 90px; font-size: 13px; font-weight: 600; color: var(--text-dim); }
.routing-bar-bg { flex: 1; height: 20px; background: var(--border); border-radius: 4px; overflow: hidden; position: relative; }
.routing-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.routing-score { font-size: 12px; font-weight: 700; min-width: 40px; text-align: right; }

/* ── Delegation Log ──────────────────────────────────────── */
.delegation-table { width: 100%; font-size: 12px; border-collapse: collapse; }
.delegation-table th {
  text-align: left; padding: 8px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px;
  border-bottom: 1px solid var(--border);
}
.delegation-table td { padding: 8px; color: var(--text-dim); border-bottom: 1px solid var(--border); }

/* ── Empty State ──────────────────────────────────────────── */
.panel-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }
.panel-empty svg { margin-bottom: 12px; opacity: 0.4; }

/* ── Toast ────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
  background: var(--green); color: #fff; border-radius: var(--radius);
  font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(10px);
  transition: all 0.3s ease; z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 960px) {
  .main-layout { grid-template-columns: 1fr; }
  .right-panel { display: none; }
}
@media (max-width: 768px) {
  .agent-grid { grid-template-columns: 1fr; }
}
</style>
</head>

            <div class="chat-messages" id="chatMessages">
              <div class="panel-empty">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <div>选择一个智能体开始对话</div>
              </div>
            </div>
            <div class="chat-input-row">
              <input type="text" id="chatInput" placeholder="向智能体发送消息...">
              <button class="btn btn-primary" id="chatSendBtn">发送</button>
            </div>
          </div>
        </div>

        <!-- Routing Tab -->
        <div class="panel-content" id="tab-routing">
          <div class="routing-input">
            <input type="text" id="routingInput" placeholder="输入消息测试路由...">
            <button class="btn btn-primary" id="routingTestBtn">测试</button>
          </div>
          <div class="routing-results" id="routingResults">
            <div class="panel-empty">
              <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              <div>输入消息查看路由评分</div>
            </div>
          </div>
        </div>

        <!-- Delegations Tab -->
        <div class="panel-content" id="tab-delegations">
          <div id="delegationLog">
            <div class="panel-empty">
              <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              <div>加载委托记录中...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

const API_BASE = window.location.origin;
let allAgents = [];
let selectedAgent = null;
let chatHistory = [];

/* ── Sidebar Toggle ────────────────────────────────────────── */
document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('pageLayout').classList.toggle('sidebar-collapsed');
});

/* ── Tab Switching ─────────────────────────────────────────── */
document.querySelectorAll('.panel-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

/* ── Event Bindings ────────────────────────────────────────── */
document.getElementById('chatSendBtn').addEventListener('click', sendChat);
document.getElementById('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
document.getElementById('routingTestBtn').addEventListener('click', testRouting);
document.getElementById('routingInput').addEventListener('keydown', e => { if (e.key === 'Enter') testRouting(); });

/* ── Demo Data ─────────────────────────────────────────────── */
function generateDemoAgents() {
  return [
    { name: 'orchestrator', domain: 'orchestrator', status: 'online',
      description: '中心协调智能体。将任务路由到专业智能体，管理委托链，确保任务完成。',
      skills: ['task_routing', 'delegation', 'priority_queue', 'session_management'],
      input_modes: ['text', 'structured'], output_modes: ['text', 'structured', 'streaming'],
      can_delegate: true },
    { name: 'coder', domain: 'coding', status: 'online',
      description: '专业软件开发智能体。跨多种语言和框架编写、重构和调试代码。',
      skills: ['code_generation', 'refactoring', 'bug_fixing', 'schema_migration', 'api_development'],
      input_modes: ['text', 'code', 'diff'], output_modes: ['code', 'diff', 'text'],
      can_delegate: false },
    { name: 'reviewer', domain: 'review', status: 'online',
      description: '代码审查专家。分析差异以发现缺陷、风格违规、安全问题和性能问题。',
      skills: ['code_review', 'security_audit', 'style_check', 'perf_analysis'],
      input_modes: ['diff', 'code', 'text'], output_modes: ['text', 'structured'],
      can_delegate: false },
    { name: 'researcher', domain: 'research', status: 'idle',
      description: '信息采集与分析智能体。搜索文档、API 和知识库以获取相关信息。',
      skills: ['doc_search', 'api_exploration', 'summarization', 'knowledge_extraction'],
      input_modes: ['text', 'url'], output_modes: ['text', 'structured'],
      can_delegate: false },
    { name: 'ops', domain: 'ops', status: 'online',
      description: '运维与基础设施智能体。管理部署、监控、事件响应和系统健康。',
      skills: ['deploy_pipeline', 'monitoring', 'incident_response', 'log_analysis'],
      input_modes: ['text', 'structured'], output_modes: ['text', 'structured', 'streaming'],
      can_delegate: true },
    { name: 'planner', domain: 'planner', status: 'idle',
      description: '战略规划智能体。将复杂任务分解为可执行步骤，估算工作量，创建项目计划。',
      skills: ['task_decomposition', 'estimation', 'roadmapping', 'dependency_analysis'],
      input_modes: ['text'], output_modes: ['text', 'structured'],
      can_delegate: false },
  ];
}

function generateDemoDelegations() {
  return [
    { from: 'orchestrator', to: 'coder', task: '实现认证模块', status: 'completed', time: '2分钟前' },
    { from: 'orchestrator', to: 'reviewer', task: '审查 PR #42', status: 'completed', time: '5分钟前' },
    { from: 'orchestrator', to: 'researcher', task: '寻找最佳 JWT 库', status: 'completed', time: '8分钟前' },
    { from: 'ops', to: 'coder', task: '修复部署脚本', status: 'in_progress', time: '12分钟前' },
    { from: 'orchestrator', to: 'planner', task: '规划 v3.0 迁移', status: 'completed', time: '1小时前' },
    { from: 'orchestrator', to: 'ops', task: '部署预发构建 #156', status: 'completed', time: '2小时前' },
    { from: 'orchestrator', to: 'coder', task: '添加 WebSocket 重连', status: 'completed', time: '3小时前' },
    { from: 'orchestrator', to: 'reviewer', task: 'API 端点安全审计', status: 'completed', time: '4小时前' },
  ];
}

/* ── Status Labels ─────────────────────────────────────────── */
const STATUS_LABELS = { online: '在线', idle: '空闲', offline: '离线' };
const DELEGATION_STATUS = { completed: '已完成', in_progress: '进行中', failed: '失败' };

/* ── Fetch Agents ──────────────────────────────────────────── */
async function fetchAgents() {
  try {
    const res = await fetch(API_BASE + '/agents');
    if (!res.ok) throw new Error();
    const data = await res.json();
    allAgents = Array.isArray(data) ? data : (data.data || data.agents || []);
  } catch {
    allAgents = generateDemoAgents();
  }
  renderAgents();
  loadDelegations();
}

/* ── Render Agents ─────────────────────────────────────────── */
function renderAgents() {
  const grid = document.getElementById('agentGrid');
  grid.innerHTML = allAgents.map((a, i) => {
    const skillsHtml = (a.skills || []).slice(0, 4).map(s =>
      '<span class="agent-skill-tag">' + escapeHtml(s) + '</span>'
    ).join('');
    const extraCount = (a.skills || []).length - 4;
    const extraHtml = extraCount > 0 ? '<span class="agent-skill-tag">+' + extraCount + '</span>' : '';

    return '<div class="agent-card' + (selectedAgent && selectedAgent.name === a.name ? ' selected' : '') + '"'
      + ' data-agent="' + escapeHtml(a.name) + '"'
      + ' style="animation-delay:' + (i * 0.06) + 's">'
      + '<div class="agent-header">'
      +   '<div class="agent-name">' + escapeHtml(a.name) + '</div>'
      +   '<span class="status-dot status-' + a.status + '" title="' + (STATUS_LABELS[a.status] || a.status) + '"></span>'
      + '</div>'
      + '<span class="agent-domain domain-' + a.domain + '">' + escapeHtml(a.domain) + '</span>'
      + '<div class="agent-desc">' + escapeHtml(a.description) + '</div>'
      + '<div class="agent-skills">' + skillsHtml + extraHtml + '</div>'
      + '<div class="agent-meta">'
      +   '<span class="agent-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> ' + (a.skills || []).length + ' 个技能</span>'
      +   '<span class="agent-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg> ' + (a.can_delegate ? '可委托' : '不可委托') + '</span>'
      + '</div>'
      + '</div>';
  }).join('');

  grid.querySelectorAll('.agent-card').forEach(card => {
    card.addEventListener('click', () => selectAgent(card.dataset.agent));
  });
}

/* ── Select Agent ──────────────────────────────────────────── */
async function selectAgent(name) {
  let agent = allAgents.find(a => a.name === name);
  try {
    const res = await fetch(API_BASE + '/agents/' + encodeURIComponent(name));
    if (res.ok) { const d = await res.json(); agent = d.data || d; }
  } catch {}

  selectedAgent = agent;
  chatHistory = [];
  renderAgents();
  renderDetail();
  renderChatMessages();
}

function renderDetail() {
  if (!selectedAgent) return;
  const a = selectedAgent;
  document.getElementById('detailEmpty').style.display = 'none';
  const dc = document.getElementById('detailContent');
  dc.style.display = 'block';

  dc.innerHTML = ''
    + '<div class="detail-section">'
    +   '<div class="detail-label">名称</div>'
    +   '<div class="detail-value" style="font-size:16px;font-weight:700">' + escapeHtml(a.name) + '</div>'
    + '</div>'
    + '<div class="detail-section">'
    +   '<div class="detail-label">领域</div>'
    +   '<span class="agent-domain domain-' + a.domain + '">' + escapeHtml(a.domain) + '</span>'
    + '</div>'
    + '<div class="detail-section">'
    +   '<div class="detail-label">状态</div>'
    +   '<div class="detail-value"><span class="status-dot status-' + a.status + '"></span> ' + (STATUS_LABELS[a.status] || a.status) + '</div>'
    + '</div>'
    + '<div class="detail-section">'
    +   '<div class="detail-label">描述</div>'
    +   '<div class="detail-value">' + escapeHtml(a.description) + '</div>'
    + '</div>'
    + '<div class="detail-section">'
    +   '<div class="detail-label">技能</div>'
    +   '<div class="detail-tags">' + (a.skills || []).map(s => '<span class="agent-skill-tag">' + escapeHtml(s) + '</span>').join('') + '</div>'
    + '</div>'
    + '<div class="detail-section">'
    +   '<div class="detail-label">输入模式</div>'
    +   '<div class="detail-tags">' + (a.input_modes || []).map(m => '<span class="mode-badge">' + escapeHtml(m) + '</span>').join('') + '</div>'
    + '</div>'
    + '<div class="detail-section">'
    +   '<div class="detail-label">输出模式</div>'
    +   '<div class="detail-tags">' + (a.output_modes || []).map(m => '<span class="mode-badge">' + escapeHtml(m) + '</span>').join('') + '</div>'
    + '</div>'
    + '<div class="detail-section">'
    +   '<div class="detail-label">委托</div>'
    +   '<span class="delegate-badge ' + (a.can_delegate ? 'delegate-yes' : 'delegate-no') + '">' + (a.can_delegate ? '可委托' : '不可委托') + '</span>'
    + '</div>';
}

/* ── Chat ──────────────────────────────────────────────────── */
function renderChatMessages() {
  const container = document.getElementById('chatMessages');
  if (!selectedAgent) {
    container.innerHTML = '<div class="panel-empty"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><div>选择一个智能体开始对话</div></div>';
    return;
  }
  if (chatHistory.length === 0) {
    container.innerHTML = '<div class="panel-empty"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><div>与 ' + escapeHtml(selectedAgent.name) + ' 对话，在下方输入消息</div></div>';
    return;
  }
  container.innerHTML = chatHistory.map(m =>
    '<div class="chat-msg ' + m.role + '"><div class="chat-bubble">' + escapeHtml(m.content) + '</div></div>'
  ).join('');
  container.scrollTop = container.scrollHeight;
}

async function sendChat() {
  if (!selectedAgent) { showToast('请先选择一个智能体', true); return; }
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  chatHistory.push({ role: 'user', content: msg });
  input.value = '';
  renderChatMessages();

  try {
    const res = await fetch(API_BASE + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, agent: selectedAgent.name })
    });
    if (res.ok) {
      const data = await res.json();
      chatHistory.push({ role: 'agent', content: data.response || data.content || data.message || '已收到' });
    } else { throw new Error(); }
  } catch {
    const responses = [
      '[' + selectedAgent.name + '] 已收到，我将使用 ' + selectedAgent.domain + ' 领域的能力处理您的请求。',
      '[' + selectedAgent.name + '] 正在分析您的请求。基于 ' + (selectedAgent.skills || []).slice(0, 2).join('、') + ' 等技能，以下是我的处理方案...',
      '[' + selectedAgent.name + '] 任务已确认，正在调用 ' + (selectedAgent.skills || []).length + ' 项可用技能进行处理。',
    ];
    chatHistory.push({ role: 'agent', content: responses[chatHistory.length % responses.length] });
  }
  renderChatMessages();
}

/* ── Routing Tester ────────────────────────────────────────── */
async function testRouting() {
  const inputVal = document.getElementById('routingInput').value.trim();
  if (!inputVal) return;

  const results = document.getElementById('routingResults');
  let scores = null;

  try {
    const res = await fetch(API_BASE + '/agents/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: inputVal })
    });
    if (res.ok) {
      const data = await res.json();
      scores = data.scores || data;
    }
  } catch {}

  if (!scores) {
    const keywords = {
      orchestrator: ['plan', 'coordinate', 'manage', 'organize', '协调', '管理', '规划'],
      coder: ['code', 'implement', 'write', 'function', 'class', 'bug', 'fix', 'develop', 'build', '代码', '编写', '开发', '修复'],
      reviewer: ['review', 'check', 'audit', 'quality', 'pr', 'diff', '审查', '检查'],
      researcher: ['search', 'find', 'documentation', 'docs', 'look up', 'research', '搜索', '查找', '研究'],
      ops: ['deploy', 'monitor', 'incident', 'server', 'infrastructure', 'pipeline', '部署', '监控', '运维'],
      planner: ['plan', 'estimate', 'breakdown', 'roadmap', 'timeline', '计划', '估算', '分解'],
    };
    scores = {};
    const lower = inputVal.toLowerCase();
    allAgents.forEach(a => {
      const kws = keywords[a.name] || [];
      const matchCount = kws.filter(k => lower.includes(k)).length;
      scores[a.name] = Math.min(0.95, 0.1 + matchCount * 0.25 + Math.random() * 0.15);
    });
  }

  const scoreValues = Object.values(scores);
  const maxScore = Math.max(...scoreValues, 0.01);
  const topScore = Math.max(...scoreValues);
  const colors = {
    orchestrator: '#818cf8', coder: 'var(--accent)', reviewer: 'var(--green)',
    researcher: 'var(--purple)', ops: 'var(--orange)', planner: 'var(--cyan)'
  };

  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  results.innerHTML = sorted.map(([name, score]) =>
    '<div class="routing-row">'
    + '<span class="routing-agent-name">' + escapeHtml(name) + '</span>'
    + '<div class="routing-bar-bg">'
    +   '<div class="routing-bar-fill" style="width:' + ((score / maxScore) * 100) + '%;background:' + (colors[name] || 'var(--accent)') + '"></div>'
    + '</div>'
    + '<span class="routing-score" style="color:' + (score === topScore ? 'var(--green)' : 'var(--text-dim)') + '">' + (score * 100).toFixed(0) + '%</span>'
    + '</div>'
  ).join('');
}

/* ── Delegations ───────────────────────────────────────────── */
async function loadDelegations() {
  let delegations;
  try {
    const res = await fetch(API_BASE + '/delegations');
    if (!res.ok) throw new Error();
    const data = await res.json();
    delegations = Array.isArray(data) ? data : (data.data || []);
  } catch {
    delegations = generateDemoDelegations();
  }

  const log = document.getElementById('delegationLog');
  if (!delegations.length) {
    log.innerHTML = '<div class="panel-empty">暂无委托记录</div>';
    return;
  }

  const statusColors = { completed: 'var(--green)', in_progress: 'var(--orange)', failed: 'var(--red)' };
  log.innerHTML = '<table class="delegation-table">'
    + '<thead><tr><th>来源</th><th>目标</th><th>任务</th><th>状态</th><th>时间</th></tr></thead>'
    + '<tbody>'
    + delegations.map(d =>
        '<tr>'
        + '<td>' + escapeHtml(d.from) + '</td>'
        + '<td>' + escapeHtml(d.to) + '</td>'
        + '<td>' + escapeHtml(d.task) + '</td>'
        + '<td style="color:' + (statusColors[d.status] || 'var(--text-dim)') + '">' + (DELEGATION_STATUS[d.status] || d.status) + '</td>'
        + '<td>' + escapeHtml(d.time) + '</td>'
        + '</tr>'
      ).join('')
    + '</tbody></table>';
}

/* ── Utilities ─────────────────────────────────────────────── */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--red)' : 'var(--green)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ── Init ──────────────────────────────────────────────────── */
fetchAgents();

})();
</script>
</body>
</html>
