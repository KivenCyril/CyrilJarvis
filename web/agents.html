<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS - Agent Detail</title>
<style>
/* ====================================================================
   JARVIS Agent Detail — Standalone Page CSS
   ==================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:      #0a0f1e;
  --bg-base:      #0f172a;
  --bg-surface:   #1e293b;
  --bg-card:      #1e293b;
  --bg-hover:     #273549;
  --bg-input:     #0f172a;
  --border:       #334155;
  --border-light: #3f506a;
  --border-focus: #6366f1;
  --text:         #e2e8f0;
  --text-dim:     #94a3b8;
  --text-muted:   #64748b;
  --accent:       #3b82f6;
  --accent-hover: #60a5fa;
  --green:        #22c55e;
  --orange:       #f59e0b;
  --red:          #ef4444;
  --purple:       #a855f7;
  --cyan:         #06b6d4;
  --pink:         #ec4899;
  --radius:       8px;
  --radius-lg:    12px;
  --shadow:       0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md:    0 4px 12px rgba(0,0,0,0.3);
  --transition:   180ms ease;
  --font:         'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono:         'JetBrains Mono', 'Fira Code', monospace;
}

html, body { height: 100%; font-family: var(--font); background: var(--bg-deep); color: var(--text); line-height: 1.5; }
body { display: flex; flex-direction: column; overflow: hidden; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* -- Top Nav ----------------------------------------------------------- */
.topnav {
  height: 52px; background: var(--bg-base); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0;
}
.topnav-brand { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
.topnav-brand span { color: var(--text-dim); font-weight: 400; margin-left: 6px; font-size: 14px; }
.topnav-links { display: flex; gap: 4px; margin-left: 24px; flex-wrap: wrap; }
.topnav-links a {
  padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
  color: var(--text-dim); text-decoration: none; transition: var(--transition);
}
.topnav-links a:hover { background: var(--bg-hover); color: var(--text); text-decoration: none; }
.topnav-links a.active { background: var(--accent); color: #fff; }

/* -- Layout ------------------------------------------------------------ */
.main-layout { flex: 1; display: grid; grid-template-columns: 1fr 400px; overflow: hidden; }
.content-area { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.right-panel {
  background: var(--bg-base); border-left: 1px solid var(--border);
  overflow-y: auto; display: flex; flex-direction: column;
}

/* -- Agent Grid -------------------------------------------------------- */
.agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.agent-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px; cursor: pointer; transition: var(--transition);
  animation: fadeInUp 0.3s ease both;
}
.agent-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow-md); }
.agent-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.agent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.agent-name { font-size: 17px; font-weight: 700; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.status-online { background: var(--green); box-shadow: 0 0 6px var(--green); }
.status-idle { background: var(--orange); }
.status-offline { background: var(--text-muted); }
.agent-domain {
  display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 11px;
  font-weight: 600; text-transform: uppercase; margin-bottom: 8px;
}
.domain-orchestrator { background: rgba(99,102,241,0.15); color: #818cf8; }
.domain-coding { background: rgba(59,130,246,0.15); color: var(--accent); }
.domain-review { background: rgba(34,197,94,0.15); color: var(--green); }
.domain-research { background: rgba(168,85,247,0.15); color: var(--purple); }
.domain-ops { background: rgba(245,158,11,0.15); color: var(--orange); }
.domain-planner { background: rgba(6,182,212,0.15); color: var(--cyan); }
.agent-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.5; }
.agent-skills { display: flex; gap: 5px; flex-wrap: wrap; }
.agent-skill-tag { padding: 2px 8px; background: rgba(99,102,241,0.12); color: #818cf8; border-radius: 4px; font-size: 11px; }
.agent-meta { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); margin-top: 10px; }
.btn {
  padding: 9px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 600;
  cursor: pointer; border: none; transition: var(--transition);
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
.btn-ghost:hover { background: var(--bg-hover); color: var(--text); }

/* -- Right Panel Tabs -------------------------------------------------- */
.panel-tabs {
  display: flex; border-bottom: 1px solid var(--border); background: var(--bg-base);
}
.panel-tab {
  flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 600;
  color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
  transition: var(--transition);
}
.panel-tab:hover { color: var(--text); background: var(--bg-hover); }
.panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.panel-content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
.panel-content.active { display: block; }

/* -- Detail Tab -------------------------------------------------------- */
.detail-section { margin-bottom: 16px; }
.detail-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 6px;
}
.detail-value { font-size: 13px; color: var(--text-dim); }
.detail-tags { display: flex; gap: 5px; flex-wrap: wrap; }
.mode-badge {
  display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px;
  background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-dim);
}
.delegate-badge {
  display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600;
}
.delegate-yes { background: rgba(34,197,94,0.15); color: var(--green); }
.delegate-no { background: rgba(239,68,68,0.15); color: var(--red); }

/* -- Chat Tab ---------------------------------------------------------- */
.chat-area { display: flex; flex-direction: column; height: 100%; }
.chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
.chat-msg { max-width: 90%; animation: fadeIn 0.2s ease; }
.chat-msg.user { align-self: flex-end; }
.chat-msg.agent { align-self: flex-start; }
.chat-bubble {
  padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5;
}
.chat-msg.user .chat-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.chat-msg.agent .chat-bubble { background: var(--bg-surface); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.chat-input-row { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
.chat-input-row input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; color: var(--text); font-size: 13px;
}
.chat-input-row input:focus { border-color: var(--border-focus); }

/* -- Routing Tester ---------------------------------------------------- */
.routing-input { margin-bottom: 16px; display: flex; gap: 8px; }
.routing-input input {
  flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 9px 14px; color: var(--text); font-size: 13px;
}
.routing-input input:focus { border-color: var(--border-focus); }
.routing-results { display: flex; flex-direction: column; gap: 8px; }
.routing-row { display: flex; align-items: center; gap: 10px; }
.routing-agent-name { min-width: 90px; font-size: 13px; font-weight: 600; color: var(--text-dim); }
.routing-bar-bg { flex: 1; height: 20px; background: var(--border); border-radius: 4px; overflow: hidden; position: relative; }
.routing-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; position: relative; }
.routing-score { font-size: 12px; font-weight: 700; min-width: 40px; text-align: right; }

/* -- Delegation Log ---------------------------------------------------- */
.delegation-table { width: 100%; font-size: 12px; }
.delegation-table th {
  text-align: left; padding: 8px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px;
  border-bottom: 1px solid var(--border);
}
.delegation-table td { padding: 8px; color: var(--text-dim); border-bottom: 1px solid var(--border); }

/* -- Empty State ------------------------------------------------------- */
.panel-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }

.toast {
  position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
  background: var(--green); color: #fff; border-radius: var(--radius);
  font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(10px);
  transition: all 0.3s ease; z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 960px) {
  .main-layout { grid-template-columns: 1fr; }
  .right-panel { display: none; }
}
</style>
</head>
<body>

<!-- Top Navigation -->
<nav class="topnav">
  <div class="topnav-brand">JARVIS <span>Agent Detail</span></div>
  <div class="topnav-links">
    <a href="index.html">Dashboard</a>
    <a href="knowledge.html">Knowledge</a>
    <a href="workflows.html">Workflows</a>
    <a href="memory.html">Memory</a>
    <a href="skills.html">Skills</a>
    <a href="sessions.html">Sessions</a>
    <a href="tools.html">Tools</a>
    <a href="agents.html" class="active">Agents</a>
    <a href="observability.html">Observability</a>
    <a href="curator.html">Curator</a>
    <a href="api-docs.html">API Docs</a>
    <a href="chat.html">Chat</a>
    <a href="settings.html">Settings</a>
  </div>
</nav>

<div class="main-layout">
  <!-- Content -->
  <div class="content-area">
    <div class="agent-grid" id="agentGrid"></div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="panel-tabs">
      <div class="panel-tab active" onclick="switchTab('detail')">Detail</div>
      <div class="panel-tab" onclick="switchTab('chat')">Chat</div>
      <div class="panel-tab" onclick="switchTab('routing')">Routing</div>
      <div class="panel-tab" onclick="switchTab('delegations')">Delegations</div>
    </div>

    <!-- Detail Tab -->
    <div class="panel-content active" id="tab-detail">
      <div class="panel-empty" id="detailEmpty">Select an agent to view details</div>
      <div id="detailContent" style="display:none"></div>
    </div>

    <!-- Chat Tab -->
    <div class="panel-content" id="tab-chat">
      <div class="chat-area">
        <div class="chat-messages" id="chatMessages">
          <div class="panel-empty">Select an agent and start chatting</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Send a message to agent..." onkeydown="if(event.key==='Enter')sendChat()">
          <button class="btn btn-primary" onclick="sendChat()">Send</button>
        </div>
      </div>
    </div>

    <!-- Routing Tab -->
    <div class="panel-content" id="tab-routing">
      <div class="routing-input">
        <input type="text" id="routingInput" placeholder="Enter a message to test routing..." onkeydown="if(event.key==='Enter')testRouting()">
        <button class="btn btn-primary" onclick="testRouting()">Test</button>
      </div>
      <div class="routing-results" id="routingResults">
        <div class="panel-empty">Enter a message to see routing scores</div>
      </div>
    </div>

    <!-- Delegations Tab -->
    <div class="panel-content" id="tab-delegations">
      <div id="delegationLog">
        <div class="panel-empty">Loading delegations...</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====================================================================
   JARVIS Agent Detail — JavaScript
   ==================================================================== */

const API_BASE = window.location.origin;
let allAgents = [];
let selectedAgent = null;
let chatHistory = [];

// ── Demo Data ──────────────────────────────────────────────────────────
function generateDemoAgents() {
  return [
    { name: 'orchestrator', domain: 'orchestrator', status: 'online',
      description: 'Central coordination agent. Routes tasks to specialized agents, manages delegation chains, and ensures task completion.',
      skills: ['task_routing', 'delegation', 'priority_queue', 'session_management'],
      input_modes: ['text', 'structured'], output_modes: ['text', 'structured', 'streaming'],
      can_delegate: true },
    { name: 'coder', domain: 'coding', status: 'online',
      description: 'Expert software development agent. Writes, refactors, and debugs code across multiple languages and frameworks.',
      skills: ['code_generation', 'refactoring', 'bug_fixing', 'schema_migration', 'api_development'],
      input_modes: ['text', 'code', 'diff'], output_modes: ['code', 'diff', 'text'],
      can_delegate: false },
    { name: 'reviewer', domain: 'review', status: 'online',
      description: 'Code review specialist. Analyzes diffs for bugs, style violations, security issues, and performance problems.',
      skills: ['code_review', 'security_audit', 'style_check', 'perf_analysis'],
      input_modes: ['diff', 'code', 'text'], output_modes: ['text', 'structured'],
      can_delegate: false },
    { name: 'researcher', domain: 'research', status: 'idle',
      description: 'Information gathering and analysis agent. Searches documentation, APIs, and knowledge bases for relevant information.',
      skills: ['doc_search', 'api_exploration', 'summarization', 'knowledge_extraction'],
      input_modes: ['text', 'url'], output_modes: ['text', 'structured'],
      can_delegate: false },
    { name: 'ops', domain: 'ops', status: 'online',
      description: 'Operations and infrastructure agent. Manages deployments, monitoring, incident response, and system health.',
      skills: ['deploy_pipeline', 'monitoring', 'incident_response', 'log_analysis'],
      input_modes: ['text', 'structured'], output_modes: ['text', 'structured', 'streaming'],
      can_delegate: true },
    { name: 'planner', domain: 'planner', status: 'idle',
      description: 'Strategic planning agent. Breaks down complex tasks into actionable steps, estimates effort, and creates project plans.',
      skills: ['task_decomposition', 'estimation', 'roadmapping', 'dependency_analysis'],
      input_modes: ['text'], output_modes: ['text', 'structured'],
      can_delegate: false },
  ];
}

function generateDemoDelegations() {
  return [
    { from: 'orchestrator', to: 'coder', task: 'Implement auth module', status: 'completed', time: '2m ago' },
    { from: 'orchestrator', to: 'reviewer', task: 'Review PR #42', status: 'completed', time: '5m ago' },
    { from: 'orchestrator', to: 'researcher', task: 'Find best JWT library', status: 'completed', time: '8m ago' },
    { from: 'ops', to: 'coder', task: 'Fix deployment script', status: 'in_progress', time: '12m ago' },
    { from: 'orchestrator', to: 'planner', task: 'Plan v3.0 migration', status: 'completed', time: '1h ago' },
    { from: 'orchestrator', to: 'ops', task: 'Deploy staging build #156', status: 'completed', time: '2h ago' },
    { from: 'orchestrator', to: 'coder', task: 'Add WebSocket reconnection', status: 'completed', time: '3h ago' },
    { from: 'orchestrator', to: 'reviewer', task: 'Security audit on API endpoints', status: 'completed', time: '4h ago' },
  ];
}

// ── Fetch Agents ───────────────────────────────────────────────────────
async function fetchAgents() {
  try {
    const res = await fetch(`${API_BASE}/agents`);
    if (!res.ok) throw new Error();
    let data = await res.json();
    allAgents = Array.isArray(data) ? data : (data.data || data.agents || []);
  } catch {
    allAgents = generateDemoAgents();
  }
  renderAgents();
  loadDelegations();
}

// ── Render Agents ──────────────────────────────────────────────────────
function renderAgents() {
  const grid = document.getElementById('agentGrid');
  grid.innerHTML = allAgents.map((a, i) => `
    <div class="agent-card ${selectedAgent?.name === a.name ? 'selected' : ''}"
         onclick="selectAgent('${a.name}')" style="animation-delay:${i*0.06}s">
      <div class="agent-header">
        <div class="agent-name">${a.name}</div>
        <span class="status-dot status-${a.status}" title="${a.status}"></span>
      </div>
      <span class="agent-domain domain-${a.domain}">${a.domain}</span>
      <div class="agent-desc">${a.description}</div>
      <div class="agent-skills">${(a.skills||[]).slice(0,4).map(s => `<span class="agent-skill-tag">${s}</span>`).join('')}
        ${(a.skills||[]).length > 4 ? `<span class="agent-skill-tag">+${a.skills.length-4}</span>` : ''}
      </div>
      <div class="agent-meta">
        <span>${(a.skills||[]).length} skills</span>
        <span>${a.can_delegate ? 'Can delegate' : 'No delegation'}</span>
      </div>
    </div>
  `).join('');
}

// ── Select Agent ───────────────────────────────────────────────────────
async function selectAgent(name) {
  let agent = allAgents.find(a => a.name === name);
  try {
    const res = await fetch(`${API_BASE}/agents/${name}`);
    if (res.ok) { const d = await res.json(); agent = d.data || d; }
  } catch {}

  selectedAgent = agent;
  chatHistory = [];
  renderAgents();
  renderDetail();
  renderChatMessages();
}

function renderDetail() {
  if (!selectedAgent) return;
  const a = selectedAgent;
  document.getElementById('detailEmpty').style.display = 'none';
  const dc = document.getElementById('detailContent');
  dc.style.display = 'block';

  dc.innerHTML = `
    <div class="detail-section">
      <div class="detail-label">Name</div>
      <div class="detail-value" style="font-size:16px;font-weight:700">${a.name}</div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Domain</div>
      <span class="agent-domain domain-${a.domain}">${a.domain}</span>
    </div>
    <div class="detail-section">
      <div class="detail-label">Status</div>
      <div class="detail-value"><span class="status-dot status-${a.status}"></span> ${a.status}</div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Description</div>
      <div class="detail-value">${a.description}</div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Skills</div>
      <div class="detail-tags">${(a.skills||[]).map(s => `<span class="agent-skill-tag">${s}</span>`).join('')}</div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Input Modes</div>
      <div class="detail-tags">${(a.input_modes||[]).map(m => `<span class="mode-badge">${m}</span>`).join('')}</div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Output Modes</div>
      <div class="detail-tags">${(a.output_modes||[]).map(m => `<span class="mode-badge">${m}</span>`).join('')}</div>
    </div>
    <div class="detail-section">
      <div class="detail-label">Delegation</div>
      <span class="delegate-badge ${a.can_delegate ? 'delegate-yes' : 'delegate-no'}">${a.can_delegate ? 'Can Delegate' : 'No Delegation'}</span>
    </div>
  `;
}

// ── Tab Switching ──────────────────────────────────────────────────────
function switchTab(tabName) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

// ── Chat ───────────────────────────────────────────────────────────────
function renderChatMessages() {
  const container = document.getElementById('chatMessages');
  if (!selectedAgent) {
    container.innerHTML = '<div class="panel-empty">Select an agent and start chatting</div>';
    return;
  }
  if (chatHistory.length === 0) {
    container.innerHTML = `<div class="panel-empty">Chat with ${selectedAgent.name}. Type a message below.</div>`;
    return;
  }
  container.innerHTML = chatHistory.map(m => `
    <div class="chat-msg ${m.role}">
      <div class="chat-bubble">${m.content}</div>
    </div>
  `).join('');
  container.scrollTop = container.scrollHeight;
}

async function sendChat() {
  if (!selectedAgent) { showToast('Select an agent first', true); return; }
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;

  chatHistory.push({ role: 'user', content: msg });
  input.value = '';
  renderChatMessages();

  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, agent: selectedAgent.name })
    });
    if (res.ok) {
      const data = await res.json();
      chatHistory.push({ role: 'agent', content: data.response || data.content || data.message || 'OK' });
    } else { throw new Error(); }
  } catch {
    // Demo response
    const responses = [
      `[${selectedAgent.name}] Understood. I'll process that request using my ${selectedAgent.domain} capabilities.`,
      `[${selectedAgent.name}] Analyzing your request. Based on my skills in ${(selectedAgent.skills||[]).slice(0,2).join(' and ')}, here's what I can do...`,
      `[${selectedAgent.name}] Task acknowledged. Processing with ${(selectedAgent.skills||[]).length} available skills.`,
    ];
    chatHistory.push({ role: 'agent', content: responses[chatHistory.length % responses.length] });
  }
  renderChatMessages();
}

// ── Routing Tester ─────────────────────────────────────────────────────
async function testRouting() {
  const input = document.getElementById('routingInput').value.trim();
  if (!input) return;

  const results = document.getElementById('routingResults');

  // Try API first
  let scores = null;
  try {
    const res = await fetch(`${API_BASE}/agents/route`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: input })
    });
    if (res.ok) {
      const data = await res.json();
      scores = data.scores || data;
    }
  } catch {}

  // Demo scores if API unavailable
  if (!scores) {
    const keywords = {
      orchestrator: ['plan', 'coordinate', 'manage', 'organize'],
      coder: ['code', 'implement', 'write', 'function', 'class', 'bug', 'fix', 'develop', 'build'],
      reviewer: ['review', 'check', 'audit', 'quality', 'pr', 'diff'],
      researcher: ['search', 'find', 'documentation', 'docs', 'look up', 'research'],
      ops: ['deploy', 'monitor', 'incident', 'server', 'infrastructure', 'pipeline'],
      planner: ['plan', 'estimate', 'breakdown', 'roadmap', 'timeline'],
    };
    scores = {};
    const lower = input.toLowerCase();
    allAgents.forEach(a => {
      const kws = keywords[a.name] || [];
      const matchCount = kws.filter(k => lower.includes(k)).length;
      scores[a.name] = Math.min(0.95, 0.1 + matchCount * 0.25 + Math.random() * 0.15);
    });
  }

  const maxScore = Math.max(...Object.values(scores), 0.01);
  const colors = { orchestrator: '#818cf8', coder: 'var(--accent)', reviewer: 'var(--green)',
                   researcher: 'var(--purple)', ops: 'var(--orange)', planner: 'var(--cyan)' };

  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  results.innerHTML = sorted.map(([name, score]) => `
    <div class="routing-row">
      <span class="routing-agent-name">${name}</span>
      <div class="routing-bar-bg">
        <div class="routing-bar-fill" style="width:${(score/maxScore)*100}%;background:${colors[name]||'var(--accent)'}"></div>
      </div>
      <span class="routing-score" style="color:${score===Math.max(...Object.values(scores))?'var(--green)':'var(--text-dim)'}">${(score*100).toFixed(0)}%</span>
    </div>
  `).join('');
}

// ── Delegations ────────────────────────────────────────────────────────
async function loadDelegations() {
  let delegations;
  try {
    const res = await fetch(`${API_BASE}/delegations`);
    if (!res.ok) throw new Error();
    let data = await res.json();
    delegations = Array.isArray(data) ? data : (data.data || []);
  } catch {
    delegations = generateDemoDelegations();
  }

  const log = document.getElementById('delegationLog');
  if (!delegations.length) {
    log.innerHTML = '<div class="panel-empty">No delegations recorded</div>';
    return;
  }

  const statusColors = { completed: 'var(--green)', in_progress: 'var(--orange)', failed: 'var(--red)' };
  log.innerHTML = `
    <table class="delegation-table">
      <thead><tr><th>From</th><th>To</th><th>Task</th><th>Status</th><th>Time</th></tr></thead>
      <tbody>
        ${delegations.map(d => `
          <tr>
            <td>${d.from}</td>
            <td>${d.to}</td>
            <td>${d.task}</td>
            <td style="color:${statusColors[d.status]||'var(--text-dim)'}">${d.status}</td>
            <td>${d.time}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

// ── Toast ──────────────────────────────────────────────────────────────
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--red)' : 'var(--green)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ───────────────────────────────────────────────────────────────
fetchAgents();
</script>
