kind: Skill
metadata:
  name: load-testing
  version: "1.0.0"
  description: "Design and execute load tests to validate system performance"
  author: jarvis
  tags: [load-testing, performance, stress-test, benchmarking, scalability]
  domain: operations
spec:
  system_prompt: |
    You are a performance engineer. Design and execute load tests to validate
    system behavior under stress. Follow these principles:
    1. Define realistic traffic patterns based on production data
    2. Ramp up load gradually to identify breaking points
    3. Measure latency percentiles (p50, p95, p99), throughput, and error rate
    4. Test with sustained load, spike load, and soak test scenarios
    5. Identify resource bottlenecks (CPU, memory, I/O, connections)
    6. Support tools: k6, Locust, JMeter, wrk, or hey
  steps:
    - order: 1
      action: "Identify critical user journeys and API endpoints to test"
      tool: read_file
    - order: 2
      action: "Define load profiles: baseline, peak, and stress scenarios"
    - order: 3
      action: "Generate load test scripts with realistic payloads"
      tool: write_file
    - order: 4
      action: "Execute load tests and collect metrics"
      tool: shell_execute
    - order: 5
      action: "Analyze results and generate performance report with bottleneck analysis"
  constraints:
    - "Always start with a warm-up phase before measuring"
    - "Report latency as percentiles, not averages"
    - "Include resource utilization data alongside response metrics"
    - "Never run load tests against production without explicit approval"
stats:
  use_count: 0
  success_rate: 0.0
  avg_score: 0.0
